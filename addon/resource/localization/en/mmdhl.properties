# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.core=Native runtime

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.imports=Model import

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.detailed_collision=Detailed prop collision

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.rendering=Model rendering

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.physics=Native character physics

# Fallback component name before a problem in the installation banner when the component is unknown.
