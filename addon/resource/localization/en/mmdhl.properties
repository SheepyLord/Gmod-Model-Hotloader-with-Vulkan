mmdhl.physics.accuracy.help=−1: Off · 0: Jiggle · 1–7: Full physics (1, 2, 5, 10, 20, 50, 100 iterations). Jiggle moves only each chain’s first bone; children follow without bending independently. VRM spring bones run fully at every level except Off.

