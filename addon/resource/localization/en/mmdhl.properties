# What to try when a Blender file was chosen as a character.
mmdhl.library.hint.character_blend=In Blender, select the armature and its meshes, export FBX or glTF, and import that file.

# What to try when an FBX, glTF or DAE file could not be read.
mmdhl.library.hint.character_parse=The file may be damaged or use features the importer cannot read. Export it again from your 3D program, preferably as FBX or GLB.

