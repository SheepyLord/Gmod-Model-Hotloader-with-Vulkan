# ===== Importing: what to try after a failure (library.lua) =====

# Shown after "What to try:" in the import failure dialog, chosen from the importer's error message.

# Hint when a VRM avatar was imported as a static prop. "Import as character" is the button in the same dialog (mmdhl.library.failure.import_as_character).
mmdhl.library.hint.vrm_avatar=Choose Import as character below: VRM avatars become posable ragdolls with their spring-bone physics.

# Hint when a prop file (OBJ, FBX, GLB…) was imported as a character. "Static Props" is the library tab name.
mmdhl.library.hint.static_file=Import it under Static Props instead. Characters must be PMX, PMD or VRM files.

# Hint when a VRM avatar lacks required humanoid bones. VRoid Studio, UniVRM and the Blender VRM add-on are program names.
mmdhl.library.hint.vrm_humanoid=The VRM humanoid is incomplete. Export it again from VRoid Studio, UniVRM or the Blender VRM add-on with every required humanoid bone assigned.

# Hint when a VRM file refers to data in separate files.
mmdhl.library.hint.vrm_external_buffer=The VRM file refers to data stored beside it. Export it again as one self-contained .vrm file.

# Hint when a VRM file is damaged.
mmdhl.library.hint.vrm_damaged=The VRM file is damaged or incomplete. Export it again from the original program and retry.

# Hint when the file could not be opened.
mmdhl.library.hint.cannot_open=The file could not be read. Check that it still exists, is not open in another program, and that its folder is accessible.

# Hint when a prop file could not be parsed. GLB and FBX are file formats.
mmdhl.library.hint.parser=The file could not be parsed. Re-export it from its original program (GLB or FBX work best) and import again.

# Hint when a .blend file is not a valid Blender file.
mmdhl.library.hint.not_blend=This is not a readable .blend file. Save it again in Blender, or export it as GLB or FBX.

# Hint when the file has no mesh geometry. "Object > Convert > Mesh" is Blender's menu path (keep as in Blender's English UI or its translation).
mmdhl.library.hint.no_triangles=The file contains no mesh triangles; it may hold only an armature, cameras, lights, curves or text. In Blender, convert them with Object > Convert > Mesh.

# Hint when reimporting a .blend prop whose previously chosen objects no longer exist.
mmdhl.library.hint.blend_objects_changed=The objects chosen at import were renamed or removed in Blender. Import the file again to choose objects.

# Hint when a compressed .blend file is damaged. "File > Save" is Blender's menu path.
mmdhl.library.hint.blend_compressed=The compressed .blend file is damaged or incomplete. Save it again in Blender (File > Save) and retry.

# Hint when the file ends early.
mmdhl.library.hint.truncated=The file is incomplete, possibly still being written or copied. Save it again and retry.

# Hint when a .blend file contains data the importer does not support.
mmdhl.library.hint.blend_unsupported=This .blend file uses data the importer cannot read. Open it in Blender and export the model as GLB or FBX.

# Hint when a prop has more than 128 materials.
mmdhl.library.hint.material_limit=The model has too many materials (limit 128). Merge materials in the original program before importing.

# Hint when a prop file or its textures exceed 256 MB.
mmdhl.library.hint.byte_limit=The file or its textures exceed the 256 MB limit. Reduce texture sizes or split the model.

# Hint when a prop has too much geometry.
mmdhl.library.hint.geometry_budget=The geometry is too large for one prop. Split the model or decimate it.

# Hint when a PMX file is damaged or of an unsupported version.
mmdhl.library.hint.pmx=The PMX file is damaged or uses an unsupported version. PMX 2.0 and 2.1 are supported.

# Hint when a prop is extremely small. "Import scale" and "Import options" refer to the slider and section of the Static Props tab.
mmdhl.library.hint.too_small=The model is extremely small. Raise Import scale in Import options, then retry.

# Hint when a prop is extremely large. "Import scale" and "Import options" refer to the slider and section of the Static Props tab.
mmdhl.library.hint.too_large=The model is extremely large. Lower Import scale in Import options, then retry.

# Hint when a prop is far away from its origin.
mmdhl.library.hint.recenter=The model sits very far from its origin. Move it to the origin in its original program.

# Hint when the importer process stopped unexpectedly.
mmdhl.library.hint.importer_exited=The importer stopped unexpectedly. The file may be damaged or use unsupported features.

# Hint when an import took more than five minutes. "Fast collision" refers to the collision option in the Static Props import options.
mmdhl.library.hint.timeout=The import took longer than five minutes. Use the fast collision option or a smaller model.

# Hint when the chosen file type is not supported as a static prop. "Character Models" is the library tab name.
mmdhl.library.hint.unsupported_type=This file type is not supported here. Static props accept OBJ, FBX, GLB, GLTF, PMX and BLEND; PMD characters belong in Character Models.

# Hint when the model skeleton could not be read. PMX Editor is a program name.
mmdhl.library.hint.skeleton=The skeleton could not be read. The model may be damaged; try re-saving it in PMX Editor.

# Hint when no specific hint matches the error. "The details below" is the details box of the import failure dialog.
mmdhl.library.hint.default=Check the file in its original program, export it again and retry. Copy the details below when reporting the problem.

