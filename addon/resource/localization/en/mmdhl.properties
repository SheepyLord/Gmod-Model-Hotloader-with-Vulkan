mmdhl.props.editor.collision_detailed=Detailed, up to 16 hulls (slower)

# Button that saves changes to the preset being edited. Button is half of a 420 px column.
mmdhl.props.editor.save_changes=Save changes

# Button that saves a new preset. Button is half of a 420 px column.
mmdhl.props.editor.save_preset=Save preset

# Status line error when saving without a preset name.
