# First line of the installation banner, right part (after a gap). {version}: recommended native release, or mmdhl.install.unknown_version.
mmdhl.install.recommended_release=Recommended: {version}

# Shown in place of the installed release number when the installation could not be verified (inserted into mmdhl.install.native_release).
mmdhl.install.not_verified=not verified

# Shown in place of the recommended release number when it is unknown (inserted into mmdhl.install.recommended_release).
mmdhl.install.unknown_version=unknown

# First line of the installation banner, after the release numbers: the game renders through Model Hotloader's DXVK (bin\win64\d3d9.dll from the drop-in package), which runs Direct3D 9 on Vulkan.
mmdhl.install.renderer.dxvk=Renderer: DXVK (Vulkan)

