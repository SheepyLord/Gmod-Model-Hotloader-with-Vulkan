mmdhl.install.notice=Model Hotloader needs attention.\nOpen External Models for installation details.\nClick here to view the warning.

# Installation banner text shown in place of the per-file problem lines when the native files are missing, damaged, modified, from another release or outdated (installing the recommended package fixes all of these). "The buttons below" are mmdhl.install.button.download and mmdhl.install.button.download_alternative. The per-file lines remain in the tooltip and in Copy diagnostics.
mmdhl.install.binary_problem=The binary module required for this addon is not installed, broken or modified. Please download the most recent version using the buttons below.

