mmdhl.terms.import_warning=Many models are released only for making videos with MikuMikuDance. Their terms often forbid using them in games or other software, sharing or re-uploading them, or showing them in sexual or violent content. Read the texts that came with the model below, and the page you downloaded it from, before you import it.

# Disclaimer shown in every terms-of-use window.
mmdhl.terms.disclaimer=Model Hotloader cannot check or enforce a model's terms, and importing a model gives you no right to use it. You alone are responsible for making sure that everything you do with it follows its terms, its author's wishes and the law. The authors of Model Hotloader grant no rights to any model and accept no liability for how you use one.

# Checkbox that must be ticked before importing.
