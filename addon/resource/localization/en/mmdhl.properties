# Label of the surface material choice in the tool’s settings panel (choices are the surface materials, e.g. mmdhl.props.surface.wood).
mmdhl.tool.prop.physics_material=Surface material

# Help text at the bottom of the tool’s settings panel.
mmdhl.tool.prop.attach_help=Right click a character, NPC, ragdoll or prop to attach the selected prop to one of its bones. Right click an attached prop to adjust or detach it. Reload copies the prop you aim at.

