# Text of that confirmation window. Three paragraphs separated by empty lines (\n\n).
mmdhl.install.unverified.warning=The installed native files do not match a release approved for this version of the addon. They may belong to another version, be damaged, or have been modified.\n\nUsing them anyway can crash Garry's Mod, damage saves or make the addon behave unpredictably. Continue only if you trust where these files came from.\n\nYour choice covers only these exact files: if any of them changes, you will be asked again.

# Confirm button of that window.
mmdhl.install.unverified.confirm=Use anyway

# Message after the player (or a server administrator, in the server console) accepted unverified native files.
