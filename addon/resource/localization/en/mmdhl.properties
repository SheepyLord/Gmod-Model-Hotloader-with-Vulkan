# Main button of the window when importing an FBX, glTF or DAE character.
mmdhl.bonemap.import=Import character

# Main button of the window for a library character: saves the bones on the server.
mmdhl.bonemap.save=Save bones

# Main button while the server saves the bones.
mmdhl.bonemap.saving=Saving…

# Tooltip of the disabled main button.
mmdhl.bonemap.disabled_missing=Assign every red body part first.

# Tooltip of the disabled Import character button while another import runs.
mmdhl.bonemap.disabled_busy=Another import is running. Wait for it to finish.

# Status line and tooltip for players who may not save bones on a multiplayer server.
mmdhl.bonemap.disabled_admin=Only an admin can change how models are fitted on this server.

# Status line when the server did not answer a save within 10 seconds.
mmdhl.bonemap.save_timeout=The server did not answer. It may run an older Model Hotloader.

# Notification after the bones of a library character were saved. {name}: model name.
mmdhl.bonemap.saved=“{name}” uses the new bones for new spawns.

# Notification after the missing bones of a library character were saved. {name}: model name.
mmdhl.bonemap.rescued=“{name}” can now become a ragdoll.

# Notification when a character was imported without the window (the skip option is on). "Assign bones…" is the library menu entry mmdhl.ui.menu.assign_bones.
mmdhl.bonemap.auto_imported=Bones were assigned automatically. Right-click the model in the library and choose Assign bones… to change them.

# Import progress while an FBX, glTF or DAE character is converted.
mmdhl.bonemap.stage.converting=Converting the character…

# Problem: a required body part has no bone. {part}: body part name.
mmdhl.bonemap.issue.required={part} needs a bone.

# Problem: one bone is used for two body parts. {bone}: bone name. {first} and {second}: body part names.
mmdhl.bonemap.issue.duplicate=“{bone}” is used for both {first} and {second}.

# Problem: a body part is not below the part it hangs from. {part} and {parent}: body part names. {bone} and {parentBone}: their bone names.
mmdhl.bonemap.issue.order={part} must be below {parent} in the skeleton, but “{bone}” is not under “{parentBone}”.

# Problem: a thigh bone hangs from the spine instead of the hips. {part}: body part name. {bone}: bone name.
mmdhl.bonemap.issue.leg_on_spine={part} (“{bone}”) hangs from the upper body. Legs must hang from the hips.

# Problem: most left and right body parts look exchanged. A Swap left and right button follows.
mmdhl.bonemap.issue.sides_swapped=Left and right look swapped for most body parts.

# Problem: a bone is on the other side of the body than its body part. {bone}: bone name. {side}: mmdhl.bonemap.side.left or .right. {part}: body part name.
mmdhl.bonemap.issue.side=“{bone}” is on the character's {side} side, but it is used as {part}.

# Warning: the toes point backwards in the picture. A Swap left and right button follows.
mmdhl.bonemap.issue.facing=The toes point backwards in the picture. Left and right may be swapped.

# Warning: a body part is lower (or higher) than the one it should be above (or below). {part} and {other}: body part names.
mmdhl.bonemap.issue.height={part} is lower than {other}. Check that these bones are not swapped.

# Warning: an arm or leg segment is unusually long or short. {part} and {other}: body part names.
mmdhl.bonemap.issue.length={part} is much longer or shorter than {other}. A bone may have been skipped.

# Warning: the bone of a physics body part moves no vertices. {bone}: bone name. {part}: body part name.
mmdhl.bonemap.issue.unweighted=“{bone}” moves no part of the mesh, so {part} may not follow the ragdoll.

# Warning: the chosen bone looks like a twist helper. {bone}: bone name. {part}: body part name. A button to use its parent may follow.
mmdhl.bonemap.issue.twist=“{bone}” looks like a twist helper. Pick the main bone for {part}.

# Error: a required body part uses a bone moved by the model's hair or cloth physics. {bone}: bone name. {part}: body part name.
mmdhl.bonemap.issue.physics=“{bone}” is moved by the model's own physics (hair or cloth), so it cannot be used for {part}.

# Warning: an optional body part uses a bone moved by the model's physics. {bone}: bone name. {part}: body part name.
mmdhl.bonemap.issue.physics_optional=Using “{bone}” for {part} replaces the model's own physics there.

# Note: optional body parts without a bone, which the importer creates. {parts}: body part names, comma-separated.
mmdhl.bonemap.issue.recommended=Created automatically: {parts}.

# Note: some finger joints have no bone.
mmdhl.bonemap.issue.finger_partial=Some finger joints have no bone. Those joints stay straight.

# Error: a ticked swinging part contains a body part. {chain}: its first bone. {part}: body part name. {bone}: that bone.
