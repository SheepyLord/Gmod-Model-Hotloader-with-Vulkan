# Undo list entry for a placed static prop.
mmdhl.undo.static_prop=Static prop

# Undo list entry for a static prop attached to a character or another prop.
mmdhl.undo.attached_prop=Attached prop

# Button in Utilities → Cleanup that removes the player's MMD ragdolls and NPCs. New phrase: the button used to show the raw name "Cleanup_mmdhl".
mmdhl.game.cleanup=Imported characters

# Notification after that cleanup button is used. New phrase: it used to show the raw name "Cleaned_mmdhl".
