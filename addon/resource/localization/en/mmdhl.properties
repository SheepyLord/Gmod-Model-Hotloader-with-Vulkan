# Disclaimer shown in every terms-of-use window.
mmdhl.terms.disclaimer=Model Hotloader cannot check or enforce a model's terms, and importing a model gives you no right to use it. You alone are responsible for making sure that everything you do with it follows its terms, its author's wishes and the law. The authors of Model Hotloader grant no rights to any model and accept no liability for how you use one.

# Checkbox that must be ticked before importing.
mmdhl.terms.import_accept=I have read the model's terms and take full responsibility for how I use it.

# Button that imports the model after the terms were accepted.
mmdhl.terms.import_confirm=Accept and import

# Shown in the import window when the native module is too old to read readme files.
mmdhl.terms.needs_native=The installed native module cannot read readme files; update Model Hotloader to see them here.

# Export confirmation, per model: nothing was recorded because the model was imported before terms were kept.
mmdhl.terms.export_no_record=no terms recorded (imported with an older version); check them yourself

# Export confirmation, per model: its texts mention no restrictions.
mmdhl.terms.export_no_topics=no restrictions found in its texts; check its terms yourself

# Export confirmation, per model: its VRM licence forbids redistribution.
mmdhl.terms.export_vrm_prohibited=VRM licence forbids redistribution

# Title of the confirmation before exporting a Workshop package.
mmdhl.terms.export_title=Terms of use of the exported models

# Heading of the export confirmation.
mmdhl.terms.export_heading=Only publish models you are allowed to share

# Export warning.
mmdhl.terms.export_warning=Publishing a package on the Workshop redistributes every model in it. Many model licences forbid redistribution, use in games, or use in sexual or violent content. Export only models whose authors allow this, and credit them as their terms require.

# Checkbox that must be ticked before exporting.
mmdhl.terms.export_accept=I have checked that each model's terms allow sharing it this way, and I take full responsibility for publishing them.

# Line in the export window. {flagged}: models whose texts mention restrictions; {missing}: models without recorded terms; {total}: selected models.
mmdhl.terms.export_summary=Terms of use: {flagged} of {total} selected models mention restrictions and {missing} have none recorded. Check each model's terms before publishing.

# Title of the terms-of-use viewer. {name}: model name.
mmdhl.terms.view_title=Terms of use: {name}

# Viewer: where the texts came from. {title}: Workshop package title.
mmdhl.terms.from_package=These texts came with the Workshop package "{title}".

# Viewer: where the texts came from. {file}: model file name.
mmdhl.terms.from_file=These texts were found with {file} when it was imported.

# Heading of the terms-of-use viewer.
mmdhl.terms.view_heading=You are responsible for following this model's terms

# Viewer, when nothing was recorded for the model.
mmdhl.terms.view_none=No texts were recorded for this model. Check its terms on the page you downloaded it from.

# Library button of a model whose texts mention restrictions. {topics}: comma-separated topics.
mmdhl.terms.button_topics=Terms of use mention: {topics}

# Library button of a model with a readme or licence.
mmdhl.terms.button=Terms of use

# Library button of a model imported without any readme or licence.
mmdhl.terms.button_none=No terms of use found; check the model's download page

# Tooltip of the library's terms-of-use button.
mmdhl.terms.button_tip=Show the readme, licence and comments this model came with

# Utilities setting (checkbox).
mmdhl.terms.setting_import=Ask me to accept a model's terms of use before importing it

# Utilities setting (checkbox).
mmdhl.terms.setting_export=Ask me to confirm sharing rights before exporting a package

# Help under the two terms-of-use settings.
mmdhl.terms.setting_help=Many models may only be used for videos; their terms often forbid games, sharing, sexual or violent content. You are responsible for following each model's terms.

# ===== Translated model names (names.lua) =====

# A name from a model file shown translated, with the name as authored in brackets. {translation}: translated name; {original}: name in the model file.
mmdhl.names.both={translation} ({original})

# Tooltip of a translated model name. {name}: the name as written in the model file.
mmdhl.names.original=Original name: {name}

# Checkbox in the import window.
mmdhl.names.import_translate=Show this model's names in my language

# Note under mmdhl.names.import_translate: what is shared with the translation service.
mmdhl.names.import_note=The model's name and the names of its parts and expressions are sent to Google Translate. Translations appear when they arrive. Your choice is kept for the next import; switch translation off completely in Physics & Performance.

# Section title in Physics & Performance.
mmdhl.names.setting_title=Model name translation

# Checkbox in Physics & Performance.
mmdhl.names.setting_label=Translate names from models into my language

# Tooltip of mmdhl.names.setting_label.
mmdhl.names.setting_tooltip=Model, part and expression names are sent to Google Translate and saved on this computer once translated. Off: names show as written in the model files and nothing is sent.

# Help under the setting.
mmdhl.names.setting_help=Translations appear when they arrive and never delay imports or spawning. Names of models imported with translation unticked are never sent.

# Help under the setting while the translation service does not answer.
mmdhl.names.status_unavailable=Google Translate is not answering right now. Names show as written in the model files; translation is retried later.

# One-time notice in the library before names of already imported models are sent for translation.
mmdhl.names.notice=Model Hotloader can show the names in your models (model, parts, expressions) in your language by sending them to Google Translate. Nothing is sent until you choose.

# Button of mmdhl.names.notice: keep translation on.
mmdhl.names.notice_accept=Translate names

# Button of mmdhl.names.notice: switch translation off.
mmdhl.names.notice_decline=Keep original names
