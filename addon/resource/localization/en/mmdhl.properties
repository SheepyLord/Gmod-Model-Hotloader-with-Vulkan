mmdhl.library.hint.character_update=Characters in FBX, glTF and DAE files need the native files of Model Hotloader 2.3.0 or newer. Update them, then import the file again.

# What to try when the model has too many bones or triangles. "Decimate" is a Blender modifier name.
mmdhl.library.hint.character_too_complex=Reduce the model in Blender (Decimate, remove unused armatures and bones) and export it again.

# What to try when the converter rejected the bones. "Back to bone assignment" is the button mmdhl.library.failure.back_to_bones.
mmdhl.library.hint.character_bone_map=Some body parts have no bone or the wrong one. Use Back to bone assignment to fix them.

# What to try when a swinging part contains a body bone.
mmdhl.library.hint.character_jiggle=A swinging part contains a body bone. Use Back to bone assignment and untick it.

# What to try when the converter could not tell which way the model stands.
mmdhl.library.hint.character_orientation=The importer could not tell which way the model stands. Check the hips, head, arms and legs in the bone window.

# What to try when this version of the addon files cannot show the bone window. "Model Hotloader" is the addon name.
mmdhl.library.hint.character_needs_mapping=Update Model Hotloader: this version of the addon files cannot show the bone window.

