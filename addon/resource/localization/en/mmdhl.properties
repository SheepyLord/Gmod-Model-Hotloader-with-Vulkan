# Model Hotloader: English phrases, the source for every translation.
#
# One phrase per line: key=text. Lines starting with # are comments: the one above each
# phrase says where it appears and what its placeholders contain.
# {name} is a placeholder the addon fills in. Keep it exactly; you may move it.
# \n is a line break. Spaces at the start or end of a phrase are ignored.
# A translation is this file under resource/localization/<gmod_language>/mmdhl.properties,
# with the language code in lowercase as the game names it: de, fr, ja, ko, ru, pt-br,
# es-es, zh-cn, zh-tw. Phrases it leaves out stay in English.
# See docs/TRANSLATING.md; check with python scripts/check-i18n.py.

# ===== Common words =====

# Shared by many dialogs and menus. Use these instead of adding new keys for the same word.

# Dialog button that closes the dialog without doing anything.
mmdhl.common.cancel=Cancel

# Dialog button confirming a deletion.
mmdhl.common.delete=Delete

# Dialog button confirming a removal (from a list or the map; nothing is deleted from disk).
mmdhl.common.remove=Remove

# Button or menu entry that renames the selected item.
mmdhl.common.rename=Rename

# Button that closes a window.
mmdhl.common.close=Close

# Button that acknowledges a message.
mmdhl.common.ok=OK

# Library folder for items that are in no folder.
mmdhl.common.unfiled=Unfiled

# Chat message when a player uses the Imported character grabber weapon or the Static Prop tool while the addon's native part is not installed or failed its checks. "External Models" is the spawn menu tab.
mmdhl.common.unavailable=Model Hotloader is unavailable. Open Spawn menu -> External Models for installation details.

# Name of the addon's spawn menu tab (Q menu), also the library window title and the spawn menu category of player models and NPCs made from imported characters. Other messages mention this name; keep them consistent.
mmdhl.common.external_models=External Models

