mmdhl.physics.backend.tooltip=Multicore CPU Processor is recommended. Vulkan GPU Processor solves on the graphics card and needs the DXVK renderer to keep up; with few CPU threads it can still fall behind at high accuracy. MMD Compatibility favors original motion. OpenCL is experimental and may be slower.

