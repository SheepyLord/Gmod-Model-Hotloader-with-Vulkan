# Status line error when every material is unticked.
mmdhl.props.editor.keep_material=Keep at least one material.

# Status line after saving; the window closes shortly after. The worker is the background import process.
mmdhl.props.editor.saving=Saving the preset... it appears in the library when the worker finishes.

# Button that ticks all materials and resets the region. Button is half of a 420 px column.
mmdhl.props.editor.reset=Reset selection

# Button (red) that deletes the preset being edited. Button is half of a 420 px column.
