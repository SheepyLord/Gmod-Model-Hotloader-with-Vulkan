# Message after the acceptance of unverified native files was withdrawn.
mmdhl.install.unverified.revoked=Unverified native files are no longer accepted. Change or reload the map, or restart Garry's Mod.

# Console reply to mmdhl_accept_unverified_native when the server has no unverified files to accept, or has problems that accepting cannot fix.
mmdhl.install.unverified.nothing=There are no unverified native files that accepting would allow.

# ===== Native update reminder (installation_ui.lua) =====

# Title of the update reminder window. It opens a few seconds after joining a game (once per game start) when the installed native files are an older release than the one this addon version recommends. Model Hotloader is the product name; keep it untranslated.
mmdhl.install.update.title=Model Hotloader — update available

# Title of the same window when the installed native files are too old for this addon version to load at all (the addon stays off until they are updated). Model Hotloader is the product name; keep it untranslated.
mmdhl.install.update.title_required=Model Hotloader — update required

# Text of the update reminder window. {installed}: the installed native release (e.g. 2.2.0). {recommended}: the newest release this addon version recommends (e.g. 2.3.0). The last sentence describes installing the downloaded drop-in package. Two paragraphs separated by an empty line (\n\n); keep the line breaks.
mmdhl.install.update.text=A newer binary module is available.\nInstalled: {installed}\nLatest: {recommended}\n\nModel Hotloader keeps working with the installed version, but the newest features and fixes need the update. Download the package, close Garry's Mod, copy the package over your Garry's Mod folder, then start the game again.

# Text of the update window when the installed native files are too old to load (see mmdhl.install.update.title_required). {installed}: the installed native release, or mmdhl.install.unknown_version. {recommended}: the release to install. Keep the line breaks.
mmdhl.install.update.text_required=This version of Model Hotloader cannot use the installed binary module, so the addon is off.\nInstalled: {installed}\nLatest: {recommended}\n\nDownload the package, close Garry's Mod, copy the package over your Garry's Mod folder, then start the game again.

# Line in the yellow installation banner of External Models and the library window (and always in the installation window) while a newer native release is available. It is not a problem: everything keeps working. {recommended}: the newer release. {installed}: the installed one.
mmdhl.install.update.banner=Native update available: {recommended} (installed: {installed}). Everything keeps working; download the update for the newest features and fixes.

# Added to the update window and the banner line when the installed release has a known problem (the general text, when no specific one is available).
mmdhl.install.update.advisory=The installed release has a known problem that the update fixes.

# Button in the update window; opens the GitHub release page of the newest native package. About 170 px wide.
mmdhl.install.update.button.download=Download from GitHub

# Button at the bottom right of the update window; closes it. About 120 px wide.
mmdhl.install.update.button.later=Remind me later

# Tooltip of mmdhl.install.update.button.later.
mmdhl.install.update.later_tip=Close this reminder. It shows again the next time you start Garry's Mod.

# Button in the update window, left of mmdhl.install.update.button.later; stops the reminders about this release only. About 120 px wide.
mmdhl.install.update.button.skip=Skip this version

# Tooltip of mmdhl.install.update.button.skip. {recommended}: the release that is skipped (e.g. 2.3.0).
mmdhl.install.update.skip_tip=Don't remind me about {recommended} again. A newer release reminds you again; the installation window always shows available updates.

# Tooltip of the installation banner's Dismiss button (mmdhl.install.button.dismiss) while no other problem is left to hide: it then hides the update line (mmdhl.install.update.banner) by skipping that release, like mmdhl.install.update.button.skip. {recommended}: the release that is skipped (e.g. 2.3.0).
mmdhl.install.update.dismiss_tip=Hide this update and don't remind me about {recommended} again. A newer release reminds you again; the installation window always shows available updates.

# Button in the update window, left of mmdhl.install.update.button.skip; turns update reminders off for good. About 150 px wide.
mmdhl.install.update.button.never=Don't remind me again

# Tooltip of mmdhl.install.update.button.never. "Utilities > User > Character Models" is the spawn menu page: the game's names for Utilities and User, then mmdhl.ui.toolmenu.characters.
mmdhl.install.update.never_tip=Turn update reminders off. You can turn them back on in the installation window or under Utilities > User > Character Models.

# Checkbox in the installation window and on the Utilities > User > Character Models page; when on, the update window opens when a newer native release is available. About 400 px wide.
mmdhl.install.update.setting=Remind me when a newer binary module is available

# Appended to the first line of the installation banner, after mmdhl.install.recommended_release, when a newer native release than the installed one is available.
mmdhl.install.update.available_tag=(update available)

# Line in the installation window for server administrators, and in the server console, when the multiplayer server runs an older native release. {installed}: the server's release. {recommended}: the newer one.
mmdhl.install.update.server=This server's native release {installed} is older than the recommended {recommended}. Model Hotloader keeps running; the server administrator can install the update.

# Title of the small window shown when a feature needs a newer native release than the installed one.
mmdhl.install.update.needed_title=Binary module update needed

# Text of that window. {feature}: the feature's name, on its own first line (e.g. Ragdoll physics editor). {release}: the first native release with that feature (e.g. 2.3.0). Keep the line break.
mmdhl.install.update.needed={feature}\nThis needs a newer binary module ({release} or later). Everything else keeps working.

# Button of that window; opens the update window (or the installation window) with the download buttons. About 140 px wide.
mmdhl.install.update.button.show=Download update…

# ===== Installation checks (installation.lua) =====

# These problems appear in the installation banner, in error messages of other features and in the console.

# Installation problem: the game is not the 64-bit Windows version. "x86-64" is the name of the Steam beta branch of Garry's Mod.
mmdhl.install.error.unsupported_platform=This addon requires Windows x64 Garry's Mod. Select the x86-64 game branch or launch 64 bit version of the game.

# Installation problem: the addon's list of approved native releases is missing or broken.
mmdhl.install.error.policy_invalid=The Workshop native release policy is missing or invalid. Update the Workshop addon.

# Installation problem. {installed}: installed native release number. {recommended}: release number to install instead.
mmdhl.install.error.release_not_approved=Installed native release {installed} is no longer approved. Install {recommended} and restart.

# Installation warning (it disables nothing): the installed native release is older than the recommended one and no longer approved; the addon runs anyway and the update reminder offers the download. {installed}: installed release. {recommended}: the release to install.
mmdhl.install.warning.outdated_release=Native release {installed} is outdated and no longer approved for this version of the addon. Model Hotloader runs anyway; install {recommended} for the newest fixes.

# Installation warning (it disables nothing): the installed native module rejected this addon's newer game compatibility profiles, so it checks those game libraries with its own built-in checks. {libraries}: game DLL names, e.g. engine.dll, client.dll. {recommended}: the release to install.
mmdhl.install.warning.compatibility_fallback=This native release does not accept the addon's newer game compatibility profiles for {libraries}, so it checks them with its own built-in guards. Model Hotloader runs anyway; install {recommended} for full compatibility checks.

# Installation problem: a required file is missing. {path}: file path relative to the game folder.
mmdhl.install.error.file_missing=Missing {path}. Reinstall the native package and restart.

# Installation problem: a required file cannot be read. {path}: file path relative to the game folder.
mmdhl.install.error.file_unreadable=Cannot read {path}. Reinstall the native package and restart.

# Installation problem: a file comes from another release. {path}: file path. {release}: the release the file belongs to. {required}: the release the installation needs.
mmdhl.install.error.file_mixed={path} belongs to {release}, but this installation requires {required} Install a complete approved package and restart.

# Installation problem: a file matches no known release. {path}: file path relative to the game folder.
mmdhl.install.error.file_unrecognized={path} does not match a recognized binary. It may be damaged or from an unapproved build. Install a complete approved package and restart.

# Error when a feature is used while the native part of the addon is not installed. External Models is the spawn menu tab (mmdhl.common.external_models).
mmdhl.install.unavailable_repair=Native installation unavailable. Open External Models for repair instructions.

# Error while a component is still being checked. {feature}: internal component identifier (core, imports, detailedCollision, rendering or physics), shown untranslated.
mmdhl.install.checking_feature=Model Hotloader is checking {feature}.

# Short error shown in the External Models tab when the native part could not be loaded and no detailed reason is known.
mmdhl.install.unavailable=Native installation unavailable

# Installation problem: the loaded native module (the Garry's Mod binary module DLL) differs from the verified file.
mmdhl.install.error.loaded_module_mismatch=The loaded module does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.

# Installation problem: the loaded native runtime DLL differs from the verified file.
mmdhl.install.error.loaded_runtime_mismatch=The loaded runtime does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.

# Installation problem: the background import program (the "worker") failed its startup test.
mmdhl.install.error.worker_failed=Worker self-test failed. Reinstall native binaries and dependencies.

# Installation problem: the background import program (the "worker") and the runtime DLL come from different releases.
mmdhl.install.error.worker_mismatch=Worker and runtime identities do not match the approved native release. Reinstall and restart.

# Installation problem: the library for detailed prop collision shapes failed; props fall back to simple convex hulls.
mmdhl.install.error.coacd_failed=Detailed collision is unavailable; simple hulls remain available.

# Shown after pressing Recheck when the native part is not loaded yet.
mmdhl.install.error.restart_to_load=Installation was checked. Fully restart Garry's Mod to load repaired native binaries.

# Shown after pressing Recheck when a repaired component needs a restart. {feature}: internal component identifier (imports, detailedCollision, rendering or physics), shown untranslated.
mmdhl.install.error.restart_to_enable=Files for {feature} now pass validation. Fully restart Garry's Mod to enable the repaired component.

# Installation problem: Windows could not load the native module. {reason}: error text from the game (English).
mmdhl.install.error.loader_failed=Native module could not load: {reason}. Check the Microsoft Visual C++ x64 Redistributable and reinstall the native package.

# Installation problem: the installed native module is too old. {recommended}: release number to install.
mmdhl.install.error.no_verification=This native release lacks installation verification. Install {recommended} and restart.

# Installation problem: a game DLL the addon needs was still not ready some seconds after the map loaded.
mmdhl.install.error.game_not_ready=A required game library did not become available after map startup. Restart the game or check Workshop for a compatibility update.

# Installation warning (it disables nothing; Dismiss hides it): the game's libraries come from a Garry's Mod build no compatibility profile describes, as after most game updates. {libraries} lists the game DLLs, e.g. engine.dll, client.dll.
mmdhl.install.warning.game_untested=This Garry's Mod build has not been tested with this native release ({libraries} changed). Model Hotloader runs anyway; if something misbehaves, check Workshop and GitHub for an update.

