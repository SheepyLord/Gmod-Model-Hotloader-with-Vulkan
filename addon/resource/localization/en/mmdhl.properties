# Tooltip of the gravity multiplier slider.
mmdhl.physics.gravity.tooltip=Default 1. Scales the gravity of the character model's own physics; Source ragdoll gravity is unchanged.

# Slider label: multiplier for how quickly hair and clothing motion calms down.
mmdhl.physics.damping.label=Motion damping

# Tooltip of the motion damping slider.
mmdhl.physics.damping.tooltip=Default 1. Higher values make motion settle faster. Zero removes damping.

# Checkbox for VRM avatars: spring bones damp motion relative to the character instead of the world.
mmdhl.physics.vrm_damping.label=VRM: hair and clothing keep their shape while moving

# Tooltip of the VRM damping checkbox.
mmdhl.physics.vrm_damping.tooltip=Default on. VRM spring bones damp motion against the character's hips instead of the world, so walking or a thrown ragdoll no longer drags hair and skirts behind; starting, stopping and turning still swing them. Off gives the plain VRM behaviour.

# Bold section heading: physics quality that adapts to distance and visibility.
mmdhl.lod.title=Adaptive physics

# Checkbox that turns adaptive physics quality on or off.
mmdhl.lod.enabled.label=Adaptive physics quality

# Tooltip of the adaptive physics checkbox.
mmdhl.lod.enabled.tooltip=Reduce iterations or suspend secondary physics for distant or unseen slow-moving characters.

# Title of a collapsible section holding the adaptive physics distance sliders.
mmdhl.lod.advanced=Distance and visibility settings

# Slider label (distance in Source map units): characters closer than this always get full physics quality.
mmdhl.lod.near.label=Always full quality within (units)

# Tooltip of the "Always full quality within" slider.
mmdhl.lod.near.tooltip=Visibility never reduces quality inside this range.

# Slider label (distance in map units): visible characters closer than this get full physics quality.
mmdhl.lod.full.label=Visible full quality within

# Tooltip of the "Visible full quality within" slider.
mmdhl.lod.full.tooltip=Use the configured full solver iterations.

# Slider label (distance in map units): characters closer than this get half physics quality.
mmdhl.lod.middle.label=Half quality within

# Tooltip of the "Half quality within" slider.
mmdhl.lod.middle.tooltip=More distant active models use quarter quality.

# Slider label (distance in map units): beyond this, slow characters nobody holds stop simulating hair and clothing.
mmdhl.lod.cutoff.label=Physics distance cutoff

# Tooltip of the "Physics distance cutoff" slider. "Unheld": not held with the Physics Gun.
mmdhl.lod.cutoff.tooltip=Slow, unheld models suspend beyond this distance.

# Slider label: seconds a character must be out of sight before its physics pauses.
mmdhl.lod.hidden.label=Invisible delay (seconds)

# Tooltip of the "Invisible delay" slider.
mmdhl.lod.hidden.tooltip=Suspend invisible slow-moving models after this delay.

# Slider label: characters moving faster than this (map units per second) always get full quality.
mmdhl.lod.speed.label=Full quality speed (units/s)

# Tooltip of the "Full quality speed" slider. Primary limbs are the ragdoll's main body parts.
mmdhl.lod.speed.tooltip=Any primary limb can request full quality.

# Slider label: characters turning faster than this (degrees per second) always get full quality.
mmdhl.lod.angular.label=Full quality rotation (deg/s)

# Tooltip of the "Full quality rotation" slider.
mmdhl.lod.angular.tooltip=Fast rotation requests full quality.

# Bold section heading for the anti-stretch correction.
mmdhl.physics.stretch.title=Stretch protection (Experimental)

# Checkbox that limits hair and clothing chains from stretching too far.
mmdhl.physics.stretch.label=Limit excessive stretching

# Tooltip of the "Limit excessive stretching" checkbox.
mmdhl.physics.stretch.tooltip=Default off. Limits excess separation without changing authored damping, masses or springs. World and prop contacts take priority.

# Slider label: how much stretching is allowed before correction.
mmdhl.physics.stretch_tolerance.label=Allowed stretch

# Tooltip of the "Allowed stretch" slider.
mmdhl.physics.stretch_tolerance.tooltip=Default 1. Lower values hold sleeve and hair attachments more tightly; higher values allow more separation before correction.

# Wrapped help text under the stretch protection controls.
mmdhl.physics.stretch.help=Correction slides along world and prop surfaces. A compressed chain may temporarily exceed its stretch allowance to avoid being pushed through the ground.

# Bold section heading for performance settings.
mmdhl.performance.title=Performance

# Slider label: number of CPU threads used for physics; 0 picks a count automatically.
mmdhl.performance.workers.label=CPU threads (0 = automatic)

# Tooltip of the CPU threads slider. A lane is one parallel worker.
mmdhl.performance.workers.tooltip=Automatic uses logical CPU threads minus two (all threads on CPUs with four or fewer). One lane is the calling thread. Changing this briefly waits for current jobs to finish.

# Checkbox: stop simulating hair and clothing that has come to rest.
mmdhl.performance.sleep.label=Pause settled hair and clothing

# Tooltip of the "Pause settled hair and clothing" checkbox.
mmdhl.performance.sleep.tooltip=Default on. Movement automatically resumes simulation.

# Title of a collapsible section with advanced performance settings.
mmdhl.performance.advanced=Advanced performance settings

# Slider label: milliseconds a frame may wait for the physics result.
mmdhl.performance.wait.label=Physics wait time (ms)

# Tooltip of the "Physics wait time" slider. A tick is one physics step.
mmdhl.performance.wait.tooltip=Default 0 keeps rendering responsive. Waiting may present a newer completed secondary tick, but increases frame time.

# Checkbox: keep prepared model geometry between rendering passes.
mmdhl.performance.vertex_cache.label=Reuse prepared model geometry

# Tooltip of the "Reuse prepared model geometry" checkbox.
mmdhl.performance.vertex_cache.tooltip=Default on. Reuses geometry across rendering passes.

# Checkbox: send animated vertices to the graphics card in a smaller format.
mmdhl.performance.compact_vertices.label=Compact vertex upload

# Tooltip of the "Compact vertex upload" checkbox.
mmdhl.performance.compact_vertices.tooltip=Default on. Sends animated model vertices in half the size. Turn off if model shading looks wrong.

# Checkbox: deform (skin) models on the graphics card. "GPU skinning" is a technical term.
mmdhl.performance.gpu_skinning.label=GPU skinning

# Tooltip of the "GPU skinning" checkbox.
mmdhl.performance.gpu_skinning.tooltip=Default on. The graphics card bends the models, as it does for Source models; the CPU only sends bone positions. Turn off if a model looks torn or misplaced.

# Checkbox: smooth characters whose poses arrive at the server tick rate.
mmdhl.performance.smooth_poses.label=Smooth tick-rate skeletons

# Tooltip of the "Smooth tick-rate skeletons" checkbox.
mmdhl.performance.smooth_poses.tooltip=Default on. Characters posed over the network, such as NPCs driven by an animation player, only change at the server tick rate. This shows them one update behind, interpolated, so body and hair move every frame.

# Label above a drop-down list choosing how often character poses are updated.
mmdhl.performance.update_lod.label=Pose update rate

# Choice 0 in the "Pose update rate" drop-down.
mmdhl.performance.update_lod.every_frame=Every frame for every model

# Choice 1 (default) in the "Pose update rate" drop-down: models not drawn anywhere update 10 times per second.
mmdhl.performance.update_lod.unseen=Unseen models 10 times a second (default)

# Choice 2 in the "Pose update rate" drop-down: additionally, small models on screen update 20 to 30 times per second.
mmdhl.performance.update_lod.small=Also small on-screen models 20-30 times a second

# Tooltip of the "Pose update rate" drop-down. "Setting 2" is the third choice (mmdhl.performance.update_lod.small).
mmdhl.performance.update_lod.tooltip=Default 1. Anything you can see, including its shadow, updates every frame; models drawn nowhere update 10 times a second. Setting 2 also slows small or distant models on screen, which can look stepped when they move.

# Checkbox: avoid double flashlight lighting where model surfaces overlap.
mmdhl.performance.flashlight_fix.label=Correct lighting on overlapping surfaces

# Tooltip of the "Correct lighting on overlapping surfaces" checkbox.
mmdhl.performance.flashlight_fix.tooltip=Default on. Coincident surfaces receive one flashlight contribution; faces separated by animation remain visible.

# Slider label: movement speed below which a resting body may go to sleep.
mmdhl.performance.sleep_linear.label=Resting movement threshold

# Tooltip of the "Resting movement threshold" slider.
mmdhl.performance.sleep_linear.tooltip=Default 0.5. Bodies below both speed thresholds can go to sleep.

# Slider label: rotation speed below which a resting body may go to sleep.
mmdhl.performance.sleep_angular.label=Resting rotation threshold

# Tooltip of the "Resting rotation threshold" slider.
mmdhl.performance.sleep_angular.tooltip=Default 0.35.

# Slider label: seconds a body must rest before it goes to sleep.
mmdhl.performance.sleep_seconds.label=Time at rest before sleep (seconds)

# Tooltip of the "Time at rest before sleep" slider.
mmdhl.performance.sleep_seconds.tooltip=Default 1.5.

# Slider label: how far a sleeping chain may drift before simulation resumes.
mmdhl.performance.wake_drift.label=Movement needed to resume

# Tooltip of the "Movement needed to resume" slider.
mmdhl.performance.wake_drift.tooltip=Default 0.02. Raising this permits more movement before a resting chain wakes.

# Bold section heading for diagnostic tools and recovery actions.
mmdhl.debug.section=Diagnostics & recovery

# Checkbox that shows the performance overlay in the top right corner of the screen (the overlay itself stays in English).
mmdhl.debug.overlay=Show physics and performance overlay

# Checkbox that prints a performance summary line to the console every five seconds.
mmdhl.debug.print=Print a performance summary every five seconds

# Button that saves a diagnostic report file (JSON) under data/mmd_hotloader/diagnostics.
mmdhl.debug.write_report=Write diagnostic report

# Button that resets hair and clothing physics of every MMD model in the map.
mmdhl.physics.reset_all=Reset physics for all models

# Button that removes the client-side MMD ragdolls (e.g. NPC corpses) on this computer only.
mmdhl.physics.cleanup_ragdolls=Clean up local ragdolls

# Wrapped help text under the cleanup button.
mmdhl.physics.cleanup_help=Local ragdolls pause secondary physics while all Source bodies sleep, and resume when a body wakes. Cleanup affects only this client’s character model ragdolls.

# Button that switches hair and clothing physics on or off.
mmdhl.physics.toggle=Toggle physics on / off

# Label above a key binder for the physics on/off shortcut. Pressing Escape in the binder clears it.
mmdhl.physics.toggle_shortcut=Toggle physics shortcut (unassigned; Escape clears)

# Label above a key binder for the "reset all physics" shortcut. F8 cannot be chosen because it is used for recording.
mmdhl.physics.reset_shortcut=Reset all physics shortcut (unassigned; F8 is reserved for recording)

# Button that restores all settings on this tab to the recommended values.
mmdhl.physics.restore_defaults=Restore Recommended Settings

# Wrapped help text under the restore button. Names refer to mmdhl.secondary.backend.multicore and the collision checkboxes mmdhl.physics.collide.character and .objects.
mmdhl.physics.restore_help=Recommended: Multicore CPU Processor, collisions with the character and objects, adaptive quality and automatic CPU thread count.

# ===== Physics processor choices (secondary_backend.lua) =====

# Drop-down choices in the Physics & Performance tab, the Utilities tool menu and a character's edit panel.

# Physics processor choice (recommended default): simulates hair and clothing on several CPU cores.
mmdhl.secondary.backend.multicore=Multicore CPU Processor

# Physics processor choice that reproduces the original MikuMikuDance motion most closely.
mmdhl.secondary.backend.compatibility=MMD Compatibility Processor

# Physics processor choice: the older multicore implementation.
mmdhl.secondary.backend.legacy_multicore=Legacy Multicore CPU Processor

# Physics processor choice that uses the graphics card (OpenCL).
mmdhl.secondary.backend.gpu=OpenCL GPU Processor (Experimental)

# Physics processor choice that runs the constraint solver on the graphics card through Vulkan compute; it shares the device of the DXVK renderer when that is installed.
mmdhl.secondary.backend.vulkan=Vulkan GPU Processor (Experimental)

# Error when a physics processor that does not exist was requested. May appear in a notification listing failed settings.
mmdhl.secondary.error.unknown_backend=Unknown secondary backend.

# ===== Server notices (secondary_collision.lua) =====

# Error notification sent to every player when collecting map and object contacts failed; collisions are switched off.
# {reason}: technical error message from the physics module (English).
mmdhl.secondary.error.contacts_disabled=Secondary world contacts were disabled: {reason}. Details saved in mmd_hotloader/diagnostics.

# ===== Loading labels above characters (instances.lua) =====

# Small text drawn in the world above a blue wireframe placeholder while a character cannot be shown yet.

# Placeholder label while the character's model description has not arrived from the server.
mmdhl.instances.waiting_metadata=Waiting for model metadata

# Placeholder label while the character's model files are still being downloaded.
mmdhl.instances.waiting_files=Waiting for model files

# Placeholder label while the character model is loading.
mmdhl.instances.loading=Loading model

# Placeholder label while the server has not yet confirmed which player model is used.
mmdhl.instances.waiting_selection=Waiting for authoritative model selection

# Default placeholder label when no more specific status is known.
mmdhl.instances.loading_label=Loading character model...

# ===== Character preview errors (native_render.lua) =====

# Error in the library preview status line (or as a script error) when a converted material file is missing.
# {path}: material path.
mmdhl.render.error.missing_material=Missing generated model material: {path}

# Error in the library preview status line when a material's texture cannot be loaded (RTX Remix preview mode).
# {path}: material path.
mmdhl.render.error.preview_texture=Preview texture is unavailable: {path}

# ===== Spawn errors (carrier.lua) =====

# Shown when placing a character fails. The "carrier" is the Source ragdoll model generated for the character.

# Spawn error: the character's generated material package could not be loaded.
mmdhl.carrier.error.mount_materials=Cannot mount materials from the model

# Spawn error: the generated Source ragdoll model package could not be loaded.
mmdhl.carrier.error.mount_carrier=Cannot mount native carrier

# Spawn error: the generated ragdoll model is invalid (it must have exactly 18 physics parts).
mmdhl.carrier.error.physics_objects=Native carrier does not have 18 physics objects

# ===== Restoring saves and duplications (persistence.lua) =====

# Errors when a save, duplication or model change restores an imported character. Currently they appear in the console.

# Restore error: the generated ragdoll model for this character is missing or from an older version.
mmdhl.persistence.error.carrier_outdated=Cached model carrier is missing or outdated. Reapply/import the model.

# Restore error: the server has not approved this character model for use.
mmdhl.persistence.error.asset_not_approved=Model asset is not approved on this server.

# Restore error: the character's generated material package could not be loaded.
mmdhl.persistence.error.mount_materials=Cannot mount materials from model.

# Restore error: the generated ragdoll model package could not be loaded.
mmdhl.persistence.error.mount_carrier=Cannot mount model carrier.

# Restore error: the saved appearance belongs to a different character model.
mmdhl.persistence.error.appearance_mismatch=Model's save appearance does not match the model itself.

# Error when pasting a duplication that contains a character model the server has not approved for this player.
mmdhl.persistence.error.model_not_approved=This model is not approved on this server.

# ===== Spawn menu tab (menu.lua) =====

# Tooltip of the External Models spawn menu tab (Q menu). External Models is mmdhl.common.external_models.
mmdhl.menu.tab_tooltip=Import, organize and spawn character models

# Text inside the External Models tab while the character library is still loading.
mmdhl.menu.loading=Loading the Model importer runtime...

# ===== Installation warning banner and window (installation_ui.lua) =====

# Title of the installation window (opened from the warning notice or with the mmdhl_open console command). Model Hotloader is the product name; keep it untranslated.
mmdhl.install.window_title=Model Hotloader — installation

# Help paragraph at the bottom of the installation window.
mmdhl.install.help=Install the native package into the game installation you are running, then fully restart Garry's Mod. Workshop supplies the addon Lua. Game compatibility warnings require a Workshop compatibility update; reinstalling an unchanged native package will not fix an unsupported engine ABI.

# Button in the installation warning banner; opens the GitHub release page of the native package. About 190 px wide.
mmdhl.install.button.download=Download native package

# Button in the installation warning banner, beside mmdhl.install.button.download; opens the alternative (non-GitHub) download page of the native package, for players who cannot reach GitHub. Shown only when a release has one. About 170 px wide.
mmdhl.install.button.download_alternative=Alternative download

# Line in the installation banner, shown when the release has an alternative (non-GitHub) download page. {url}: that web address, shown so it can be typed or copied.
mmdhl.install.alternative_link=Alternative download: {url}

# Button in the installation warning banner; copies technical details for a bug report to the clipboard. About 140 px wide.
mmdhl.install.button.copy_diagnostics=Copy diagnostics

# Button in the installation warning banner; checks the installed files again. About 90 px wide.
mmdhl.install.button.recheck=Recheck

# Button in the installation warning banner of External Models and the library window: hides the banner and the pop-up notice until the problems change; the installation window still lists them. About 90 px wide.
mmdhl.install.button.dismiss=Dismiss

# Tooltip of mmdhl.install.button.dismiss.
mmdhl.install.button.dismiss_tip=Hide this warning until the problems change. The installation window still lists them.

# Button in the installation warning banner, shown when the native files are present but do not match a release approved for this addon version (another version, modified or damaged files). Opens the confirmation mmdhl.install.unverified.warning. About 120 px wide.
mmdhl.install.button.use_anyway=Use anyway…

# Button in the installation warning banner, shown after the player accepted unverified native files; withdraws that acceptance. About 200 px wide.
mmdhl.install.button.stop_using=Stop using unverified files

# First line of the installation banner, left part. {version}: installed native release (e.g. 2.1.0-native.1), or mmdhl.install.not_verified.
mmdhl.install.native_release=Native release: {version}

# First line of the installation banner, right part (after a gap). {version}: recommended native release, or mmdhl.install.unknown_version.
mmdhl.install.recommended_release=Recommended: {version}

# Shown in place of the installed release number when the installation could not be verified (inserted into mmdhl.install.native_release).
mmdhl.install.not_verified=not verified

# Shown in place of the recommended release number when it is unknown (inserted into mmdhl.install.recommended_release).
mmdhl.install.unknown_version=unknown

# First line of the installation banner, after the release numbers: the game renders through Model Hotloader's DXVK (bin\win64\d3d9.dll from the drop-in package), which runs Direct3D 9 on Vulkan.
mmdhl.install.renderer.dxvk=Renderer: DXVK (Vulkan)

# As mmdhl.install.renderer.dxvk, but that DXVK file came with another native release. {release}: that release, e.g. 2.1.0-native.2.
mmdhl.install.renderer.dxvk_release=Renderer: DXVK (Vulkan) from {release}

# First line of the installation banner: there is no bin\win64\d3d9.dll, so the game uses its own Direct3D 9 renderer (the -opengl-remix package).
mmdhl.install.renderer.d3d9=Renderer: Direct3D 9

# First line of the installation banner: bin\win64\d3d9.dll exists but is not Model Hotloader's DXVK (for example RTX Remix or ReShade).
mmdhl.install.renderer.other=Renderer: other d3d9.dll

# Installation banner text when there are no problems.
mmdhl.install.verified=Native installation verified.

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.core=Native runtime

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.imports=Model import

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.detailed_collision=Detailed prop collision

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.rendering=Model rendering

# Name of an addon component, shown before a problem in the installation banner (see mmdhl.install.issue).
mmdhl.install.feature.physics=Native character physics

# Fallback component name before a problem in the installation banner when the component is unknown.
mmdhl.install.feature.installation=Installation

# One problem line in the installation banner. {feature}: component name (mmdhl.install.feature.*). {message}: the problem description.
mmdhl.install.issue={feature}: {message}

# Problem line for the detailed prop collision component. {feature}: component name. {message}: the problem description.
mmdhl.install.issue_hull_fallback={feature}: {message} Simple hull collision remains available.

# Problem line for a problem on the multiplayer server's installation. {issue}: the problem line (mmdhl.install.issue).
mmdhl.install.server_issue=Server: {issue} The server administrator must resolve this.

# Text of the clickable notice at the top right of the screen when there is an installation problem. Three lines. External Models is the spawn menu tab (mmdhl.common.external_models).
mmdhl.install.notice=Model Hotloader needs attention.\nOpen External Models for installation details.\nClick here to view the warning.

# Installation banner text shown in place of the per-file problem lines when the native files are missing, damaged, modified, from another release or outdated (installing the recommended package fixes all of these). "The buttons below" are mmdhl.install.button.download and mmdhl.install.button.download_alternative. The per-file lines remain in the tooltip and in Copy diagnostics.
mmdhl.install.binary_problem=The binary module required for this addon is not installed, broken or modified. Please download the most recent version using the buttons below.

# Text of the clickable notice at the top right of the screen for the same problems as mmdhl.install.binary_problem; clicking opens the installation window with the download buttons. Two lines. Model Hotloader is the product name; keep it untranslated.
mmdhl.install.notice_binary=Model Hotloader: its binary module is not installed, broken or modified.\nClick here to download the most recent version.

# Appended to a problem line in the banner and in the console when the player chose to ignore that problem with mmdhl.install.button.use_anyway.
mmdhl.install.accepted_tag=(warning accepted)

# First line of the installation banner while unverified native files are in use because the player accepted the warning.
mmdhl.install.unverified.in_use=Running unverified native files because you accepted the warning. Install the recommended release to remove this warning.

# Banner line for multiplayer players when the server's native files are unverified. mmdhl_accept_unverified_native is a console command; keep it untranslated.
mmdhl.install.unverified.server_admin=A server administrator can run mmdhl_accept_unverified_native in the server console and then change the map to use the server's unverified native files anyway.

# Title of the confirmation window opened by mmdhl.install.button.use_anyway.
mmdhl.install.unverified.title=Use unverified native files?

# Text of that confirmation window. Three paragraphs separated by empty lines (\n\n).
mmdhl.install.unverified.warning=The installed native files do not match a release approved for this version of the addon. They may belong to another version, be damaged, or have been modified.\n\nUsing them anyway can crash Garry's Mod, damage saves or make the addon behave unpredictably. Continue only if you trust where these files came from.\n\nYour choice covers only these exact files: if any of them changes, you will be asked again.

# Confirm button of that window.
mmdhl.install.unverified.confirm=Use anyway

# Message after the player (or a server administrator, in the server console) accepted unverified native files.
mmdhl.install.unverified.accepted=Unverified native files accepted. Change or reload the map, or restart Garry's Mod, to start using them.

# Message after the acceptance of unverified native files was withdrawn.
mmdhl.install.unverified.revoked=Unverified native files are no longer accepted. Change or reload the map, or restart Garry's Mod.

# Console reply to mmdhl_accept_unverified_native when the server has no unverified files to accept, or has problems that accepting cannot fix.
mmdhl.install.unverified.nothing=There are no unverified native files that accepting would allow.

# ===== Installation checks (installation.lua) =====

# These problems appear in the installation banner, in error messages of other features and in the console.

# Installation problem: the game is not the 64-bit Windows version. "x86-64" is the name of the Steam beta branch of Garry's Mod.
mmdhl.install.error.unsupported_platform=This addon requires Windows x64 Garry's Mod. Select the x86-64 game branch or launch 64 bit version of the game.

# Installation problem: the addon's list of approved native releases is missing or broken.
mmdhl.install.error.policy_invalid=The Workshop native release policy is missing or invalid. Update the Workshop addon.

# Installation problem. {installed}: installed native release number. {recommended}: release number to install instead.
mmdhl.install.error.release_not_approved=Installed native release {installed} is no longer approved. Install {recommended} and restart.

# Installation problem: a required file is missing. {path}: file path relative to the game folder.
mmdhl.install.error.file_missing=Missing {path}. Reinstall the native package and restart.

# Installation problem: a required file cannot be read. {path}: file path relative to the game folder.
mmdhl.install.error.file_unreadable=Cannot read {path}. Reinstall the native package and restart.

# Installation problem: a file comes from another release. {path}: file path. {release}: the release the file belongs to. {required}: the release the installation needs.
mmdhl.install.error.file_mixed={path} belongs to {release}, but this installation requires {required} Install a complete approved package and restart.

# Installation problem: a file matches no known release. {path}: file path relative to the game folder.
mmdhl.install.error.file_unrecognized={path} does not match a recognized binary. It may be damaged or from an unapproved build. Install a complete approved package and restart.

# Error when the multiplayer server's native installation is broken. External Models is the spawn menu tab (mmdhl.common.external_models).
mmdhl.install.server_unavailable=The server installation is unavailable. Its administrator must resolve the warning in External Models.

# Error when a feature is used while the native part of the addon is not installed. External Models is the spawn menu tab (mmdhl.common.external_models).
mmdhl.install.unavailable_repair=Native installation unavailable. Open External Models for repair instructions.

# Error while a component is still being checked. {feature}: internal component identifier (core, imports, detailedCollision, rendering or physics), shown untranslated.
mmdhl.install.checking_feature=Model Hotloader is checking {feature}.

# Short error shown in the External Models tab when the native part could not be loaded and no detailed reason is known.
mmdhl.install.unavailable=Native installation unavailable

# Installation problem: the loaded native module (the Garry's Mod binary module DLL) differs from the verified file.
mmdhl.install.error.loaded_module_mismatch=The loaded module does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.

# Installation problem: the loaded native runtime DLL differs from the verified file.
mmdhl.install.error.loaded_runtime_mismatch=The loaded runtime does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.

# Installation problem: the background import program (the "worker") failed its startup test.
mmdhl.install.error.worker_failed=Worker self-test failed. Reinstall native binaries and dependencies.

# Installation problem: the background import program (the "worker") and the runtime DLL come from different releases.
mmdhl.install.error.worker_mismatch=Worker and runtime identities do not match the approved native release. Reinstall and restart.

# Installation problem: the library for detailed prop collision shapes failed; props fall back to simple convex hulls.
mmdhl.install.error.coacd_failed=Detailed collision is unavailable; simple hulls remain available.

# Shown after pressing Recheck when the native part is not loaded yet.
mmdhl.install.error.restart_to_load=Installation was checked. Fully restart Garry's Mod to load repaired native binaries.

# Shown after pressing Recheck when a repaired component needs a restart. {feature}: internal component identifier (imports, detailedCollision, rendering or physics), shown untranslated.
mmdhl.install.error.restart_to_enable=Files for {feature} now pass validation. Fully restart Garry's Mod to enable the repaired component.

# Installation problem: Windows could not load the native module. {reason}: error text from the game (English).
mmdhl.install.error.loader_failed=Native module could not load: {reason}. Check the Microsoft Visual C++ x64 Redistributable and reinstall the native package.

# Installation problem: the installed native module is too old. {recommended}: release number to install.
mmdhl.install.error.no_verification=This native release lacks installation verification. Install {recommended} and restart.

# Installation problem: a game DLL the addon needs was still not ready some seconds after the map loaded.
