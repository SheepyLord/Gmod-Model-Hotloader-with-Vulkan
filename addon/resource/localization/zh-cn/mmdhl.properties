# Model Hotloader: zh-cn translation.
# Each phrase follows the English it translates (# en:). An empty value keeps the English.
# Keep every {placeholder} unchanged; see docs/TRANSLATING.md.
#
# Glossary (English → 简体中文)
# External Models — 外部模型（生成菜单标签页、库窗口标题、NPC/玩家模型分类）
# Character Models (tab, Utilities page) — 角色模型
# Static Props (tab, Utilities page) — 静态道具
# In this map (tab) — 当前地图
# Physics & Performance (tab) — 物理与性能
# Import Character Models / Import Static Props — 导入角色模型 / 导入静态道具
# Spawn Ragdoll — 生成布娃娃
# Spawn Friendly NPC / Spawn Hostile NPC — 生成友方 NPC / 生成敌对 NPC
# Use as Player Model — 用作玩家模型
# Spawn Prop — 生成道具
# Place with tool gun — 用工具枪放置
# Edit parts… — 编辑部件…
# Edit bodygroups… — 编辑模型组件…
# Apply size to aimed prop — 应用尺寸到瞄准的道具
# Import options / Import scale — 导入选项 / 导入缩放
# Reimport — 重新导入
# Import as character — 作为角色导入
# Static Prop tool — “静态道具”工具（工具名：静态道具）
# Unfiled — 未归档
# Favorite / Unfavorite — 收藏 / 取消收藏
# Collides with — 碰撞对象
# World only (collision mode) — 仅世界
# Fast single hull / Detailed collision — 快速单一凸包 / 精细碰撞
# Lightweight jiggle / Jiggle / Full simulation — 轻量摆动 / 摆动 / 完整模拟
# Physics processor — 物理处理器
# Multicore CPU Processor / MMD Compatibility Processor — 多核 CPU 处理器 / MMD 兼容处理器
# character, character model — 角色，角色模型
# static prop — 静态道具
# prop — 道具（游戏译名）
# ragdoll — 布娃娃（游戏译名）
# NPC — NPC（游戏译名）
# player model — 玩家模型（游戏译名）
# bodygroup — 模型组件（游戏 Bodygroups 的译名）
# preset — 预设
# collision (shape) — 碰撞（形状）；collider, collision body — 碰撞体
# hull — 凸包（collision hull：碰撞凸包）
# spring bones — 弹簧骨骼（VRM）
# physics body — 物理刚体；joint — 关节
# secondary physics — 次级物理（头发、衣物等的物理）
# jiggle — 摆动
# expression / morph — 表情
# flex — 表情控制器（游戏译名）；overflow expressions — 溢出表情
# folder — 文件夹；subfolder — 子文件夹
# library — 库（模型库、静态道具库）
# import — 导入；importer — 导入器
# share — 共享；publish — 发布；approve — 批准
# spawn — 生成；place — 放置
# attach / detach — 附加 / 分离
# bone / skeleton / rig — 骨骼 / 骨架 / 骨架绑定
# material / texture — 材质 / 贴图
# mesh / triangles (tris) / vertices — 网格 / 三角面 / 顶点
# VRM avatar — VRM 虚拟形象；licence — 许可；redistribution — 再分发
# as authored — 原始设定（authored parts：原始部件）
# warnings / notes / What to try — 警告 / 提示 / 建议
# units — 单位（Source 距离单位）
# native (package, module, runtime) — 原生（原生组件包、原生模块、原生运行时）
# worker — 工作进程（后台导入程序）；工作线程（物理 CPU 线程）
# carrier — 载体（为角色生成的 Source 布娃娃模型）
# reload (tool gun control) — 换弹键
# left click / right click — 左键单击 / 右键单击
# Physics Gun — 物理枪（游戏译名）
# Tool Gun — 工具枪（游戏译名）
# Face Poser / Finger Poser / Eye Poser — 面部造型 / 手指造型 / 眼部造型（游戏译名）
# posing tools — 造型工具（游戏“造型”工具分类）
# spawn menu — 生成菜单（游戏译名）
# context menu — 环境菜单（游戏译名）
# Undo / Cleanup — 撤销 / 清除全部（游戏译名）
# Weld / NoCollide / constraint — 焊接约束 / 无碰撞 / 约束（游戏译名）
# duplication — 副本（游戏译名）
# Citizen / Combine — 市民 / 联合军（游戏译名）
# freeze / unfreeze — 冻结 / 解冻（游戏译名）
# entity / gamemode / administrator — 实体 / 游戏模式 / 管理员（游戏译名）
# Workshop — 创意工坊（游戏译名）
# gravity / physics material — 重力（游戏译名） / 物理材质
# map / world — 地图 / 世界
# overlay / diagnostics — 叠加层 / 诊断
# adaptive physics / damping / iterations — 自适应物理 / 阻尼 / 迭代次数
# Blender object / modifier / armature — 物体 / 修改器 / 骨架（Blender 中文界面用语）

