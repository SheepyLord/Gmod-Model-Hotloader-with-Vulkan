mmdhl.library.folder.model_move_failed=모델의 폴더 변경 사항을 저장할 수 없습니다.

# en: Could not save folders.
mmdhl.library.folder.save_failed=폴더를 저장할 수 없습니다.

# en: Server approved model
mmdhl.library.server_approved=서버 승인 모델

