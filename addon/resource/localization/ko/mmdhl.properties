mmdhl.server.error.spawn_not_approved=서버에서 승인된 모델만 스폰할 수 있습니다. 관리자가 라이브러리에서 이 모델을 게시할 수 있습니다.

# en: A model is already being placed. Please wait for it to finish.
mmdhl.server.error.spawn_pending=이미 모델을 배치하는 중입니다. 완료될 때까지 기다려 주세요.

# en: Aim at nearby ground or a surface, then try again.
mmdhl.server.error.spawn_aim=가까운 지면이나 표면을 조준한 다음 다시 시도하세요.

# en: Spawning is not permitted by this gamemode.
mmdhl.server.error.spawn_forbidden=이 게임 모드에서는 스폰할 수 없습니다.

# en: Invalid model identity. Refresh the library and select the model again.
mmdhl.server.error.invalid_model_id=잘못된 모델 식별자입니다. 라이브러리를 새로 고치고 모델을 다시 선택하세요.

# en: This model has not been approved by the server administrator.
mmdhl.server.error.not_approved=이 모델은 서버 관리자의 승인을 받지 않았습니다.

# en: The player disconnected.
mmdhl.server.error.player_disconnected=플레이어의 연결이 끊어졌습니다.

# en: Asset load timed out
mmdhl.server.error.asset_timeout=에셋 불러오기 시간이 초과되었습니다

# en: Collision fitting timed out.
mmdhl.server.error.fit_timeout=충돌 피팅 시간이 초과되었습니다.

# en: Native ragdoll creation failed.
mmdhl.server.error.native_ragdoll_failed=네이티브 래그돌을 생성하지 못했습니다.

# en: Could not create this ragdoll: {reason}
mmdhl.server.error.create_failed=이 래그돌을 생성할 수 없습니다: {reason}

# en: This character cannot become a ragdoll: {reason}
mmdhl.server.error.fit_failed=이 캐릭터는 래그돌이 될 수 없습니다: {reason}

# en: Cancelled by map cleanup.
mmdhl.server.error.map_cleanup=맵 정리로 인해 취소되었습니다.

# en: This model has collision corrections from an older joint frame. A fresh fit is used; the saved corrections are kept for reference.
mmdhl.server.notice.old_fit_corrections=이 모델에는 이전 조인트 프레임에서 만든 충돌 보정이 있습니다. 새로 피팅한 결과를 사용하며, 저장된 보정은 참고용으로 보관됩니다.

