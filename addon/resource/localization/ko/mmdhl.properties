mmdhl.props.attach.offset_too_far=부착 오프셋이 대상에서 너무 멉니다.

# en: Select a shared static prop first.
mmdhl.props.attach.select_shared=먼저 공유된 정적 프롭을 선택하세요.

# en: {name} attached to {bone}.
mmdhl.props.attach.attached_to_bone=부착 완료: {name} → {bone}.

# en: bone {number}
mmdhl.props.attach.bone_number=본 {number}

# en: {name} attached.
mmdhl.props.attach.attached=부착 완료: {name}.

# ===== Collision modes and the context menu (props/collision.lua) =====

# en: Nothing (no gravity)
mmdhl.props.collision.none=없음 (중력 없음)

# en: World only
mmdhl.props.collision.world=월드만

# en: Everything except players and NPCs
mmdhl.props.collision.noactors=플레이어와 NPC를 제외한 모든 것

# en: Everything except players
mmdhl.props.collision.noplayers=플레이어를 제외한 모든 것

# en: Everything
mmdhl.props.collision.all=모든 것

# en: Collides with
mmdhl.props.menu.collides_with=충돌 대상

# en: Gravity
mmdhl.props.menu.gravity=중력

# ===== Physics & Performance tab of the library window (physics_settings.lua) =====

# en: Physics & Performance
mmdhl.physics.title=물리 및 성능

# en: Settings apply to all imported characters and are saved automatically. These controls affect hair, clothing and accessories.
mmdhl.physics.intro=설정은 가져온 모든 캐릭터에 적용되며 자동으로 저장됩니다. 이 컨트롤은 머리카락, 옷, 액세서리에 영향을 줍니다.

# en: Physics: Off
mmdhl.physics.status.off=물리: 꺼짐

# en: Physics: Lightweight jiggle
mmdhl.physics.status.jiggle=물리: 가벼운 흔들림

# en: Physics: Full simulation ({count})
mmdhl.physics.status.full=물리: 전체 시뮬레이션 ({count})

# en: CPU threads: {count}
mmdhl.physics.status.threads=CPU 스레드: {count}

# en: CPU threads: automatic
mmdhl.physics.status.threads_automatic=CPU 스레드: 자동

# en: Restart GMod to load the updated physics module.
mmdhl.physics.error.restart_required=업데이트된 물리 모듈을 불러오려면 GMod를 다시 시작하세요.

# en: Physics settings could not be applied.
mmdhl.physics.error.apply_failed=물리 설정을 적용할 수 없습니다.

# en: Worker count could not be applied.
mmdhl.physics.error.workers_failed=워커 수를 적용할 수 없습니다.

# en: Physics processor
mmdhl.physics.backend.label=물리 프로세서

# en: Multicore CPU Processor is recommended. Vulkan GPU Processor solves on the graphics card and needs the DXVK renderer to keep up; with few CPU threads it can still fall behind at high accuracy. MMD Compatibility favors original motion. OpenCL is experimental and may be slower.
mmdhl.physics.backend.tooltip=멀티코어 CPU 프로세서를 권장합니다. Vulkan GPU 프로세서는 그래픽 카드에서 계산하며 제때 처리하려면 DXVK 렌더러가 필요합니다. CPU 스레드가 적으면 높은 정확도에서 여전히 뒤처질 수 있습니다. MMD 호환 프로세서는 원래 움직임 재현을 우선합니다. OpenCL은 실험적 기능이며 더 느릴 수 있습니다.

# en: Hair and clothing collide with
mmdhl.physics.collision.label=머리카락과 옷의 충돌 대상

# en: Living players and NPCs are excluded. Hair and clothing react to objects without pushing them.
mmdhl.physics.collision.tooltip=살아 있는 플레이어와 NPC는 제외됩니다. 머리카락과 옷은 오브젝트를 밀지 않고 반응만 합니다.

# en: Spawn frozen (new placements only)
mmdhl.physics.spawn_frozen.label=고정된 상태로 스폰 (새 배치에만 적용)

# en: Existing limbs keep their current frozen state.
mmdhl.physics.spawn_frozen.tooltip=기존 팔다리는 현재 고정 상태를 유지합니다.

# en: Physics accuracy — Off
mmdhl.physics.accuracy.off=물리 정확도 — 꺼짐

# en: Physics accuracy — Jiggle
mmdhl.physics.accuracy.jiggle=물리 정확도 — 흔들림

# en: Physics accuracy — {count} iterations
mmdhl.physics.accuracy.iterations=물리 정확도 — 반복 {count}회

# en: −1: Off · 0: Jiggle · Levels 1–7: 1, 2, 5, 10, 20, 50, 100 iterations. Default: level 4 (10 iterations).
mmdhl.physics.accuracy.tooltip=−1: 꺼짐 · 0: 흔들림 · 레벨 1–7: 반복 1, 2, 5, 10, 20, 50, 100회. 기본값: 레벨 4(반복 10회).

# en: −1: Off · 0: Jiggle · 1–7: Full physics (1, 2, 5, 10, 20, 50, 100 iterations). Jiggle moves only each chain’s first bone; children follow without bending independently. VRM spring bones run fully at every level except Off.
mmdhl.physics.accuracy.help=−1: 꺼짐 · 0: 흔들림 · 1–7: 전체 물리(반복 1, 2, 5, 10, 20, 50, 100회). 흔들림은 각 체인의 첫 번째 본만 움직이며, 자식 본은 따로 휘지 않고 따라옵니다. VRM 스프링 본은 꺼짐을 제외한 모든 레벨에서 완전히 작동합니다.

# en: Gravity multiplier
mmdhl.physics.gravity.label=중력 배율

# en: Default 1. Scales the gravity of the character model's own physics; Source ragdoll gravity is unchanged.
mmdhl.physics.gravity.tooltip=기본값 1. 캐릭터 모델 자체 물리의 중력 크기를 조정하며, Source 래그돌 중력은 변경되지 않습니다.

# en: Motion damping
mmdhl.physics.damping.label=움직임 감쇠

# en: Default 1. Higher values make motion settle faster. Zero removes damping.
mmdhl.physics.damping.tooltip=기본값 1. 값이 클수록 움직임이 더 빨리 안정됩니다. 0이면 감쇠가 없어집니다.

# en: VRM: hair and clothing keep their shape while moving
mmdhl.physics.vrm_damping.label=VRM: 이동 중에도 머리카락과 옷의 형태 유지

# en: Default on. VRM spring bones damp motion against the character's hips instead of the world, so walking or a thrown ragdoll no longer drags hair and skirts behind; starting, stopping and turning still swing them. Off gives the plain VRM behaviour.
mmdhl.physics.vrm_damping.tooltip=기본값 켜짐. VRM 스프링 본이 월드 대신 캐릭터의 엉덩이를 기준으로 움직임을 감쇠하므로, 걷거나 래그돌을 던질 때 머리카락과 치마가 뒤로 끌려가지 않습니다. 출발, 정지, 회전할 때는 여전히 흔들립니다. 끄면 일반 VRM 동작이 됩니다.

# en: Adaptive physics
mmdhl.lod.title=적응형 물리

# en: Adaptive physics quality
mmdhl.lod.enabled.label=적응형 물리 품질

# en: Reduce iterations or suspend secondary physics for distant or unseen slow-moving characters.
mmdhl.lod.enabled.tooltip=멀리 있거나 보이지 않는, 느리게 움직이는 캐릭터의 반복 횟수를 줄이거나 2차 물리를 일시 중지합니다.

# en: Distance and visibility settings
mmdhl.lod.advanced=거리 및 가시성 설정

# en: Always full quality within (units)
mmdhl.lod.near.label=항상 전체 품질 범위 (유닛)

# en: Visibility never reduces quality inside this range.
mmdhl.lod.near.tooltip=이 범위 안에서는 가시성 때문에 품질이 낮아지지 않습니다.

# en: Visible full quality within
mmdhl.lod.full.label=보일 때 전체 품질 범위

# en: Use the configured full solver iterations.
mmdhl.lod.full.tooltip=설정된 전체 솔버 반복 횟수를 사용합니다.

# en: Half quality within
mmdhl.lod.middle.label=절반 품질 범위

# en: More distant active models use quarter quality.
mmdhl.lod.middle.tooltip=이보다 멀리 있는 활성 모델은 1/4 품질을 사용합니다.

# en: Physics distance cutoff
mmdhl.lod.cutoff.label=물리 차단 거리

# en: Slow, unheld models suspend beyond this distance.
mmdhl.lod.cutoff.tooltip=잡고 있지 않은 느린 모델은 이 거리를 넘으면 일시 중지됩니다.

# en: Invisible delay (seconds)
mmdhl.lod.hidden.label=보이지 않을 때 지연 (초)

# en: Suspend invisible slow-moving models after this delay.
mmdhl.lod.hidden.tooltip=보이지 않는 느린 모델을 이 지연 시간 후에 일시 중지합니다.

# en: Full quality speed (units/s)
mmdhl.lod.speed.label=전체 품질 속도 (유닛/초)

# en: Any primary limb can request full quality.
mmdhl.lod.speed.tooltip=주요 팔다리 중 하나라도 전체 품질을 요청할 수 있습니다.

# en: Full quality rotation (deg/s)
mmdhl.lod.angular.label=전체 품질 회전 (도/초)

# en: Fast rotation requests full quality.
mmdhl.lod.angular.tooltip=빠르게 회전하면 전체 품질을 요청합니다.

# en: Stretch protection (Experimental)
mmdhl.physics.stretch.title=늘어남 방지 (실험적)

# en: Limit excessive stretching
mmdhl.physics.stretch.label=과도한 늘어남 제한

# en: Default off. Limits excess separation without changing authored damping, masses or springs. World and prop contacts take priority.
mmdhl.physics.stretch.tooltip=기본값 꺼짐. 제작된 감쇠, 질량, 스프링을 바꾸지 않고 과도한 벌어짐을 제한합니다. 월드 및 프롭과의 접촉이 우선합니다.

# en: Allowed stretch
mmdhl.physics.stretch_tolerance.label=허용 늘어남

# en: Default 1. Lower values hold sleeve and hair attachments more tightly; higher values allow more separation before correction.
mmdhl.physics.stretch_tolerance.tooltip=기본값 1. 값이 낮을수록 소매와 머리카락 연결부를 더 단단히 붙잡고, 값이 높을수록 보정 전에 더 많이 벌어질 수 있습니다.

# en: Correction slides along world and prop surfaces. A compressed chain may temporarily exceed its stretch allowance to avoid being pushed through the ground.
mmdhl.physics.stretch.help=보정은 월드와 프롭 표면을 따라 미끄러지듯 적용됩니다. 압축된 체인은 지면을 뚫고 밀려나지 않도록 일시적으로 늘어남 허용치를 넘을 수 있습니다.

# en: Performance
mmdhl.performance.title=성능

# en: CPU threads (0 = automatic)
mmdhl.performance.workers.label=CPU 스레드 (0 = 자동)

# en: Automatic uses logical CPU threads minus two (all threads on CPUs with four or fewer). One lane is the calling thread. Changing this briefly waits for current jobs to finish.
mmdhl.performance.workers.tooltip=자동은 논리 CPU 스레드 수에서 2를 뺀 값을 사용합니다(스레드가 4개 이하인 CPU에서는 모든 스레드). 레인 하나는 호출 스레드입니다. 변경하면 현재 작업이 끝날 때까지 잠시 기다립니다.

# en: Pause settled hair and clothing
mmdhl.performance.sleep.label=안정된 머리카락과 옷 일시 중지

# en: Default on. Movement automatically resumes simulation.
mmdhl.performance.sleep.tooltip=기본값 켜짐. 움직이면 시뮬레이션이 자동으로 재개됩니다.

# en: Advanced performance settings
mmdhl.performance.advanced=고급 성능 설정

# en: Physics wait time (ms)
mmdhl.performance.wait.label=물리 대기 시간 (ms)

# en: Default 0 keeps rendering responsive. Waiting may present a newer completed secondary tick, but increases frame time.
mmdhl.performance.wait.tooltip=기본값 0은 렌더링 반응성을 유지합니다. 대기하면 더 최근에 완료된 2차 틱을 표시할 수 있지만 프레임 시간이 늘어납니다.

# en: Reuse prepared model geometry
mmdhl.performance.vertex_cache.label=준비된 모델 지오메트리 재사용

# en: Default on. Reuses geometry across rendering passes.
mmdhl.performance.vertex_cache.tooltip=기본값 켜짐. 렌더링 패스 간에 지오메트리를 재사용합니다.

# en: Compact vertex upload
mmdhl.performance.compact_vertices.label=압축 정점 업로드

# en: Default on. Sends animated model vertices in half the size. Turn off if model shading looks wrong.
mmdhl.performance.compact_vertices.tooltip=기본값 켜짐. 애니메이션된 모델 정점을 절반 크기로 전송합니다. 모델 셰이딩이 이상하게 보이면 끄세요.

# en: GPU skinning
mmdhl.performance.gpu_skinning.label=GPU 스키닝

# en: Default on. The graphics card bends the models, as it does for Source models; the CPU only sends bone positions. Turn off if a model looks torn or misplaced.
mmdhl.performance.gpu_skinning.tooltip=기본값 켜짐. Source 모델과 마찬가지로 그래픽 카드가 모델을 변형하며, CPU는 본 위치만 전송합니다. 모델이 찢어지거나 어긋나 보이면 끄세요.

# en: Smooth tick-rate skeletons
mmdhl.performance.smooth_poses.label=틱레이트 스켈레톤 부드럽게 표시

# en: Default on. Characters posed over the network, such as NPCs driven by an animation player, only change at the server tick rate. This shows them one update behind, interpolated, so body and hair move every frame.
mmdhl.performance.smooth_poses.tooltip=기본값 켜짐. 애니메이션 플레이어로 구동되는 NPC처럼 네트워크를 통해 포즈가 전달되는 캐릭터는 서버 틱레이트로만 바뀝니다. 이 옵션은 한 업데이트 늦게 보간하여 표시하므로 몸과 머리카락이 매 프레임 움직입니다.

# en: Pose update rate
mmdhl.performance.update_lod.label=포즈 업데이트 빈도

# en: Every frame for every model
mmdhl.performance.update_lod.every_frame=모든 모델 매 프레임

# en: Unseen models 10 times a second (default)
mmdhl.performance.update_lod.unseen=보이지 않는 모델은 초당 10회 (기본값)

# en: Also small on-screen models 20-30 times a second
mmdhl.performance.update_lod.small=화면의 작은 모델도 초당 20-30회

# en: Default 1. Anything you can see, including its shadow, updates every frame; models drawn nowhere update 10 times a second. Setting 2 also slows small or distant models on screen, which can look stepped when they move.
mmdhl.performance.update_lod.tooltip=기본값 1. 그림자를 포함해 보이는 모든 것은 매 프레임 업데이트되며, 어디에도 그려지지 않는 모델은 초당 10회 업데이트됩니다. 설정 2는 화면의 작거나 멀리 있는 모델도 느리게 업데이트하므로, 움직일 때 끊겨 보일 수 있습니다.

# en: Correct lighting on overlapping surfaces
mmdhl.performance.flashlight_fix.label=겹친 표면의 조명 보정

# en: Default on. Coincident surfaces receive one flashlight contribution; faces separated by animation remain visible.
mmdhl.performance.flashlight_fix.tooltip=기본값 켜짐. 겹쳐 있는 표면은 손전등 조명을 한 번만 받으며, 애니메이션으로 분리된 면은 계속 보입니다.

# en: Resting movement threshold
mmdhl.performance.sleep_linear.label=정지 이동 임계값

# en: Default 0.5. Bodies below both speed thresholds can go to sleep.
mmdhl.performance.sleep_linear.tooltip=기본값 0.5. 두 속도 임계값보다 모두 느린 바디는 슬립 상태가 될 수 있습니다.

# en: Resting rotation threshold
mmdhl.performance.sleep_angular.label=정지 회전 임계값

# en: Default 0.35.
mmdhl.performance.sleep_angular.tooltip=기본값 0.35.

# en: Time at rest before sleep (seconds)
mmdhl.performance.sleep_seconds.label=슬립까지 정지 시간 (초)

# en: Default 1.5.
mmdhl.performance.sleep_seconds.tooltip=기본값 1.5.

# en: Movement needed to resume
mmdhl.performance.wake_drift.label=재개에 필요한 움직임

# en: Default 0.02. Raising this permits more movement before a resting chain wakes.
mmdhl.performance.wake_drift.tooltip=기본값 0.02. 값을 높이면 정지한 체인이 깨어나기 전에 더 많이 움직일 수 있습니다.

# en: Diagnostics & recovery
mmdhl.debug.section=진단 및 복구

# en: Show physics and performance overlay
mmdhl.debug.overlay=물리 및 성능 오버레이 표시

# en: Print a performance summary every five seconds
mmdhl.debug.print=5초마다 성능 요약 출력

# en: Write diagnostic report
mmdhl.debug.write_report=진단 보고서 작성

# en: Reset physics for all models
mmdhl.physics.reset_all=모든 모델의 물리 초기화

# en: Clean up local ragdolls
mmdhl.physics.cleanup_ragdolls=로컬 래그돌 정리

# en: Local ragdolls pause secondary physics while all Source bodies sleep, and resume when a body wakes. Cleanup affects only this client’s character model ragdolls.
mmdhl.physics.cleanup_help=로컬 래그돌은 모든 Source 바디가 슬립 상태일 때 2차 물리를 일시 중지하고, 바디가 깨어나면 재개합니다. 정리는 이 클라이언트의 캐릭터 모델 래그돌에만 적용됩니다.

# en: Toggle physics on / off
mmdhl.physics.toggle=물리 켜기 / 끄기

# en: Toggle physics shortcut (unassigned; Escape clears)
mmdhl.physics.toggle_shortcut=물리 켜기/끄기 단축키 (할당 안 됨, Escape로 지우기)

# en: Reset all physics shortcut (unassigned; F8 is reserved for recording)
mmdhl.physics.reset_shortcut=모든 물리 초기화 단축키 (할당 안 됨, F8은 녹화용으로 예약됨)

# en: Restore Recommended Settings
mmdhl.physics.restore_defaults=권장 설정 복원

# en: Recommended: Multicore CPU Processor, collisions with map and objects, adaptive quality and automatic CPU thread count.
mmdhl.physics.restore_help=권장: 멀티코어 CPU 프로세서, 맵 및 오브젝트와 충돌, 적응형 품질, 자동 CPU 스레드 수.

# ===== Physics processor and collision choices (secondary_backend.lua, secondary_collision.lua) =====

# en: Multicore CPU Processor
mmdhl.secondary.backend.multicore=멀티코어 CPU 프로세서

# en: MMD Compatibility Processor
mmdhl.secondary.backend.compatibility=MMD 호환 프로세서

# en: Legacy Multicore CPU Processor
mmdhl.secondary.backend.legacy_multicore=레거시 멀티코어 CPU 프로세서

# en: OpenCL GPU Processor (Experimental)
mmdhl.secondary.backend.gpu=OpenCL GPU 프로세서 (실험적)

# en: Vulkan GPU Processor (Experimental)
mmdhl.secondary.backend.vulkan=Vulkan GPU 프로세서 (실험적)

# en: Unknown secondary backend.
mmdhl.secondary.error.unknown_backend=알 수 없는 2차 물리 백엔드입니다.

# en: Character only
mmdhl.secondary.collision.character=캐릭터만

# en: Character and map
mmdhl.secondary.collision.map=캐릭터 및 맵

# en: Character, map and objects (recommended)
