mmdhl.library.error.not_in_cache=이 모델은 더 이상 캐시에 없습니다. 라이브러리를 새로 고치세요.

# en: Could not save the library change. Check available disk space.
mmdhl.library.error.save_failed=라이브러리 변경 사항을 저장할 수 없습니다. 디스크 여유 공간을 확인하세요.

# ===== Character library: deleting models (library.lua) =====

# en: Finish the current import, placement or deletion first.
mmdhl.library.delete.busy=진행 중인 가져오기, 배치 또는 삭제를 먼저 완료하세요.

# en: This model is no longer in the library.
mmdhl.library.delete.not_in_library=이 모델은 더 이상 라이브러리에 없습니다.

# en: Could not remove a ragdoll from the map. Remove it and retry.
mmdhl.library.delete.ragdoll_stuck=맵에서 래그돌을 제거할 수 없습니다. 래그돌을 직접 제거한 후 다시 시도하세요.

# en: Deleted imported models, generated rigs and unused textures. Original files are kept.
mmdhl.library.delete.done=가져온 모델, 생성된 리그, 사용하지 않는 텍스처를 삭제했습니다. 원본 파일은 유지됩니다.

# en: Deleted imported models, generated rigs and unused textures. Original files are kept. {count} files are still held by the game; disk cleanup will finish at the next game start.
mmdhl.library.delete.done_pending=가져온 모델, 생성된 리그, 사용하지 않는 텍스처를 삭제했습니다. 원본 파일은 유지됩니다. 파일 {count}개를 아직 게임이 사용하고 있으며, 디스크 정리는 다음에 게임을 시작할 때 완료됩니다.

# ===== Importing: status messages (library.lua) =====

