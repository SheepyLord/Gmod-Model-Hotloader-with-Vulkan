# en: “{name}” looks like a character: it has a humanoid skeleton with {bones} bones and {bodies} physics bodies.\n\nAs a static prop it stays a frozen statue in its reference pose. Import it under Character Models instead, as a posable ragdoll?
mmdhl.library.character_instead.text=“{name}”은(는) 캐릭터로 보입니다. 본 {bones}개와 물리 바디 {bodies}개로 된 휴머노이드 스켈레톤이 있습니다.\n\n정적 프롭으로 가져오면 기준 포즈 그대로 굳은 조각상이 됩니다. 대신 캐릭터 모델에서 포즈를 잡을 수 있는 래그돌로 가져오시겠습니까?

# en: Import as Character model?
mmdhl.library.character_instead.title=캐릭터 모델로 가져오시겠습니까?

# en: Import as character
mmdhl.library.character_instead.import=캐릭터로 가져오기

# en: Keep as static prop
mmdhl.library.character_instead.keep=정적 프롭으로 유지

# en: “{name}” contains a rigged humanoid ({bones} bones). It was imported as a static prop in its bind pose. Character Models imports PMX and PMD characters; convert it to PMX to make it posable.
mmdhl.library.rigged_prop.text=“{name}”에는 리깅된 휴머노이드(본 {bones}개)가 포함되어 있어, 바인드 포즈 상태의 정적 프롭으로 가져왔습니다. 캐릭터 모델에서는 PMX와 PMD 캐릭터를 가져올 수 있으므로, 포즈를 잡을 수 있게 하려면 PMX로 변환하세요.

