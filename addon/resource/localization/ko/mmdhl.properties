# Model Hotloader: ko translation.
# Each phrase follows the English it translates (# en:). An empty value keeps the English.
# Keep every {placeholder} unchanged; see docs/TRANSLATING.md.
#
# Glossary (English → Korean)
# Register — 메시지·도움말·질문은 합니다체, 버튼·라벨은 짧은 명사형(…하기/…기, 한자어 명사), 진행 상태는 "…하는 중..."
# External Models — 외부 모델 (스폰 메뉴 탭, 라이브러리 창 제목)
# Character Models (tab) — 캐릭터 모델
# Static Props (tab) — 정적 프롭
# In this map (tab) — 현재 맵
# Physics & Performance (tab) — 물리 및 성능
# Import Character Models — 캐릭터 모델 가져오기
# Import Static Props — 정적 프롭 가져오기
# Import as character — 캐릭터로 가져오기
# Spawn Ragdoll — 래그돌 스폰
# Spawn Friendly NPC / Spawn Hostile NPC — 우호적 NPC 스폰 / 적대적 NPC 스폰
# Use as Player Model — 플레이어 모델로 사용
# Spawn Prop — 프롭 스폰
# Place with tool gun — 툴 건으로 배치
# Edit parts… — 파츠 편집…
# Edit bodygroups… — 신체 그룹 편집…
# Apply size to aimed prop — 조준한 프롭에 크기 적용
# Import options / Import scale — 가져오기 옵션 / 가져오기 배율
# Static Prop (tool) — 정적 프롭 (도구 이름; "Static Prop tool" = 정적 프롭 도구)
# World only — 월드만 (충돌 모드)
# Collides with — 충돌 대상
# Unfiled — 미분류
# character model — 캐릭터 모델 (줄여서 캐릭터)
# static prop — 정적 프롭
# prop — 프롭 (게임 용어)
# ragdoll — 래그돌 (게임 용어)
# NPC — NPC; Citizen — 시민; Combine — 콤바인 (게임 용어)
# player model — 플레이어 모델 (게임 용어)
# bodygroup — 신체 그룹 (게임 용어)
# part(s) — 파츠 (신체 그룹·파츠 편집에서 보이는 재질 단위)
# as authored / authored parts — 원본 설정 / 원본 파츠 (모델 제작자가 설정한 상태)
# preset — 프리셋
# collision / collision shape — 충돌 / 충돌 형상
# hull / convex hull — 헐 / 볼록 헐 ("collision hull" = 충돌 헐)
# spring bones — 스프링 본
# bone / skeleton / rig — 본 / 스켈레톤 / 리그
# physics body (rigid body) — 물리 바디
# joint — 조인트
# secondary physics — 2차 물리 (머리카락·옷 물리)
# jiggle / Lightweight jiggle — 흔들림 / 가벼운 흔들림
# Full simulation — 전체 시뮬레이션
# expression / morph — 표정 / 모프
# flex — 플렉스 (게임 용어: 플렉스 컨트롤러)
# overflow (Face Poser) — 초과 (얼굴 포져 슬롯에 들어가지 않는 추가 표정)
# material — 재질 (게임 용어)
# vertices / triangles / mesh — 정점 / 삼각형 / 메시
# folder / subfolder — 폴더 / 하위 폴더
# library — 라이브러리
# import / imported / reimport — 가져오기 / 가져온 / 다시 가져오기
# share / publish / approve — 공유 / 게시 / 승인
# favorite — 즐겨찾기
# freeze / unfreeze — 고정 / 고정 해제 (게임 용어)
# spawn / place / placement — 스폰 / 배치 / 배치
# attach / detach — 부착 / 분리
# physics processor — 물리 프로세서
# Multicore CPU Processor — 멀티코어 CPU 프로세서
# MMD Compatibility Processor — MMD 호환 프로세서
# adaptive physics — 적응형 물리
# worker — 워커 (백그라운드 가져오기 프로세스)
# native package / native module / runtime — 네이티브 패키지 / 네이티브 모듈 / 런타임
# diagnostics / overlay — 진단 / 오버레이
# administrator (admin) — 관리자 (게임 용어)
# units — 유닛 (Source 거리 단위)
# first-person arms / hands — 1인칭 팔 / 손
# Physics Gun — 피직스 건 (게임 용어)
# Tool Gun — 툴 건 (게임 용어)
# Face Poser / Finger Poser / Eye Poser — 얼굴 포져 / 손가락 포져 / 눈 포져 (게임 용어)
# spawn menu / context menu — 스폰 메뉴 / 컨텍스트 메뉴 (게임 용어)
# Utilities → User / Undo / Cleanup — 유틸리티 → 유저 / 되돌리기 / 클린업 (게임 용어)
# Tools → Construction — 도구 → 건설 도구 (게임 용어)
# Weapons / Entities — 무기 / 엔티티 (게임 용어)
# Weld / NoCollide / constraint — 용접 / 충돌 없음 (게임 용어) / 제약
# duplication — 복제 (게임 용어)
# Workshop — 창작마당 (게임 용어)
# Options — 옵션 (게임 용어)
# left click / right click / right-click — 좌클릭 / 우클릭
# reload (tool gun control) — 재장전
# fit / fitted collision — 피팅 / 피팅된 충돌 형상
# Detailed collision / fast single hull — 정밀 충돌 / 빠른 단일 헐

