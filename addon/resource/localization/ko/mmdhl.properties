mmdhl.library.static_instead.text_one=“{name}”은(는) 캐릭터로 보이지 않습니다. 본 {bones}개와 물리 바디 {bodies}개가 있지만 휴머노이드 스켈레톤이 없습니다(발견된 머리, 팔, 다리 본: 12개 중 {found}개).\n\n포즈를 잡을 수 있는 래그돌, NPC 또는 플레이어 모델이 되려면 캐릭터에 이 스켈레톤이 있어야 합니다. 대신 정적 프롭으로 가져오시겠습니까?

# en: “{name}” does not look like a character: it has {bones} bone(s) and {bodies} physics bodies but no humanoid skeleton (head, arms and legs found: {found} of 12).\n\nCharacters need that skeleton to become a posable ragdoll, NPC or player model. Import it as a static prop instead?
mmdhl.library.static_instead.text_many=“{name}”은(는) 캐릭터로 보이지 않습니다. 본 {bones}개와 물리 바디 {bodies}개가 있지만 휴머노이드 스켈레톤이 없습니다(발견된 머리, 팔, 다리 본: 12개 중 {found}개).\n\n포즈를 잡을 수 있는 래그돌, NPC 또는 플레이어 모델이 되려면 캐릭터에 이 스켈레톤이 있어야 합니다. 대신 정적 프롭으로 가져오시겠습니까?

