mmdhl.install.notice_binary=Model Hotloader: 바이너리 모듈이 설치되지 않았거나 손상 또는 변경되었습니다.\n여기를 클릭하여 최신 버전을 다운로드하세요.

# en: (warning accepted)
mmdhl.install.accepted_tag=(경고 수락됨)

# en: Running unverified native files because you accepted the warning. Install the recommended release to remove this warning.
mmdhl.install.unverified.in_use=경고를 수락하여 미검증 네이티브 파일로 실행 중입니다. 권장 릴리스를 설치하면 이 경고가 사라집니다.

# en: A server administrator can run mmdhl_accept_unverified_native in the server console and then change the map to use the server's unverified native files anyway.
mmdhl.install.unverified.server_admin=서버 관리자가 서버 콘솔에서 mmdhl_accept_unverified_native를 실행한 뒤 맵을 바꾸면 서버의 미검증 네이티브 파일을 그대로 사용할 수 있습니다.

# en: Use unverified native files?
mmdhl.install.unverified.title=미검증 네이티브 파일을 사용할까요?

# en: The installed native files do not match a release approved for this version of the addon. They may belong to another version, be damaged, or have been modified.\n\nUsing them anyway can crash Garry's Mod, damage saves or make the addon behave unpredictably. Continue only if you trust where these files came from.\n\nYour choice covers only these exact files: if any of them changes, you will be asked again.
mmdhl.install.unverified.warning=설치된 네이티브 파일이 이 애드온 버전에서 승인된 릴리스와 일치하지 않습니다. 다른 버전의 파일이거나, 손상되었거나, 수정된 파일일 수 있습니다.\n\n그래도 사용하면 Garry's Mod가 충돌하거나, 저장 데이터가 손상되거나, 애드온이 예기치 않게 동작할 수 있습니다. 파일 출처를 신뢰할 수 있을 때만 계속하세요.\n\n이 선택은 현재 파일에만 적용됩니다. 파일이 하나라도 바뀌면 다시 묻습니다.

# en: Use anyway
mmdhl.install.unverified.confirm=그래도 사용

# en: Unverified native files accepted. Change or reload the map, or restart Garry's Mod, to start using them.
mmdhl.install.unverified.accepted=미검증 네이티브 파일을 수락했습니다. 사용을 시작하려면 맵을 바꾸거나 다시 불러오거나 Garry's Mod를 다시 시작하세요.

# en: Unverified native files are no longer accepted. Change or reload the map, or restart Garry's Mod.
mmdhl.install.unverified.revoked=미검증 네이티브 파일 수락을 취소했습니다. 맵을 바꾸거나 다시 불러오거나 Garry's Mod를 다시 시작하세요.

# en: There are no unverified native files that accepting would allow.
mmdhl.install.unverified.nothing=수락해서 사용할 수 있게 되는 미검증 네이티브 파일이 없습니다.

# ===== Installation checks (installation.lua) =====

# en: This addon requires Windows x64 Garry's Mod. Select the x86-64 game branch or launch 64 bit version of the game.
mmdhl.install.error.unsupported_platform=이 애드온에는 Windows x64 Garry's Mod가 필요합니다. x86-64 게임 브랜치를 선택하거나 64비트 버전의 게임을 실행하세요.

# en: The Workshop native release policy is missing or invalid. Update the Workshop addon.
mmdhl.install.error.policy_invalid=창작마당 네이티브 릴리스 정책이 없거나 잘못되었습니다. 창작마당 애드온을 업데이트하세요.

# en: Installed native release {installed} is no longer approved. Install {recommended} and restart.
mmdhl.install.error.release_not_approved=설치된 네이티브 릴리스({installed})는 더 이상 승인되지 않습니다. {recommended} 버전을 설치하고 다시 시작하세요.

# en: Missing {path}. Reinstall the native package and restart.
mmdhl.install.error.file_missing={path} 파일이 없습니다. 네이티브 패키지를 다시 설치하고 다시 시작하세요.

# en: Cannot read {path}. Reinstall the native package and restart.
mmdhl.install.error.file_unreadable={path} 파일을 읽을 수 없습니다. 네이티브 패키지를 다시 설치하고 다시 시작하세요.

# en: {path} belongs to {release}, but this installation requires {required} Install a complete approved package and restart.
mmdhl.install.error.file_mixed={path} 파일은 {release} 릴리스에 속하지만, 이 설치에는 {required} 릴리스가 필요합니다. 승인된 전체 패키지를 설치하고 다시 시작하세요.

# en: {path} does not match a recognized binary. It may be damaged or from an unapproved build. Install a complete approved package and restart.
mmdhl.install.error.file_unrecognized={path} 파일이 알려진 바이너리와 일치하지 않습니다. 손상되었거나 승인되지 않은 빌드일 수 있습니다. 승인된 전체 패키지를 설치하고 다시 시작하세요.

# en: Native installation unavailable. Open External Models for repair instructions.
mmdhl.install.unavailable_repair=네이티브 설치를 사용할 수 없습니다. 복구 방법을 보려면 외부 모델을 여세요.

# en: Model Hotloader is checking {feature}.
mmdhl.install.checking_feature=Model Hotloader가 {feature} 구성 요소를 확인하는 중입니다.

# en: Native installation unavailable
mmdhl.install.unavailable=네이티브 설치를 사용할 수 없음

# en: The loaded module does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.
mmdhl.install.error.loaded_module_mismatch=로드된 모듈이 승인된 설치 또는 예상 물리 경로와 일치하지 않습니다. Garry's Mod를 종료하고 전체 패키지를 다시 설치한 후 다시 시작하세요.

# en: The loaded runtime does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.
mmdhl.install.error.loaded_runtime_mismatch=로드된 런타임이 승인된 설치 또는 예상 물리 경로와 일치하지 않습니다. Garry's Mod를 종료하고 전체 패키지를 다시 설치한 후 다시 시작하세요.

# en: Worker self-test failed. Reinstall native binaries and dependencies.
mmdhl.install.error.worker_failed=워커 자체 테스트에 실패했습니다. 네이티브 바이너리와 종속 요소를 다시 설치하세요.

# en: Worker and runtime identities do not match the approved native release. Reinstall and restart.
mmdhl.install.error.worker_mismatch=워커와 런타임의 식별 정보가 승인된 네이티브 릴리스와 일치하지 않습니다. 다시 설치하고 다시 시작하세요.

# en: Detailed collision is unavailable; simple hulls remain available.
mmdhl.install.error.coacd_failed=정밀 충돌을 사용할 수 없습니다. 단순 헐은 계속 사용할 수 있습니다.

# en: Installation was checked. Fully restart Garry's Mod to load repaired native binaries.
mmdhl.install.error.restart_to_load=설치를 확인했습니다. 복구된 네이티브 바이너리를 불러오려면 Garry's Mod를 완전히 다시 시작하세요.

# en: Files for {feature} now pass validation. Fully restart Garry's Mod to enable the repaired component.
mmdhl.install.error.restart_to_enable={feature} 파일이 이제 검증을 통과합니다. 복구된 구성 요소를 사용하려면 Garry's Mod를 완전히 다시 시작하세요.

# en: Native module could not load: {reason}. Check the Microsoft Visual C++ x64 Redistributable and reinstall the native package.
mmdhl.install.error.loader_failed=네이티브 모듈을 불러올 수 없습니다: {reason}. Microsoft Visual C++ x64 재배포 가능 패키지를 확인하고 네이티브 패키지를 다시 설치하세요.

# en: This native release lacks installation verification. Install {recommended} and restart.
mmdhl.install.error.no_verification=이 네이티브 릴리스에는 설치 검증 기능이 없습니다. {recommended} 버전을 설치하고 다시 시작하세요.

# en: A required game library did not become available after map startup. Restart the game or check Workshop for a compatibility update.
mmdhl.install.error.game_not_ready=맵이 시작된 후에도 필요한 게임 라이브러리를 사용할 수 없습니다. 게임을 다시 시작하거나 창작마당에서 호환성 업데이트를 확인하세요.

# en: This Garry's Mod build has not been tested with this native release ({libraries} changed). Model Hotloader runs anyway; if something misbehaves, check Workshop and GitHub for an update.
mmdhl.install.warning.game_untested=이 Garry's Mod 빌드는 이 네이티브 릴리스로 테스트되지 않았습니다({libraries} 변경됨). Model Hotloader는 그대로 실행됩니다. 문제가 생기면 창작마당과 GitHub에서 업데이트를 확인하세요.

