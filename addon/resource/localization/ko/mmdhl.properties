# en: A file window opened to choose the model. If you cannot see it, check the taskbar or press Alt+Tab.
mmdhl.library.picker.windowed=모델을 선택할 파일 창이 열렸습니다. 창이 보이지 않으면 작업 표시줄을 확인하거나 Alt+Tab을 누르세요.

# en: Finish the current import first.
mmdhl.library.import.busy=진행 중인 가져오기를 먼저 완료하세요.

# en: Reimporting prop...
mmdhl.library.import.reimporting_prop=프롭을 다시 가져오는 중...

