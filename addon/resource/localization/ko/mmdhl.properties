mmdhl.install.notice=Model Hotloader에 확인이 필요합니다.\n설치 정보를 보려면 외부 모델을 여세요.\n여기를 클릭하면 경고를 볼 수 있습니다.

# en: The binary module required for this addon is not installed, broken or modified. Please download the most recent version using the buttons below.
mmdhl.install.binary_problem=이 애드온에 필요한 바이너리 모듈이 설치되지 않았거나 손상 또는 변경되었습니다. 아래 버튼으로 최신 버전을 다운로드하세요.

