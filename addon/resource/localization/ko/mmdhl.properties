# en: Choose Import as character below: VRM avatars become posable ragdolls with their spring-bone physics.
mmdhl.library.hint.vrm_avatar=아래의 ‘캐릭터로 가져오기’를 선택하세요. VRM 아바타는 스프링 본 물리를 갖춘, 포즈를 잡을 수 있는 래그돌이 됩니다.

# en: Import it under Static Props instead. Characters must be PMX, PMD or VRM files.
mmdhl.library.hint.static_file=대신 정적 프롭에서 가져오세요. 캐릭터는 PMX, PMD 또는 VRM 파일이어야 합니다.

# en: The VRM humanoid is incomplete. Export it again from VRoid Studio, UniVRM or the Blender VRM add-on with every required humanoid bone assigned.
mmdhl.library.hint.vrm_humanoid=VRM 휴머노이드가 불완전합니다. 필수 휴머노이드 본을 모두 할당한 뒤 VRoid Studio, UniVRM 또는 Blender VRM 애드온에서 다시 내보내세요.

# en: The VRM file refers to data stored beside it. Export it again as one self-contained .vrm file.
mmdhl.library.hint.vrm_external_buffer=VRM 파일이 옆에 따로 저장된 데이터를 참조합니다. 모든 데이터가 포함된 단일 .vrm 파일로 다시 내보내세요.

# en: The VRM file is damaged or incomplete. Export it again from the original program and retry.
mmdhl.library.hint.vrm_damaged=VRM 파일이 손상되었거나 불완전합니다. 원래 프로그램에서 다시 내보낸 후 다시 시도하세요.

# en: The file could not be read. Check that it still exists, is not open in another program, and that its folder is accessible.
mmdhl.library.hint.cannot_open=파일을 읽을 수 없습니다. 파일이 아직 있는지, 다른 프로그램에서 열려 있지 않은지, 폴더에 접근할 수 있는지 확인하세요.

# en: The file could not be parsed. Re-export it from its original program (GLB or FBX work best) and import again.
mmdhl.library.hint.parser=파일을 해석할 수 없습니다. 원래 프로그램에서 다시 내보낸 후(GLB 또는 FBX 권장) 다시 가져오세요.

# en: This is not a readable .blend file. Save it again in Blender, or export it as GLB or FBX.
mmdhl.library.hint.not_blend=읽을 수 있는 .blend 파일이 아닙니다. Blender에서 다시 저장하거나 GLB 또는 FBX로 내보내세요.

# en: The file contains no mesh triangles; it may hold only an armature, cameras, lights, curves or text. In Blender, convert them with Object > Convert > Mesh.
mmdhl.library.hint.no_triangles=파일에 메시 삼각형이 없습니다. 아마추어, 카메라, 라이트, 커브 또는 텍스트만 들어 있을 수 있습니다. Blender에서 Object > Convert > Mesh(오브젝트 > 변환 > 메시)로 변환하세요.

# en: The objects chosen at import were renamed or removed in Blender. Import the file again to choose objects.
mmdhl.library.hint.blend_objects_changed=가져올 때 선택한 오브젝트가 Blender에서 이름이 바뀌었거나 제거되었습니다. 파일을 다시 가져와 오브젝트를 선택하세요.

# en: The compressed .blend file is damaged or incomplete. Save it again in Blender (File > Save) and retry.
mmdhl.library.hint.blend_compressed=압축된 .blend 파일이 손상되었거나 불완전합니다. Blender에서 다시 저장(File > Save)한 후 다시 시도하세요.

# en: The file is incomplete, possibly still being written or copied. Save it again and retry.
mmdhl.library.hint.truncated=파일이 불완전합니다. 아직 저장 또는 복사 중일 수 있습니다. 다시 저장한 후 다시 시도하세요.

# en: This .blend file uses data the importer cannot read. Open it in Blender and export the model as GLB or FBX.
mmdhl.library.hint.blend_unsupported=이 .blend 파일에는 가져오기 도구가 읽을 수 없는 데이터가 있습니다. Blender에서 열어 모델을 GLB 또는 FBX로 내보내세요.

# en: The model has too many materials (limit 128). Merge materials in the original program before importing.
mmdhl.library.hint.material_limit=모델의 재질이 너무 많습니다(최대 128개). 가져오기 전에 원래 프로그램에서 재질을 병합하세요.

# en: The file or its textures exceed the 256 MB limit. Reduce texture sizes or split the model.
mmdhl.library.hint.byte_limit=파일 또는 텍스처가 256 MB 제한을 초과합니다. 텍스처 크기를 줄이거나 모델을 분할하세요.

# en: The geometry is too large for one prop. Split the model or decimate it.
mmdhl.library.hint.geometry_budget=프롭 하나로 쓰기에는 지오메트리가 너무 큽니다. 모델을 분할하거나 폴리곤 수를 줄이세요.

# en: The PMX file is damaged or uses an unsupported version. PMX 2.0 and 2.1 are supported.
mmdhl.library.hint.pmx=PMX 파일이 손상되었거나 지원되지 않는 버전입니다. PMX 2.0과 2.1을 지원합니다.

# en: The model is extremely small. Raise Import scale in Import options, then retry.
mmdhl.library.hint.too_small=모델이 지나치게 작습니다. 가져오기 옵션에서 가져오기 배율을 높인 후 다시 시도하세요.

# en: The model is extremely large. Lower Import scale in Import options, then retry.
mmdhl.library.hint.too_large=모델이 지나치게 큽니다. 가져오기 옵션에서 가져오기 배율을 낮춘 후 다시 시도하세요.

# en: The model sits very far from its origin. Move it to the origin in its original program.
mmdhl.library.hint.recenter=모델이 원점에서 매우 멀리 떨어져 있습니다. 원래 프로그램에서 모델을 원점으로 옮기세요.

# en: The importer stopped unexpectedly. The file may be damaged or use unsupported features.
mmdhl.library.hint.importer_exited=가져오기 도구가 예기치 않게 중지되었습니다. 파일이 손상되었거나 지원되지 않는 기능을 사용하고 있을 수 있습니다.

# en: The import took longer than five minutes. Use the fast collision option or a smaller model.
mmdhl.library.hint.timeout=가져오기가 5분 넘게 걸렸습니다. 빠른 충돌 옵션을 사용하거나 더 작은 모델을 사용하세요.

# en: This file type is not supported here. Static props accept OBJ, FBX, GLB, GLTF, PMX and BLEND; PMD characters belong in Character Models.
mmdhl.library.hint.unsupported_type=여기서는 지원하지 않는 파일 형식입니다. 정적 프롭은 OBJ, FBX, GLB, GLTF, PMX, BLEND를 지원하며, PMD 캐릭터는 캐릭터 모델에서 가져와야 합니다.

# en: The skeleton could not be read. The model may be damaged; try re-saving it in PMX Editor.
mmdhl.library.hint.skeleton=스켈레톤을 읽을 수 없습니다. 모델이 손상되었을 수 있으니 PMX Editor에서 다시 저장해 보세요.

# en: Check the file in its original program, export it again and retry. Copy the details below when reporting the problem.
mmdhl.library.hint.default=원래 프로그램에서 파일을 확인하고 다시 내보낸 후 다시 시도하세요. 문제를 보고할 때는 아래 세부 정보를 복사하세요.

