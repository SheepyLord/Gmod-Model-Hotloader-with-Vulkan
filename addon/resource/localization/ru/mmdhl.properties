mmdhl.bonemap.issue.side=«{bone}» находится на стороне персонажа «{side}», но используется как «{part}».

# en: The toes point backwards in the picture. Left and right may be swapped.
mmdhl.bonemap.issue.facing=На рисунке носки смотрят назад. Возможно, лево и право перепутаны.

