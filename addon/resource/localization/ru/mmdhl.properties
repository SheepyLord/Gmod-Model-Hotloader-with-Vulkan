mmdhl.library.cause.format_unknown=Этот файл не является моделью, которую может прочитать импортёр.

# en: The VRM file contains invalid or incomplete data.
mmdhl.library.cause.vrm_damaged=Файл VRM содержит недопустимые или неполные данные.

