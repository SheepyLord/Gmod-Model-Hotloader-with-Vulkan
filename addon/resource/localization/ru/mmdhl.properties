mmdhl.library.cause.vrm_humanoid=В гуманоидной схеме VRM нет кости {bone}.

# en: The VRM file refers to data stored in other files.
mmdhl.library.cause.vrm_external=Файл VRM ссылается на данные из других файлов.

# en: The spring-bone settings are invalid.
mmdhl.library.cause.spring=Настройки пружинных костей недопустимы.

