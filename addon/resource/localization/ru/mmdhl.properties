mmdhl.install.unverified.warning=Установленные нативные файлы не соответствуют ни одному выпуску, одобренному для этой версии аддона. Возможно, они от другой версии, повреждены или изменены.\n\nИх использование может привести к вылету Garry's Mod, повреждению сохранений или непредсказуемой работе аддона. Продолжайте, только если доверяете источнику этих файлов.\n\nВаш выбор относится только к этим файлам: если какой-либо из них изменится, вопрос будет задан снова.

# en: Use anyway
