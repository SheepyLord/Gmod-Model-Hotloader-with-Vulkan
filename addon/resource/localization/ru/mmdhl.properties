# ===== Physics & Performance tab of the library window (physics_settings.lua) =====

# en: Physics & Performance
mmdhl.physics.title=Физика и быстродействие

# en: Settings apply to all imported characters and are saved automatically. These controls affect hair, clothing and accessories.
mmdhl.physics.intro=Настройки применяются ко всем импортированным персонажам и сохраняются автоматически. Эти параметры влияют на волосы, одежду и аксессуары.

# en: Physics: Off
mmdhl.physics.status.off=Физика: выкл.

# en: Physics: Lightweight jiggle
mmdhl.physics.status.jiggle=Физика: лёгкое покачивание

# en: Physics: Full simulation ({count})
mmdhl.physics.status.full=Физика: полная симуляция ({count})

# en: CPU threads: {count}
mmdhl.physics.status.threads=Потоки CPU: {count}

# en: CPU threads: automatic
mmdhl.physics.status.threads_automatic=Потоки CPU: автоматически

# en: Restart GMod to load the updated physics module.
mmdhl.physics.error.restart_required=Перезапустите GMod, чтобы загрузить обновлённый модуль физики.

# en: Physics settings could not be applied.
mmdhl.physics.error.apply_failed=Не удалось применить настройки физики.

# en: Worker count could not be applied.
mmdhl.physics.error.workers_failed=Не удалось применить число рабочих потоков.

# en: Physics processor
mmdhl.physics.backend.label=Обработчик физики

# en: Multicore CPU Processor is recommended. Vulkan GPU Processor solves on the graphics card and needs the DXVK renderer to keep up; with few CPU threads it can still fall behind at high accuracy. MMD Compatibility favors original motion. OpenCL is experimental and may be slower.
mmdhl.physics.backend.tooltip=Рекомендуется «Многоядерный CPU-обработчик». «GPU-обработчик Vulkan» считает на видеокарте и успевает только с рендерером DXVK; при малом числе потоков CPU он всё равно может отставать на высокой точности. «Обработчик совместимости с MMD» точнее передаёт исходное движение. OpenCL экспериментальный и может работать медленнее.

# en: Hair and clothing collide with
mmdhl.physics.collision.label=Волосы и одежда сталкиваются с

# en: World
mmdhl.physics.collide.world=Миром

# en: The map: walls, floors, stairs and other fixed geometry.
mmdhl.physics.collide.world_tooltip=Карта: стены, пол, лестницы и другая неподвижная геометрия.

# en: Character
mmdhl.physics.collide.character=Персонажем

# en: The character's own body, so hair and clothing stay outside it.
mmdhl.physics.collide.character_tooltip=Собственное тело персонажа, чтобы волосы и одежда не проходили сквозь него.

# en: Objects
mmdhl.physics.collide.objects=Объектами

# en: Props, ragdolls, vehicles and other characters. Hair and clothing react to them without pushing them.
mmdhl.physics.collide.objects_tooltip=Объекты, рэгдоллы, транспорт и другие персонажи. Волосы и одежда реагируют на них, не толкая их.

# en: Living players
mmdhl.physics.collide.players=Живыми игроками

# en: Players who are alive, as simple collision boxes. A player model never collides with its own player.
mmdhl.physics.collide.players_tooltip=Живые игроки в виде простых коробок столкновения. Модель игрока никогда не сталкивается со своим игроком.

# en: Living NPCs
mmdhl.physics.collide.npcs=Живыми НИПами

# en: NPCs and NextBots that are alive, as simple collision boxes. Dead ones become ragdolls, which count as objects.
mmdhl.physics.collide.npcs_tooltip=Живые НИПы и NextBot в виде простых коробок столкновения. Погибнув, они становятся рэгдоллами и считаются объектами.

# en: Spawn frozen (new placements only)
mmdhl.physics.spawn_frozen.label=Создавать замороженными (только новые размещения)

# en: Existing limbs keep their current frozen state.
mmdhl.physics.spawn_frozen.tooltip=Уже существующие конечности сохраняют текущее состояние заморозки.

# en: Physics accuracy — Off
mmdhl.physics.accuracy.off=Точность физики — выкл.

# en: Physics accuracy — Jiggle
mmdhl.physics.accuracy.jiggle=Точность физики — покачивание

# en: Physics accuracy — {count} iterations
mmdhl.physics.accuracy.iterations=Точность физики — итераций: {count}

# en: −1: Off · 0: Jiggle · Levels 1–7: 1, 2, 5, 10, 20, 50, 100 iterations. Default: level 4 (10 iterations).
mmdhl.physics.accuracy.tooltip=−1: выкл. · 0: покачивание · уровни 1–7: 1, 2, 5, 10, 20, 50, 100 итераций. По умолчанию: уровень 4 (10 итераций).

# en: −1: Off · 0: Jiggle · 1–7: Full physics (1, 2, 5, 10, 20, 50, 100 iterations). Jiggle moves only each chain’s first bone; children follow without bending independently. VRM spring bones run fully at every level except Off.
mmdhl.physics.accuracy.help=−1: выкл. · 0: покачивание · 1–7: полная физика (1, 2, 5, 10, 20, 50, 100 итераций). При покачивании движется только первая кость каждой цепочки; дочерние следуют за ней, не изгибаясь самостоятельно. Пружинные кости VRM полностью работают на всех уровнях, кроме «выкл.».

# en: Gravity multiplier
mmdhl.physics.gravity.label=Множитель гравитации

# en: Default 1. Scales the gravity of the character model's own physics; Source ragdoll gravity is unchanged.
mmdhl.physics.gravity.tooltip=По умолчанию 1. Масштабирует гравитацию собственной физики модели персонажа; гравитация рэгдолла Source не меняется.

# en: Motion damping
mmdhl.physics.damping.label=Затухание движения

# en: Default 1. Higher values make motion settle faster. Zero removes damping.
mmdhl.physics.damping.tooltip=По умолчанию 1. Чем выше значение, тем быстрее успокаивается движение. Ноль отключает затухание.

# en: VRM: hair and clothing keep their shape while moving
mmdhl.physics.vrm_damping.label=VRM: волосы и одежда сохраняют форму при движении

# en: Default on. VRM spring bones damp motion against the character's hips instead of the world, so walking or a thrown ragdoll no longer drags hair and skirts behind; starting, stopping and turning still swing them. Off gives the plain VRM behaviour.
mmdhl.physics.vrm_damping.tooltip=По умолчанию включено. Пружинные кости VRM гасят движение относительно бёдер персонажа, а не мира, поэтому при ходьбе или броске рэгдолла волосы и юбки больше не тянутся позади; начало и остановка движения и повороты по-прежнему их раскачивают. Если выключить, VRM ведёт себя как обычно.

# en: Adaptive physics
mmdhl.lod.title=Адаптивная физика

# en: Adaptive physics quality
mmdhl.lod.enabled.label=Адаптивное качество физики

# en: Reduce iterations or suspend secondary physics for distant or unseen slow-moving characters.
mmdhl.lod.enabled.tooltip=Снижать число итераций или приостанавливать вторичную физику у далёких или невидимых медленно движущихся персонажей.

# en: Distance and visibility settings
mmdhl.lod.advanced=Настройки расстояния и видимости

# en: Always full quality within (units)
mmdhl.lod.near.label=Всегда полное качество в пределах (ед.)

# en: Visibility never reduces quality inside this range.
mmdhl.lod.near.tooltip=В этом радиусе видимость никогда не снижает качество.

# en: Visible full quality within
mmdhl.lod.full.label=Полное качество для видимых в пределах

# en: Use the configured full solver iterations.
mmdhl.lod.full.tooltip=Использовать заданное число итераций полного решателя.

# en: Half quality within
mmdhl.lod.middle.label=Половинное качество в пределах

# en: More distant active models use quarter quality.
mmdhl.lod.middle.tooltip=Более далёкие активные модели получают четверть качества.

# en: Physics distance cutoff
mmdhl.lod.cutoff.label=Предельное расстояние физики

# en: Slow, unheld models suspend beyond this distance.
mmdhl.lod.cutoff.tooltip=Медленные модели, которые никто не держит, приостанавливаются дальше этого расстояния.

# en: Invisible delay (seconds)
mmdhl.lod.hidden.label=Задержка для невидимых (секунды)

# en: Suspend invisible slow-moving models after this delay.
mmdhl.lod.hidden.tooltip=Приостанавливать невидимые медленно движущиеся модели по истечении этой задержки.

# en: Full quality speed (units/s)
mmdhl.lod.speed.label=Скорость для полного качества (ед./с)

# en: Any primary limb can request full quality.
mmdhl.lod.speed.tooltip=Полное качество может запросить любая основная конечность.

# en: Full quality rotation (deg/s)
mmdhl.lod.angular.label=Вращение для полного качества (град./с)

# en: Fast rotation requests full quality.
mmdhl.lod.angular.tooltip=Быстрое вращение запрашивает полное качество.

# en: Stretch protection (Experimental)
mmdhl.physics.stretch.title=Защита от растяжения (экспериментально)

# en: Limit excessive stretching
mmdhl.physics.stretch.label=Ограничивать чрезмерное растяжение

# en: Default off. Limits excess separation without changing authored damping, masses or springs. World and prop contacts take priority.
mmdhl.physics.stretch.tooltip=По умолчанию выключено. Ограничивает чрезмерное расхождение, не меняя заданных автором затухания, масс и пружин. Контакты с миром и объектами имеют приоритет.

# en: Allowed stretch
mmdhl.physics.stretch_tolerance.label=Допустимое растяжение

# en: Default 1. Lower values hold sleeve and hair attachments more tightly; higher values allow more separation before correction.
mmdhl.physics.stretch_tolerance.tooltip=По умолчанию 1. Меньшие значения крепче удерживают крепления рукавов и волос; большие допускают большее расхождение до коррекции.

# en: Correction slides along world and prop surfaces. A compressed chain may temporarily exceed its stretch allowance to avoid being pushed through the ground.
mmdhl.physics.stretch.help=Коррекция скользит вдоль поверхностей мира и объектов. Сжатая цепочка может временно превысить допуск растяжения, чтобы её не протолкнуло сквозь землю.

# en: Performance
mmdhl.performance.title=Быстродействие

# en: CPU threads (0 = automatic)
mmdhl.performance.workers.label=Потоки CPU (0 = автоматически)

# en: Automatic uses logical CPU threads minus two (all threads on CPUs with four or fewer). One lane is the calling thread. Changing this briefly waits for current jobs to finish.
mmdhl.performance.workers.tooltip=В автоматическом режиме используется число логических потоков CPU минус два (все потоки на CPU, где их четыре или меньше). Один из параллельных исполнителей — вызывающий поток. При изменении ненадолго ожидается завершение текущих заданий.

# en: Pause settled hair and clothing
mmdhl.performance.sleep.label=Приостанавливать успокоившиеся волосы и одежду

# en: Default on. Movement automatically resumes simulation.
mmdhl.performance.sleep.tooltip=По умолчанию включено. Движение автоматически возобновляет симуляцию.

# en: Advanced performance settings
mmdhl.performance.advanced=Дополнительные настройки быстродействия

# en: Physics wait time (ms)
mmdhl.performance.wait.label=Время ожидания физики (ms)

# en: Default 0 keeps rendering responsive. Waiting may present a newer completed secondary tick, but increases frame time.
mmdhl.performance.wait.tooltip=По умолчанию 0 — отрисовка остаётся отзывчивой. Ожидание может показать более новый завершённый тик вторичной физики, но увеличивает время кадра.

# en: Reuse prepared model geometry
mmdhl.performance.vertex_cache.label=Повторно использовать подготовленную геометрию моделей

# en: Default on. Reuses geometry across rendering passes.
mmdhl.performance.vertex_cache.tooltip=По умолчанию включено. Геометрия повторно используется между проходами отрисовки.

# en: Compact vertex upload
mmdhl.performance.compact_vertices.label=Компактная передача вершин

# en: Default on. Sends animated model vertices in half the size. Turn off if model shading looks wrong.
mmdhl.performance.compact_vertices.tooltip=По умолчанию включено. Анимированные вершины моделей передаются в половинном размере. Отключите, если затенение моделей выглядит неправильно.

# en: GPU skinning
mmdhl.performance.gpu_skinning.label=GPU-скиннинг

# en: Default on. The graphics card bends the models, as it does for Source models; the CPU only sends bone positions. Turn off if a model looks torn or misplaced.
mmdhl.performance.gpu_skinning.tooltip=По умолчанию включено. Видеокарта деформирует модели так же, как модели Source; CPU передаёт только положения костей. Отключите, если модель выглядит разорванной или смещённой.

# en: Smooth tick-rate skeletons
mmdhl.performance.smooth_poses.label=Сглаживать скелеты с частотой тиков

# en: Default on. Characters posed over the network, such as NPCs driven by an animation player, only change at the server tick rate. This shows them one update behind, interpolated, so body and hair move every frame.
mmdhl.performance.smooth_poses.tooltip=По умолчанию включено. Персонажи, чья поза приходит по сети (например, НИПы под управлением проигрывателя анимаций), меняются только с частотой тиков сервера. Этот параметр показывает их с отставанием на одно обновление и интерполирует, чтобы тело и волосы двигались каждый кадр.

# en: Pose update rate
mmdhl.performance.update_lod.label=Частота обновления поз

# en: Every frame for every model
mmdhl.performance.update_lod.every_frame=Каждый кадр для всех моделей

# en: Unseen models 10 times a second (default)
mmdhl.performance.update_lod.unseen=Невидимые модели — 10 раз в секунду (по умолчанию)

# en: Also small on-screen models 20-30 times a second
mmdhl.performance.update_lod.small=Также мелкие модели на экране — 20–30 раз в секунду

# en: Default 1. Anything you can see, including its shadow, updates every frame; models drawn nowhere update 10 times a second. Setting 2 also slows small or distant models on screen, which can look stepped when they move.
mmdhl.performance.update_lod.tooltip=По умолчанию 1. Всё, что вы видите, включая тени, обновляется каждый кадр; модели, которые нигде не отрисовываются, — 10 раз в секунду. Вариант 2 также замедляет мелкие или далёкие модели на экране, из-за чего их движение может выглядеть рывками.

# en: Correct lighting on overlapping surfaces
mmdhl.performance.flashlight_fix.label=Исправлять освещение на перекрывающихся поверхностях

# en: Default on. Coincident surfaces receive one flashlight contribution; faces separated by animation remain visible.
mmdhl.performance.flashlight_fix.tooltip=По умолчанию включено. Совпадающие поверхности освещаются фонариком только один раз; грани, разделённые анимацией, остаются видимыми.

# en: Resting movement threshold
mmdhl.performance.sleep_linear.label=Порог движения в покое

# en: Default 0.5. Bodies below both speed thresholds can go to sleep.
mmdhl.performance.sleep_linear.tooltip=По умолчанию 0,5. Тела, скорость которых ниже обоих порогов, могут засыпать.

# en: Resting rotation threshold
mmdhl.performance.sleep_angular.label=Порог вращения в покое

# en: Default 0.35.
mmdhl.performance.sleep_angular.tooltip=По умолчанию 0,35.

# en: Time at rest before sleep (seconds)
mmdhl.performance.sleep_seconds.label=Время в покое до сна (секунды)

# en: Default 1.5.
mmdhl.performance.sleep_seconds.tooltip=По умолчанию 1,5.

# en: Movement needed to resume
mmdhl.performance.wake_drift.label=Движение для возобновления

# en: Default 0.02. Raising this permits more movement before a resting chain wakes.
mmdhl.performance.wake_drift.tooltip=По умолчанию 0,02. Чем больше значение, тем больше движения допускается, прежде чем покоящаяся цепочка проснётся.

# en: Diagnostics & recovery
mmdhl.debug.section=Диагностика и восстановление

# en: Show physics and performance overlay
mmdhl.debug.overlay=Показывать оверлей физики и быстродействия

# en: Print a performance summary every five seconds
mmdhl.debug.print=Выводить сводку быстродействия каждые пять секунд

# en: Write diagnostic report
mmdhl.debug.write_report=Записать диагностический отчёт

# en: Reset physics for all models
mmdhl.physics.reset_all=Сбросить физику всех моделей

# en: Clean up local ragdolls
mmdhl.physics.cleanup_ragdolls=Очистить локальные рэгдоллы

# en: Local ragdolls pause secondary physics while all Source bodies sleep, and resume when a body wakes. Cleanup affects only this client’s character model ragdolls.
mmdhl.physics.cleanup_help=Локальные рэгдоллы приостанавливают вторичную физику, пока все тела Source спят, и возобновляют её, когда какое-либо тело просыпается. Очистка затрагивает только рэгдоллы моделей персонажей этого клиента.

# en: Toggle physics on / off
mmdhl.physics.toggle=Включить / выключить физику

# en: Toggle physics shortcut (unassigned; Escape clears)
mmdhl.physics.toggle_shortcut=Клавиша переключения физики (не назначена; Escape — сброс)

# en: Reset all physics shortcut (unassigned; F8 is reserved for recording)
mmdhl.physics.reset_shortcut=Клавиша сброса всей физики (не назначена; F8 занята под запись)

# en: Restore Recommended Settings
mmdhl.physics.restore_defaults=Восстановить рекомендуемые настройки

# en: Recommended: Multicore CPU Processor, collisions with the character and objects, adaptive quality and automatic CPU thread count.
mmdhl.physics.restore_help=Рекомендуется: «Многоядерный CPU-обработчик», столкновения с персонажем и объектами, адаптивное качество и автоматическое число потоков CPU.

