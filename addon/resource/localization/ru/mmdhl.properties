# en: The loaded module does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.
mmdhl.install.error.loaded_module_mismatch=Загруженный модуль не соответствует одобренной установке или ожидаемому физическому пути. Закройте Garry's Mod, переустановите полный пакет и перезапустите игру.

# en: The loaded runtime does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.
mmdhl.install.error.loaded_runtime_mismatch=Загруженная среда выполнения не соответствует одобренной установке или ожидаемому физическому пути. Закройте Garry's Mod, переустановите полный пакет и перезапустите игру.

# en: Worker self-test failed. Reinstall native binaries and dependencies.
mmdhl.install.error.worker_failed=Самопроверка рабочего процесса не пройдена. Переустановите нативные файлы и зависимости.

# en: Worker and runtime identities do not match the approved native release. Reinstall and restart.
mmdhl.install.error.worker_mismatch=Идентификаторы рабочего процесса и среды выполнения не соответствуют одобренному нативному выпуску. Переустановите пакет и перезапустите игру.

# en: Detailed collision is unavailable; simple hulls remain available.
mmdhl.install.error.coacd_failed=Детальная коллизия недоступна; простые оболочки по-прежнему доступны.

# en: Installation was checked. Fully restart Garry's Mod to load repaired native binaries.
mmdhl.install.error.restart_to_load=Установка проверена. Полностью перезапустите Garry's Mod, чтобы загрузить исправленные нативные файлы.

# en: Files for {feature} now pass validation. Fully restart Garry's Mod to enable the repaired component.
mmdhl.install.error.restart_to_enable=Файлы компонента {feature} теперь проходят проверку. Полностью перезапустите Garry's Mod, чтобы включить исправленный компонент.

# en: Native module could not load: {reason}. Check the Microsoft Visual C++ x64 Redistributable and reinstall the native package.
mmdhl.install.error.loader_failed=Не удалось загрузить нативный модуль: {reason}. Проверьте Microsoft Visual C++ x64 Redistributable и переустановите нативный пакет.

# en: This native release lacks installation verification. Install {recommended} and restart.
mmdhl.install.error.no_verification=В этом нативном выпуске нет проверки установки. Установите {recommended} и перезапустите игру.

# en: A required game library did not become available after map startup. Restart the game or check Workshop for a compatibility update.
mmdhl.install.error.game_not_ready=Необходимая библиотека игры так и не стала доступна после запуска карты. Перезапустите игру или проверьте, нет ли обновления совместимости в Мастерской.

# en: This Garry's Mod build has not been tested with this native release ({libraries} changed). Model Hotloader runs anyway; if something misbehaves, check Workshop and GitHub for an update.
mmdhl.install.warning.game_untested=Эта сборка Garry's Mod не проверялась с этим нативным выпуском (изменились {libraries}). Model Hotloader всё равно работает; если что-то пойдёт не так, проверьте обновления в Мастерской и на GitHub.

# ===== File access for other addons (file_access.lua) =====

# en: File access for other addons
mmdhl.file_access.feature=Доступ к файлам для других дополнений

# en: File access for other addons needs a newer Model Hotloader binary module (2.3.0 or later). Everything else keeps working.
mmdhl.file_access.needs_update=Для доступа к файлам из других дополнений нужен более новый бинарный модуль Model Hotloader (2.3.0 или новее). Всё остальное продолжает работать.

# en: Addons can ask to read your files only in single player and on servers you host. On other servers, scripts come from the server, so Model Hotloader refuses.
mmdhl.file_access.unavailable_remote=Дополнения могут просить доступ к вашим файлам только в одиночной игре и на серверах, которые вы запускаете сами. На других серверах скрипты приходят с сервера, поэтому Model Hotloader отказывает.

# en: File access for other addons needs Model Hotloader's server part, which did not load. Open the installation window for details.
mmdhl.file_access.unavailable_server_realm=Для доступа к файлам из других дополнений нужна серверная часть Model Hotloader, но она не загрузилась. Подробности — в окне установки.

# en: File access for other addons is turned off (Utilities → User → Character Models → File access for other addons…).
mmdhl.file_access.unavailable_disabled=Доступ к файлам для других дополнений выключен (Утилиты → Пользователь → Модели персонажей → Доступ к файлам для других дополнений…).

# en: The Model Hotloader worker (mmdhl_worker.exe) is missing. Reinstall the binary module.
mmdhl.file_access.unavailable_worker=Не найден рабочий процесс Model Hotloader (mmdhl_worker.exe). Переустановите бинарный модуль.

# en: {addon} asks to read a file. A Windows dialog opened behind the full-screen game: press Alt+Tab to answer it.
mmdhl.file_access.waiting_fullscreen={addon} просит прочитать файл. Окно Windows открылось за полноэкранной игрой: нажмите Alt+Tab, чтобы ответить.

# en: {addon} asks to read a file. Answer the Windows dialog; if you cannot see it, check the taskbar or press Alt+Tab.
mmdhl.file_access.waiting_windowed={addon} просит прочитать файл. Ответьте в окне Windows; если его не видно, проверьте панель задач или нажмите Alt+Tab.

# en: Confirm turning on file access in the Windows dialog. If you cannot see it, press Alt+Tab.
mmdhl.file_access.waiting_confirm=Подтвердите включение доступа к файлам в окне Windows. Если его не видно, нажмите Alt+Tab.

# en: Model Hotloader could not save your file access choice. It applies until the map changes.
mmdhl.file_access.not_saved=Model Hotloader не удалось сохранить ваш выбор доступа к файлам. Он действует до смены карты.

# en: The player did not allow it.
mmdhl.file_access.error.denied=Игрок не разрешил.

# en: The player refused this addon three times. It can ask again after the map changes.
mmdhl.file_access.error.auto_denied=Игрок трижды отказал этому дополнению. Оно сможет спросить снова после смены карты.

# en: Too many file requests were refused on this map. Addons can ask again after the map changes.
mmdhl.file_access.error.auto_denied_session=На этой карте отклонено слишком много запросов файлов. Дополнения смогут спросить снова после смены карты.

# en: Too many file requests are waiting. Try again in a moment.
mmdhl.file_access.error.busy=Слишком много запросов файлов ждут ответа. Повторите чуть позже.

# en: The file or folder does not exist.
mmdhl.file_access.error.not_found=Такого файла или папки нет.

# en: Files on other computers cannot be requested by path.
mmdhl.file_access.error.network=Файлы на других компьютерах нельзя запрашивать по пути.

# en: Files on network drives can only be chosen in the file picker.
mmdhl.file_access.error.remote_drive=Файлы на сетевых дисках можно выбрать только в окне выбора файлов.

# en: This is not a valid path. Use a full path that starts with a drive letter, without ".." parts or device names.
mmdhl.file_access.error.invalid_path=Недопустимый путь. Укажите полный путь, начинающийся с буквы диска, без частей «..» и имён устройств.

# en: Model Hotloader never lets addons read this location.
mmdhl.file_access.error.denied_location=Model Hotloader никогда не позволяет дополнениям читать это место.

# en: Links and junctions are not followed, and nothing outside what the player allowed can be read.
mmdhl.file_access.error.link=Ссылки и точки соединения не открываются, а за пределами разрешённого игроком ничего прочитать нельзя.

# en: Hidden and system files are read only when the addon asks for them.
mmdhl.file_access.error.hidden=Скрытые и системные файлы читаются, только если дополнение явно их запросит.

# en: The file is larger than the read limit. Read it in parts in binary mode.
mmdhl.file_access.error.too_large=Файл больше предела чтения. Читайте его частями в двоичном режиме.

# en: Files can be read up to 256 MiB from their start.
mmdhl.file_access.error.offset=Файлы можно читать только в пределах первых 256 МиБ.

# en: This is a folder, not a file.
mmdhl.file_access.error.not_a_file=Это папка, а не файл.

# en: This is a file, not a folder.
mmdhl.file_access.error.not_a_folder=Это файл, а не папка.

# en: This file is no longer available to the addon; it has to ask again.
mmdhl.file_access.error.released=Этот файл больше недоступен дополнению; ему нужно запросить его снова.

# en: Windows did not allow the file to be read.
mmdhl.file_access.error.unreadable=Windows не разрешила прочитать файл.

# en: The Windows dialog could not be shown.
mmdhl.file_access.error.dialog_failed=Не удалось показать окно Windows.

# en: The addon holds too many files; it has to release some first.
mmdhl.file_access.error.too_many_items=Дополнение держит слишком много файлов; сначала ему нужно освободить часть.

# en: Another addon's rule refused this request.
mmdhl.file_access.error.denied_by_hook=Правило другого дополнения отклонило этот запрос.

# en: The addon's request is invalid: {error}
mmdhl.file_access.error.invalid_options=Некорректный запрос дополнения: {error}

# en: File access failed: {error}
mmdhl.file_access.error.other=Ошибка доступа к файлу: {error}

# en: File access for other addons…
mmdhl.file_access.manage.button=Доступ к файлам для других дополнений…

# en: File access for other addons
mmdhl.file_access.manage.title=Доступ к файлам для других дополнений

# en: Other addons can ask to read files on your computer. Model Hotloader asks you in a Windows dialog first, and an addon reads only what you choose or allow. Whatever an addon reads, it can send to a server or a website.
mmdhl.file_access.manage.help=Другие дополнения могут просить доступ к файлам на вашем компьютере. Model Hotloader сначала спрашивает вас в окне Windows, и дополнение читает только то, что вы выбрали или разрешили. Всё прочитанное дополнение может отправить на сервер или сайт.

# en: Let addons ask to read files
mmdhl.file_access.manage.enabled=Разрешить дополнениям просить доступ к файлам

# en: Turning this off takes effect at once. Turning it on asks for confirmation in a Windows dialog.
mmdhl.file_access.manage.enabled_tip=Выключение действует сразу. Для включения нужно подтверждение в окне Windows.

# en: Remembered folders are kept by the name an addon's script reports. Another addon could use the same name, so revoke folders you no longer need.
mmdhl.file_access.manage.note=Запомненные папки хранятся по имени, которое сообщает скрипт дополнения. Другое дополнение может назваться так же, поэтому отзывайте папки, которые больше не нужны.

# en: Addon
mmdhl.file_access.manage.column_addon=Дополнение

# en: Folder
mmdhl.file_access.manage.column_folder=Папка

# en: Last used
mmdhl.file_access.manage.column_used=Последнее использование

# en: No folders are remembered. A folder appears here when you choose "Always allow this addon here" in a request.
mmdhl.file_access.manage.empty=Запомненных папок нет. Папка появится здесь, если в запросе выбрать «Всегда разрешать этому дополнению здесь».

# en: Revoke
mmdhl.file_access.manage.revoke=Отозвать

# en: Revoke all
mmdhl.file_access.manage.revoke_all=Отозвать все

# en: Forget every remembered folder? Addons will have to ask again.
mmdhl.file_access.manage.revoke_all_confirm=Забыть все запомненные папки? Дополнениям придётся спрашивать снова.

