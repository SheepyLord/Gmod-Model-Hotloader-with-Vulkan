mmdhl.library.cause.pmx_materials=Материалы модели не соответствуют её треугольникам.

# en: A value in the model is not a valid number.
mmdhl.library.cause.pmx_number=Значение в модели не является допустимым числом.

# en: An element of the model points to one that does not exist.
mmdhl.library.cause.pmx_reference=Элемент модели ссылается на несуществующий элемент.

