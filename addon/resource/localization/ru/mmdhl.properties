# en: Unverified native files are no longer accepted. Change or reload the map, or restart Garry's Mod.
mmdhl.install.unverified.revoked=Непроверенные нативные файлы больше не принимаются. Смените или перезагрузите карту либо перезапустите Garry's Mod.

