mmdhl.names.original=Исходное название: {name}

# en: Show this model's names in my language
mmdhl.names.import_translate=Показывать названия этой модели на моём языке

# en: The model's name and the names of its parts and expressions are sent to Google Translate. Translations appear when they arrive. Your choice is kept for the next import; switch translation off completely in Physics & Performance.
mmdhl.names.import_note=Название модели, а также названия её частей и выражений отправляются в Google Переводчик. Переводы появляются по мере получения. Ваш выбор сохраняется для следующего импорта; полностью отключить перевод можно в разделе «Физика и быстродействие».

# en: Model name translation
mmdhl.names.setting_title=Перевод названий моделей

# en: Translate names from models into my language
mmdhl.names.setting_label=Переводить названия из моделей на мой язык

# en: Model, part and expression names are sent to Google Translate and saved on this computer once translated. Off: names show as written in the model files and nothing is sent.
mmdhl.names.setting_tooltip=Названия моделей, частей и выражений отправляются в Google Переводчик, а переводы сохраняются на этом компьютере. Если выключено, названия показываются так, как записаны в файлах моделей, и ничего не отправляется.

# en: Translations appear when they arrive and never delay imports or spawning. Names of models imported with translation unticked are never sent.
mmdhl.names.setting_help=Переводы появляются по мере получения и никогда не задерживают импорт или появление моделей. Названия моделей, импортированных без перевода, никогда не отправляются.

# en: Google Translate is not answering right now. Names show as written in the model files; translation is retried later.
mmdhl.names.status_unavailable=Google Переводчик сейчас не отвечает. Названия показываются так, как записаны в файлах моделей; перевод будет повторён позже.

# en: Model Hotloader can show the names in your models (model, parts, expressions) in your language by sending them to Google Translate. Nothing is sent until you choose.
mmdhl.names.notice=Model Hotloader может показывать названия из ваших моделей (модели, частей, выражений) на вашем языке, отправляя их в Google Переводчик. Ничего не отправляется, пока вы не сделаете выбор.

# en: Translate names
mmdhl.names.notice_accept=Переводить названия

# en: Keep original names
mmdhl.names.notice_decline=Оставить исходные названия
