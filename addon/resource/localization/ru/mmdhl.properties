# en: It starts at the elbow and moves the forearm. Often named: {examples}.
mmdhl.bonemap.help.forearm=Начинается в локте и двигает предплечье. Частые имена: {examples}.

# en: It starts at the wrist and moves the hand. Often named: {examples}.
