# en: {part} (“{bone}”) hangs from the upper body. Legs must hang from the hips.
mmdhl.bonemap.issue.leg_on_spine=Часть «{part}» («{bone}») подвешена к верхней части тела. Ноги должны быть подвешены к бёдрам.

