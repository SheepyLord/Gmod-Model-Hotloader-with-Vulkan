# en: A server administrator can run mmdhl_accept_unverified_native in the server console and then change the map to use the server's unverified native files anyway.
mmdhl.install.unverified.server_admin=Администратор сервера может выполнить mmdhl_accept_unverified_native в консоли сервера и сменить карту, чтобы всё равно использовать непроверенные нативные файлы сервера.

