# Model Hotloader: ru translation.
# Each phrase follows the English it translates (# en:). An empty value keeps the English.
# Keep every {placeholder} unchanged; see docs/TRANSLATING.md.
#
# Glossary (English → Russian)
# Register: formal «вы» (lowercase); quotes « » (nested „ “); dash — with spaces; buttons use the infinitive (Создать, Удалить, Сохранить); counts as «Перемещено элементов: {count}» or «({count} шт.)»
# External Models (spawn menu tab, library window title) — Внешние модели
# Character Models (library tab, Utilities page) — Модели персонажей
# Static Props (library tab, Utilities page) — Статичные объекты
# In this map (library tab) — На карте
# Physics & Performance (library tab and heading) — Физика и быстродействие
# Import Character Models / Import Static Props — Импортировать персонажей / Импортировать объекты
# Spawn Ragdoll — Создать рэгдолл
# Spawn Friendly NPC / Spawn Hostile NPC — Создать союзного НИПа / Создать враждебного НИПа
# Use as Player Model — Сделать моделью игрока
# Spawn Prop — Создать объект
# Place with tool gun — Разместить инструментом-пушкой
# Edit parts… — Изменить части… (window: Изменение частей)
# Edit bodygroups… — Группы тела… (button; opens the «Группы тела» window)
# Apply size to aimed prop — Применить размер к объекту в прицеле
# Import options / Import scale — Параметры импорта / Масштаб импорта
# Import as character (failure dialog button, 170 px) — Импорт как персонажа
# Reimport — повторный импорт; импортировать заново
# Unfiled — Без папки
# Favorite / Unfavorite — В избранное / Убрать из избранного
# World only (collision mode) — Только с миром (modes complete «Сталкивается с…»)
# Static Prop tool — инструмент «Статичный объект»
# Multicore CPU Processor — Многоядерный CPU-обработчик (physics processor = обработчик физики)
# Lightweight jiggle / Full simulation — лёгкое покачивание / полная симуляция
# as authored (by the model author) — как у автора
# character / character model — персонаж / модель персонажа
# static prop — статичный объект
# prop — объект (game term)
# ragdoll — рэгдолл (game term)
# posable ragdoll — рэгдолл для позинга (game category «Позинг»)
# NPC — НИП, мн. НИПы (game term)
# player model — модель игрока (game term)
# bodygroup — группа тела (game term «Группы тела»)
# preset — предустановка (game term)
# collision shape / hull / fitting — коллизия, форма коллизии / оболочка / подгонка
# collides with, collision mode — сталкивается с, режим столкновений (game: столкновения)
# spring bones — пружинные кости (VRM)
# physics body — физическое тело
# joint — сочленение
# secondary physics (hair and clothing) — вторичная физика
# jiggle — покачивание
# expression / morph — выражение / морф
# flex — флекс
# bone / skeleton — кость / скелет
# folder / library — папка / библиотека
# import — импорт, импортировать
# share with the server — передать на сервер (shared prop — объект с сервера)
# publish (a model) — опубликовать
# approve — одобрить (server-approved — одобренный сервером)
# spawn — создать (game: меню создания)
# place / placement — разместить / размещение
# attach / detach — прикрепить / открепить
# freeze / unfreeze — заморозить / разморозить
# remove (from the map or a list) / delete (files) — убрать / удалить (library folders: удалить)
# copy (button) — копировать
# mesh / triangles / vertices — меш / треугольники (column: Треуг.) / вершины
# units (Source) — единицы Source; after numbers «ед.»
# worker (background import process) — рабочий процесс
# native module / package / release — нативный модуль / пакет / выпуск
# first-person arms — руки от первого лица
# Physics Gun — физпушка (game: Физпушка)
# Tool Gun — инструмент-пушка (game)
# Face Poser / Finger Poser / Eye Poser — Позер лица / Позер пальцев / Позер глаз (game)
# spawn menu / context menu — меню создания / контекстное меню (game)
# Utilities / Undo / Cleanup — Утилиты / Отмена / Очистка (game)
# Tools → Construction — Инструменты → Строительство (game)
# constraint / Weld / NoCollide — крепление / Сварка / Выключение столкновений (game)
# entity — энтити (game); «объект» in running text
# duplication — дубликат (game)
# gamemode — режим игры (game)
# Workshop / Options / Weapons / Addon — Мастерская / Настройки / Оружие / дополнение (game)
# Citizen / Combine (NPC types) — гражданин / Альянс (game)
# multiplayer / single-player — сетевая игра / одиночная игра (game)
# left click / right click / reload — ЛКМ / ПКМ / перезарядка

