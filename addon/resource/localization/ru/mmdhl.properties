# en: Import it under Static Props instead. Characters must be PMX, PMD or VRM files.
mmdhl.library.hint.static_file=Импортируйте его на вкладке «Статичные объекты». Персонажи должны быть файлами PMX, PMD или VRM.

# en: The VRM humanoid is incomplete. Export it again from VRoid Studio, UniVRM or the Blender VRM add-on with every required humanoid bone assigned.
mmdhl.library.hint.vrm_humanoid=Гуманоид VRM неполон. Экспортируйте модель заново из VRoid Studio, UniVRM или дополнения VRM для Blender, назначив все обязательные гуманоидные кости.

# en: The VRM file refers to data stored beside it. Export it again as one self-contained .vrm file.
mmdhl.library.hint.vrm_external_buffer=Файл VRM ссылается на данные, хранящиеся рядом с ним. Экспортируйте его заново как один самодостаточный файл .vrm.

# en: The VRM file is damaged or incomplete. Export it again from the original program and retry.
mmdhl.library.hint.vrm_damaged=Файл VRM повреждён или неполон. Экспортируйте его заново из исходной программы и повторите попытку.

# en: The file could not be read. Check that it still exists, is not open in another program, and that its folder is accessible.
mmdhl.library.hint.cannot_open=Не удалось прочитать файл. Убедитесь, что он всё ещё существует, не открыт в другой программе, а его папка доступна.

# en: The file could not be parsed. Re-export it from its original program (GLB or FBX work best) and import again.
mmdhl.library.hint.parser=Не удалось разобрать файл. Экспортируйте его заново из исходной программы (лучше всего подходят GLB и FBX) и импортируйте снова.

# en: This is not a readable .blend file. Save it again in Blender, or export it as GLB or FBX.
mmdhl.library.hint.not_blend=Это не читаемый файл .blend. Сохраните его заново в Blender или экспортируйте в GLB или FBX.

# en: The file contains no mesh triangles; it may hold only an armature, cameras, lights, curves or text. In Blender, convert them with Object > Convert > Mesh.
mmdhl.library.hint.no_triangles=В файле нет треугольников меша; возможно, в нём только арматура, камеры, источники света, кривые или текст. Преобразуйте их в Blender через Object > Convert > Mesh.

# en: The objects chosen at import were renamed or removed in Blender. Import the file again to choose objects.
mmdhl.library.hint.blend_objects_changed=Объекты, выбранные при импорте, были переименованы или удалены в Blender. Импортируйте файл заново, чтобы выбрать объекты.

# en: The compressed .blend file is damaged or incomplete. Save it again in Blender (File > Save) and retry.
mmdhl.library.hint.blend_compressed=Сжатый файл .blend повреждён или неполон. Сохраните его заново в Blender (File > Save) и повторите попытку.

# en: The file is incomplete, possibly still being written or copied. Save it again and retry.
mmdhl.library.hint.truncated=Файл неполон — возможно, он ещё записывается или копируется. Сохраните его заново и повторите попытку.

# en: This .blend file uses data the importer cannot read. Open it in Blender and export the model as GLB or FBX.
mmdhl.library.hint.blend_unsupported=Этот файл .blend содержит данные, которые импортёр не может прочитать. Откройте его в Blender и экспортируйте модель в GLB или FBX.

# en: The model has too many materials (limit 128). Merge materials in the original program before importing.
mmdhl.library.hint.material_limit=У модели слишком много материалов (максимум 128). Объедините материалы в исходной программе перед импортом.

# en: The file or its textures exceed the 256 MB limit. Reduce texture sizes or split the model.
mmdhl.library.hint.byte_limit=Файл или его текстуры превышают ограничение в 256 MB. Уменьшите размер текстур или разделите модель.

# en: The geometry is too large for one prop. Split the model or decimate it.
mmdhl.library.hint.geometry_budget=Геометрия слишком велика для одного объекта. Разделите модель или упростите её.

# en: The PMX file is damaged or uses an unsupported version. PMX 2.0 and 2.1 are supported.
mmdhl.library.hint.pmx=Файл PMX повреждён или использует неподдерживаемую версию. Поддерживаются PMX 2.0 и 2.1.

# en: The model is extremely small. Raise Import scale in Import options, then retry.
mmdhl.library.hint.too_small=Модель очень маленькая. Увеличьте «Масштаб импорта» в разделе «Параметры импорта» и повторите попытку.

# en: The model is extremely large. Lower Import scale in Import options, then retry.
mmdhl.library.hint.too_large=Модель очень большая. Уменьшите «Масштаб импорта» в разделе «Параметры импорта» и повторите попытку.

# en: The model sits very far from its origin. Move it to the origin in its original program.
mmdhl.library.hint.recenter=Модель расположена очень далеко от начала координат. Переместите её к началу координат в исходной программе.

# en: The importer stopped unexpectedly. The file may be damaged or use unsupported features.
mmdhl.library.hint.importer_exited=Импортёр неожиданно остановился. Возможно, файл повреждён или использует неподдерживаемые возможности.

# en: The import took longer than five minutes. Use the fast collision option or a smaller model.
mmdhl.library.hint.timeout=Импорт длился дольше пяти минут. Выберите быструю коллизию или модель поменьше.

# en: This file type is not supported here. Static props accept OBJ, FBX, GLB, GLTF, PMX and BLEND; PMD characters belong in Character Models.
mmdhl.library.hint.unsupported_type=Этот тип файла здесь не поддерживается. Статичные объекты принимают OBJ, FBX, GLB, GLTF, PMX и BLEND; персонажей PMD импортируйте на вкладке «Модели персонажей».

# en: The skeleton could not be read. The model may be damaged; try re-saving it in PMX Editor.
mmdhl.library.hint.skeleton=Не удалось прочитать скелет. Возможно, модель повреждена; попробуйте пересохранить её в PMX Editor.

# en: Check the file in its original program, export it again and retry. Copy the details below when reporting the problem.
mmdhl.library.hint.default=Проверьте файл в исходной программе, экспортируйте его заново и повторите попытку. Сообщая о проблеме, скопируйте сведения ниже.

# en: The spring-bone settings (swinging hair and clothes) are out of range or incomplete. Check them in the program that exported the VRM, then export it again.
mmdhl.library.hint.vrm_spring=Настройки пружинных костей (качающиеся волосы и одежда) выходят за допустимые пределы или неполны. Проверьте их в программе, экспортировавшей VRM, и экспортируйте его заново.

# en: The importer program (mmdhl_worker.exe) is missing. Install the native files of Model Hotloader again; the installation window lists what is missing.
mmdhl.library.hint.worker_missing=Не найдена программа импорта (mmdhl_worker.exe). Переустановите нативные файлы Model Hotloader; окно установки показывает, чего не хватает.

# en: Windows did not start the importer (mmdhl_worker.exe). Antivirus software may be blocking it: allow it, or install the native files again, then retry.
mmdhl.library.hint.worker_start=Windows не запустила импортёр (mmdhl_worker.exe). Возможно, его блокирует антивирус: разрешите его или переустановите нативные файлы, затем повторите попытку.

# en: The file is incomplete: it was probably cut off while downloading, copying or extracting. Download or extract the model again and import the new copy.
mmdhl.library.hint.pmx_truncated=Файл неполон: вероятно, он оборвался при скачивании, копировании или распаковке. Скачайте или распакуйте модель заново и импортируйте новую копию.

# en: Part of the file is damaged (see Where). Open the model in PMX Editor and save it again; if PMX Editor cannot open it either, download the model again.
mmdhl.library.hint.pmx_damaged=Часть файла повреждена (см. «Где»). Откройте модель в PMX Editor и пересохраните её; если PMX Editor тоже не может её открыть, скачайте модель заново.

# en: Open the model in PMX Editor and save it as PMX 2.0 or 2.1, then import it again.
mmdhl.library.hint.pmx_version=Откройте модель в PMX Editor, сохраните её как PMX 2.0 или 2.1 и импортируйте заново.

# en: The materials do not match the model's triangles. In PMX Editor, check the material named under Where (or delete it), save and import again.
mmdhl.library.hint.pmx_materials=Материалы не соответствуют треугольникам модели. В PMX Editor проверьте материал, указанный в строке «Где» (или удалите его), сохраните и импортируйте заново.

# en: A value in the model is not a valid number. In PMX Editor, correct the value named under Where (or delete that element), save and import again.
mmdhl.library.hint.pmx_number=Значение в модели не является допустимым числом. Исправьте в PMX Editor значение, указанное в строке «Где» (или удалите этот элемент), сохраните и импортируйте заново.

# en: An element of the model points to one that does not exist. In PMX Editor, fix or delete the element named under Where, save and import again.
mmdhl.library.hint.pmx_reference=Элемент модели ссылается на несуществующий элемент. Исправьте или удалите в PMX Editor элемент, указанный в строке «Где», сохраните и импортируйте заново.

# en: Extract the archive first (right-click › Extract All, or 7-Zip for RAR and 7z files), then import the .pmx, .pmd or .vrm file inside it.
mmdhl.library.hint.format_archive=Сначала распакуйте архив (правой кнопкой › «Извлечь всё» или 7-Zip для RAR и 7z), затем импортируйте находящийся в нём файл .pmx, .pmd или .vrm.

# en: Choose the character's model file (.pmx or .pmd) instead. Motion and pose files cannot be imported.
mmdhl.library.hint.format_motion=Выберите вместо него файл модели персонажа (.pmx или .pmd). Файлы движений и поз импортировать нельзя.

# en: Choose the model file (.pmx, .pmd or .vrm) instead. Its textures are loaded with it.
mmdhl.library.hint.format_image=Выберите вместо него файл модели (.pmx, .pmd или .vrm). Его текстуры загрузятся вместе с ним.

# en: Rename the file so that it ends in {extension}, then import it again.
mmdhl.library.hint.format_renamed=Переименуйте файл так, чтобы он заканчивался на {extension}, и импортируйте его заново.

# en: Make sure you chose the model file itself (.pmx, .pmd, .vrm, .fbx, .glb or .dae), not a readme, an image or an archive.
mmdhl.library.hint.format_unknown=Убедитесь, что выбран сам файл модели (.pmx, .pmd, .vrm, .fbx, .glb или .dae), а не readme, изображение или архив.

# en: The file was moved, renamed or deleted after it was chosen. Choose it again where it is now.
mmdhl.library.hint.io_missing=Файл перемещён, переименован или удалён после выбора. Выберите его заново там, где он находится сейчас.

# en: Close programs that may have the file open (PMX Editor, an archive tool, cloud sync), then retry.
mmdhl.library.hint.io_locked=Закройте программы, которые могут держать файл открытым (PMX Editor, архиватор, облачная синхронизация), и повторите попытку.

# en: Windows denied access. Move the model to a normal folder such as Documents, or allow Garry's Mod in your antivirus software, then retry.
mmdhl.library.hint.io_denied=Windows запретила доступ. Переместите модель в обычную папку, например «Документы», или разрешите Garry's Mod в антивирусе, затем повторите попытку.

# en: The drive reported an error or was disconnected. Copy the model to your own drive and import that copy.
mmdhl.library.hint.io_device=Диск сообщил об ошибке или был отключён. Скопируйте модель на свой диск и импортируйте копию.

# en: The file is empty. Wait until its download or sync has finished, or copy it again from the original.
mmdhl.library.hint.io_empty=Файл пуст. Дождитесь окончания скачивания или синхронизации либо скопируйте его заново из оригинала.

# en: The cache could not be written. Check free disk space, and that garrysmod/data/mmd_hotloader is not read-only or blocked by antivirus software.
mmdhl.library.hint.io_write=Не удалось записать кэш. Проверьте свободное место на диске и что папка garrysmod/data/mmd_hotloader не доступна только для чтения и не заблокирована антивирусом.

# en: Free some space on the drive that holds Garry's Mod, then retry.
mmdhl.library.hint.io_disk_full=Освободите место на диске, где установлен Garry's Mod, и повторите попытку.

# en: Close other programs and retry. Very large models or textures need more memory; smaller textures help.
mmdhl.library.hint.memory=Закройте другие программы и повторите попытку. Очень большим моделям и текстурам нужно больше памяти; уменьшение текстур помогает.

# en: The importer crashed on this file. It may be damaged or use something the importer cannot read: save it again in its original program and retry. Please copy the details below when reporting the problem.
mmdhl.library.hint.worker_crash=Импортёр аварийно завершился на этом файле. Возможно, файл повреждён или содержит то, что импортёр не умеет читать: пересохраните его в исходной программе и повторите попытку. Сообщая о проблеме, скопируйте сведения ниже.

# en: The file picker closed unexpectedly. Programs that add to Windows file dialogs (archive tools, cloud storage) can cause this. Try again, or choose the file from another folder.
mmdhl.library.hint.picker_crash=Окно выбора файла неожиданно закрылось. Причиной могут быть программы, встраивающиеся в диалоги файлов Windows (архиваторы, облачные хранилища). Повторите попытку или выберите файл из другой папки.

# en: A texture file in the importer's cache is damaged or cannot be used. Delete the file shown under Where, then import the model again. If it happens again, save the model's textures again as PNG files in an image editor.
mmdhl.library.hint.texture_derivative=Файл текстуры в кэше импортёра повреждён или непригоден. Удалите файл, указанный в строке «Где», и импортируйте модель заново. Если ошибка повторится, пересохраните текстуры модели в формате PNG в графическом редакторе.

