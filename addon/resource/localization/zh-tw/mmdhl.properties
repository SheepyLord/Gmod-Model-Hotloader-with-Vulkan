mmdhl.install.button.dismiss_tip=在問題變更之前隱藏此警告。安裝視窗中仍會列出這些問題。

# en: Use anyway…
mmdhl.install.button.use_anyway=仍然使用…

# en: Stop using unverified files
mmdhl.install.button.stop_using=停止使用未驗證檔案

# en: Native release: {version}
mmdhl.install.native_release=原生版本：{version}

# en: Recommended: {version}
mmdhl.install.recommended_release=建議版本：{version}

# en: not verified
mmdhl.install.not_verified=未驗證

