mmdhl.install.unknown_version=未知

# en: Renderer: DXVK (Vulkan)
mmdhl.install.renderer.dxvk=渲染器：DXVK（Vulkan）

# en: Renderer: DXVK (Vulkan) from {release}
mmdhl.install.renderer.dxvk_release=渲染器：DXVK（Vulkan，來自 {release}）

# en: Renderer: Direct3D 9
mmdhl.install.renderer.d3d9=渲染器：Direct3D 9

# en: Renderer: other d3d9.dll
mmdhl.install.renderer.other=渲染器：其他 d3d9.dll

# en: Native installation verified.
mmdhl.install.verified=原生安裝已通過驗證。

# en: Native runtime
mmdhl.install.feature.core=原生執行環境

# en: Model import
mmdhl.install.feature.imports=模型匯入

# en: Detailed prop collision
mmdhl.install.feature.detailed_collision=精細道具碰撞

# en: Model rendering
mmdhl.install.feature.rendering=模型繪製

# en: Native character physics
mmdhl.install.feature.physics=原生角色物理

# en: Installation
mmdhl.install.feature.installation=安裝

# en: {feature}: {message}
mmdhl.install.issue={feature}：{message}

# en: {feature}: {message} Simple hull collision remains available.
mmdhl.install.issue_hull_fallback={feature}：{message}仍可使用簡易凸包碰撞。

# en: Server: {issue} The server administrator must resolve this.
mmdhl.install.server_issue=伺服器：{issue}必須由伺服器管理員解決此問題。

# en: Model Hotloader needs attention.\nOpen External Models for installation details.\nClick here to view the warning.
mmdhl.install.notice=Model Hotloader 需要您注意。\n請開啟「外部模型」查看安裝詳細資訊。\n按一下這裡查看警告。

# en: The binary module required for this addon is not installed, broken or modified. Please download the most recent version using the buttons below.
mmdhl.install.binary_problem=此附加元件所需的二進位模組未安裝、已損毀或已被修改。請使用下方按鈕下載最新版本。

# en: Model Hotloader: its binary module is not installed, broken or modified.\nClick here to download the most recent version.
mmdhl.install.notice_binary=Model Hotloader：二進位模組未安裝、已損毀或已被修改。\n點擊此處下載最新版本。

# en: (warning accepted)
mmdhl.install.accepted_tag=（已接受警告）

# en: Running unverified native files because you accepted the warning. Install the recommended release to remove this warning.
mmdhl.install.unverified.in_use=你已接受警告，正在使用未驗證的原生檔案。安裝建議的版本即可移除此警告。

# en: A server administrator can run mmdhl_accept_unverified_native in the server console and then change the map to use the server's unverified native files anyway.
mmdhl.install.unverified.server_admin=伺服器管理員可以在伺服器主控台執行 mmdhl_accept_unverified_native 並更換地圖，以繼續使用伺服器上未驗證的原生檔案。

# en: Use unverified native files?
mmdhl.install.unverified.title=使用未驗證的原生檔案？

# en: The installed native files do not match a release approved for this version of the addon. They may belong to another version, be damaged, or have been modified.\n\nUsing them anyway can crash Garry's Mod, damage saves or make the addon behave unpredictably. Continue only if you trust where these files came from.\n\nYour choice covers only these exact files: if any of them changes, you will be asked again.
mmdhl.install.unverified.warning=已安裝的原生檔案與此版本附加元件核准的發行版本不符。它們可能來自其他版本、已損毀或遭到修改。\n\n仍然使用可能導致 Garry's Mod 當機、存檔損毀或附加元件行為異常。只有在你信任這些檔案的來源時才繼續。\n\n此選擇只適用於目前這些檔案：任何檔案變更時都會再次詢問。

# en: Use anyway
mmdhl.install.unverified.confirm=仍然使用

# en: Unverified native files accepted. Change or reload the map, or restart Garry's Mod, to start using them.
mmdhl.install.unverified.accepted=已接受未驗證的原生檔案。更換或重新載入地圖，或重新啟動 Garry's Mod 後即可開始使用。

# en: Unverified native files are no longer accepted. Change or reload the map, or restart Garry's Mod.
mmdhl.install.unverified.revoked=已不再接受未驗證的原生檔案。請更換或重新載入地圖，或重新啟動 Garry's Mod。

# en: There are no unverified native files that accepting would allow.
mmdhl.install.unverified.nothing=沒有可透過接受而啟用的未驗證原生檔案。

# ===== Installation checks (installation.lua) =====

# en: This addon requires Windows x64 Garry's Mod. Select the x86-64 game branch or launch 64 bit version of the game.
mmdhl.install.error.unsupported_platform=此附加元件需要 Windows x64 版的 Garry's Mod。請選擇 x86-64 遊戲分支，或啟動 64 位元版本的遊戲。

# en: The Workshop native release policy is missing or invalid. Update the Workshop addon.
mmdhl.install.error.policy_invalid=工作坊的原生版本政策遺失或無效。請更新工作坊附加元件。

# en: Installed native release {installed} is no longer approved. Install {recommended} and restart.
mmdhl.install.error.release_not_approved=已安裝的原生版本 {installed} 已不再獲得核准。請安裝 {recommended} 並重新啟動。

# en: Missing {path}. Reinstall the native package and restart.
mmdhl.install.error.file_missing=缺少 {path}。請重新安裝原生套件並重新啟動。

# en: Cannot read {path}. Reinstall the native package and restart.
mmdhl.install.error.file_unreadable=無法讀取 {path}。請重新安裝原生套件並重新啟動。

