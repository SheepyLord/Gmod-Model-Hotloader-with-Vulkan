# Model Hotloader: zh-tw translation.
# Each phrase follows the English it translates (# en:). An empty value keeps the English.
# Keep every {placeholder} unchanged; see docs/TRANSLATING.md.
#
# Glossary (English → 繁體中文（台灣）)
# Conventions — 用「您」；全形標點 ，。：；！？（）；引號用「」；省略號用「…」；中文與英數字、{placeholder} 之間加半形空格
# External Models — 外部模型 (物件清單分頁、收藏庫視窗標題、NPC／玩家模型類別)
# Character Models (tab) — 角色模型
# Static Props (tab) — 靜態道具
# In this map (tab) — 此地圖中
# Physics & Performance (tab) — 物理與效能
# Import Character Models / Import Static Props — 匯入角色模型／匯入靜態道具
# Spawn Ragdoll — 生成布偶
# Spawn Friendly NPC / Spawn Hostile NPC — 生成友善 NPC／生成敵對 NPC
# Use as Player Model — 設為玩家模型
# Spawn Prop — 生成道具
# Place with tool gun — 用工具槍放置
# Edit parts… — 編輯部件…
# Edit bodygroups… — 編輯身體區塊…
# Apply size to aimed prop — 套用大小至瞄準的道具
# Import options / Import scale / Reimport — 匯入選項／匯入比例／重新匯入
# Import as character — 以角色匯入
# Unfiled — 未分類
# World only (collision mode) — 僅限地圖 (world = 地圖；objects = 物件)
# Multicore CPU Processor — 多核心 CPU 處理器
# Lightweight jiggle / Full simulation — 輕量晃動／完整模擬
# Static Prop tool — 靜態道具工具
# character (model) — 角色（模型）
# static prop — 靜態道具
# prop — 道具 (遊戲用語)
# ragdoll — 布偶 (遊戲用語)
# NPC — NPC (遊戲用語)
# player model — 玩家模型 (遊戲用語)
# bodygroup — 身體區塊 (遊戲用語)
# preset — 配置 (避免與「預設」= default 混淆)
# default — 預設
# collision (shape) — 碰撞（形狀）
# collision hull / hull — 碰撞凸包／凸包
# spring bones — 彈簧骨骼 (VRM)
# physics body — 物理剛體
# joint — 關節
# secondary physics — 次級物理 (頭髮與衣物的物理)
# jiggle — 晃動
# expression / morph — 表情
# flex — 表情控制器 (遊戲用語)
# bone / skeleton / armature — 骨骼／骨架／骨架
# material / texture — 材質／貼圖
# mesh / vertices / triangles — 網格／頂點／三角面
# folder — 資料夾
# library — 收藏庫 (同 Steam 用語)
# import / export — 匯入／匯出
# share (with the server) — 分享（至伺服器）
# publish — 發布
# approve / approved — 核准／已核准
# licence / redistribution — 授權／再散布
# VRM avatar — VRM 虛擬角色
# first-person arms — 第一人稱手臂
# freeze / unfreeze — 凍結／解凍 (遊戲用語)
# attach / detach — 附加／分離
# constraint — 連接 (遊戲用語)
# entity — 實體 (遊戲用語)
# native package / native runtime — 原生套件／原生執行環境
# worker (background importer) — 背景匯入程式 (物理 worker threads = 工作執行緒)
# CPU threads — CPU 執行緒
# iterations — 迭代次數
# performance / quality — 效能／品質
# diagnostics — 診斷
# units (Source distance units) — 單位
# frame — 幀
# administrator — 管理員 (遊戲用語)
# server — 伺服器 (遊戲用語)
# console — 控制台 (遊戲用語)
# Physics Gun / Tool Gun — 物理槍／工具槍 (遊戲用語)
# Face Poser / Finger Poser / Eye Poser — 表情調整器／手指調整器／眼睛調整器 (遊戲用語)
# spawn menu / context menu — 物件清單／環境選單 (遊戲用語)
# Utilities / Undo / Cleanup — 設定／復原／清除 (遊戲用語：物件清單的「設定」分頁)
# User (Utilities category) — 使用者 (遊戲用語)
# Tools / Construction / Posing — 工具／建造／造型 (遊戲用語)
# Weld / NoCollide — 焊接／無碰撞 (遊戲用語)
# duplication — 副本 (遊戲用語)
# Weapons — 武器 (遊戲用語)
# Citizen / Combine — 市民／聯邦士兵 (遊戲用語)
# Workshop — 工作坊 (遊戲用語)
# spawn — 生成
# refresh — 重新整理 (遊戲用語)

