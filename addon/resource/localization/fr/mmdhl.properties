mmdhl.ui.toolmenu.backend=Processeur physique

# en: Multicore CPU Processor is recommended. GPU processing is experimental and may be slower.
mmdhl.ui.toolmenu.backend_help=« Processeur CPU multicœur » est recommandé. Le traitement GPU est expérimental et peut être plus lent.

# en: Performance / physics overlay
mmdhl.ui.toolmenu.debug_overlay=Incrustation performances / physique

