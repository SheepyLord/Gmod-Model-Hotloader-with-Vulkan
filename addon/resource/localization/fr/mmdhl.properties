# ===== Importing: what to try after a failure (library.lua) =====

# en: Choose Import as character below: VRM avatars become posable ragdolls with their spring-bone physics.
mmdhl.library.hint.vrm_avatar=Choisissez « Importer comme personnage » ci-dessous : les avatars VRM deviennent des corps articulés avec la physique de leurs os à ressort.

# en: Import it under Static Props instead. Characters must be PMX, PMD or VRM files.
mmdhl.library.hint.static_file=Importez-le plutôt dans « Objets statiques ». Les personnages doivent être des fichiers PMX, PMD ou VRM.

# en: The VRM humanoid is incomplete. Export it again from VRoid Studio, UniVRM or the Blender VRM add-on with every required humanoid bone assigned.
mmdhl.library.hint.vrm_humanoid=L'humanoïde VRM est incomplet. Exportez-le à nouveau depuis VRoid Studio, UniVRM ou l'add-on VRM de Blender en assignant chaque os humanoïde requis.

# en: The VRM file refers to data stored beside it. Export it again as one self-contained .vrm file.
mmdhl.library.hint.vrm_external_buffer=Le fichier VRM fait référence à des données stockées à côté de lui. Exportez-le à nouveau en un seul fichier .vrm autonome.

# en: The VRM file is damaged or incomplete. Export it again from the original program and retry.
mmdhl.library.hint.vrm_damaged=Le fichier VRM est endommagé ou incomplet. Exportez-le à nouveau depuis le programme d'origine, puis réessayez.

# en: The file could not be read. Check that it still exists, is not open in another program, and that its folder is accessible.
mmdhl.library.hint.cannot_open=Le fichier n'a pas pu être lu. Vérifiez qu'il existe toujours, qu'il n'est pas ouvert dans un autre programme et que son dossier est accessible.

# en: The file could not be parsed. Re-export it from its original program (GLB or FBX work best) and import again.
mmdhl.library.hint.parser=Le fichier n'a pas pu être analysé. Exportez-le à nouveau depuis son programme d'origine (GLB ou FBX fonctionnent le mieux), puis importez-le de nouveau.

# en: This is not a readable .blend file. Save it again in Blender, or export it as GLB or FBX.
mmdhl.library.hint.not_blend=Ce fichier .blend est illisible. Enregistrez-le à nouveau dans Blender ou exportez-le en GLB ou FBX.

# en: The file contains no mesh triangles; it may hold only an armature, cameras, lights, curves or text. In Blender, convert them with Object > Convert > Mesh.
mmdhl.library.hint.no_triangles=Le fichier ne contient aucun triangle de maillage ; il ne contient peut-être qu'une armature, des caméras, des lumières, des courbes ou du texte. Dans Blender, convertissez-les avec Objet > Convertir > Maillage (Object > Convert > Mesh).

# en: The objects chosen at import were renamed or removed in Blender. Import the file again to choose objects.
mmdhl.library.hint.blend_objects_changed=Les objets choisis lors de l'importation ont été renommés ou supprimés dans Blender. Importez à nouveau le fichier pour choisir les objets.

# en: The compressed .blend file is damaged or incomplete. Save it again in Blender (File > Save) and retry.
mmdhl.library.hint.blend_compressed=Le fichier .blend compressé est endommagé ou incomplet. Enregistrez-le à nouveau dans Blender (Fichier > Enregistrer / File > Save), puis réessayez.

# en: The file is incomplete, possibly still being written or copied. Save it again and retry.
mmdhl.library.hint.truncated=Le fichier est incomplet, peut-être encore en cours d'écriture ou de copie. Enregistrez-le à nouveau, puis réessayez.

# en: This .blend file uses data the importer cannot read. Open it in Blender and export the model as GLB or FBX.
mmdhl.library.hint.blend_unsupported=Ce fichier .blend utilise des données que l'importateur ne sait pas lire. Ouvrez-le dans Blender et exportez le modèle en GLB ou FBX.

# en: The model has too many materials (limit 128). Merge materials in the original program before importing.
mmdhl.library.hint.material_limit=Le modèle a trop de matériaux (limite : 128). Fusionnez des matériaux dans le programme d'origine avant l'importation.

# en: The file or its textures exceed the 256 MB limit. Reduce texture sizes or split the model.
mmdhl.library.hint.byte_limit=Le fichier ou ses textures dépassent la limite de 256 MB. Réduisez la taille des textures ou divisez le modèle.

# en: The geometry is too large for one prop. Split the model or decimate it.
mmdhl.library.hint.geometry_budget=La géométrie est trop volumineuse pour un seul objet. Divisez le modèle ou décimez-le.

# en: The PMX file is damaged or uses an unsupported version. PMX 2.0 and 2.1 are supported.
mmdhl.library.hint.pmx=Le fichier PMX est endommagé ou utilise une version non prise en charge. Les versions PMX 2.0 et 2.1 sont prises en charge.

# en: The model is extremely small. Raise Import scale in Import options, then retry.
mmdhl.library.hint.too_small=Le modèle est extrêmement petit. Augmentez le réglage « Échelle d'importation » dans « Options d'importation », puis réessayez.

# en: The model is extremely large. Lower Import scale in Import options, then retry.
mmdhl.library.hint.too_large=Le modèle est extrêmement grand. Diminuez le réglage « Échelle d'importation » dans « Options d'importation », puis réessayez.

# en: The model sits very far from its origin. Move it to the origin in its original program.
mmdhl.library.hint.recenter=Le modèle est très éloigné de son point d'origine. Ramenez-le à ce point dans son programme d'origine.

# en: The importer stopped unexpectedly. The file may be damaged or use unsupported features.
mmdhl.library.hint.importer_exited=L'importateur s'est arrêté de manière inattendue. Le fichier est peut-être endommagé ou utilise des fonctionnalités non prises en charge.

# en: The import took longer than five minutes. Use the fast collision option or a smaller model.
mmdhl.library.hint.timeout=L'importation a duré plus de cinq minutes. Utilisez l'option de collision rapide ou un modèle plus petit.

# en: This file type is not supported here. Static props accept OBJ, FBX, GLB, GLTF, PMX and BLEND; PMD characters belong in Character Models.
mmdhl.library.hint.unsupported_type=Ce type de fichier n'est pas pris en charge ici. Les objets statiques acceptent OBJ, FBX, GLB, GLTF, PMX et BLEND ; les personnages PMD vont dans « Personnages ».

# en: The skeleton could not be read. The model may be damaged; try re-saving it in PMX Editor.
mmdhl.library.hint.skeleton=Le squelette n'a pas pu être lu. Le modèle est peut-être endommagé ; essayez de l'enregistrer à nouveau dans PMX Editor.

# en: Check the file in its original program, export it again and retry. Copy the details below when reporting the problem.
mmdhl.library.hint.default=Vérifiez le fichier dans son programme d'origine, exportez-le à nouveau, puis réessayez. Copiez les détails ci-dessous pour signaler le problème.

