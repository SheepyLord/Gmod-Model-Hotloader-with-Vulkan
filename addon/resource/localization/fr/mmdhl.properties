# ===== Installation checks (installation.lua) =====

# en: This addon requires Windows x64 Garry's Mod. Select the x86-64 game branch or launch 64 bit version of the game.
mmdhl.install.error.unsupported_platform=Cet addon nécessite Garry's Mod pour Windows x64. Sélectionnez la branche x86-64 du jeu ou lancez la version 64 bits du jeu.

# en: The Workshop native release policy is missing or invalid. Update the Workshop addon.
mmdhl.install.error.policy_invalid=La liste des versions natives approuvées de l'addon Workshop est manquante ou non valide. Mettez à jour l'addon Workshop.

# en: Installed native release {installed} is no longer approved. Install {recommended} and restart.
mmdhl.install.error.release_not_approved=La version native installée {installed} n'est plus approuvée. Installez {recommended} et redémarrez.

# en: Native release {installed} is outdated and no longer approved for this version of the addon. Model Hotloader runs anyway; install {recommended} for the newest fixes.
mmdhl.install.warning.outdated_release=La version native {installed} est obsolète et n'est plus approuvée pour cette version de l'addon. Model Hotloader fonctionne quand même ; installez {recommended} pour les dernières corrections.

# en: This native release does not accept the addon's newer game compatibility profiles for {libraries}, so it checks them with its own built-in guards. Model Hotloader runs anyway; install {recommended} for full compatibility checks.
mmdhl.install.warning.compatibility_fallback=Cette version native n'accepte pas les profils de compatibilité de jeu plus récents de l'addon pour {libraries} ; elle les vérifie donc avec ses propres protections intégrées. Model Hotloader fonctionne quand même ; installez {recommended} pour des vérifications de compatibilité complètes.

# en: Missing {path}. Reinstall the native package and restart.
mmdhl.install.error.file_missing={path} est manquant. Réinstallez le paquet natif et redémarrez.

# en: Cannot read {path}. Reinstall the native package and restart.
mmdhl.install.error.file_unreadable=Impossible de lire {path}. Réinstallez le paquet natif et redémarrez.

# en: {path} belongs to {release}, but this installation requires {required} Install a complete approved package and restart.
mmdhl.install.error.file_mixed={path} appartient à {release}, mais cette installation requiert {required}. Installez un paquet approuvé complet et redémarrez.

# en: {path} does not match a recognized binary. It may be damaged or from an unapproved build. Install a complete approved package and restart.
mmdhl.install.error.file_unrecognized={path} ne correspond à aucun binaire reconnu. Il est peut-être endommagé ou issu d'une compilation non approuvée. Installez un paquet approuvé complet et redémarrez.

# en: Native installation unavailable. Open External Models for repair instructions.
mmdhl.install.unavailable_repair=Installation native indisponible. Ouvrez Modèles externes pour les instructions de réparation.

# en: Model Hotloader is checking {feature}.
mmdhl.install.checking_feature=Model Hotloader vérifie {feature}.

# en: Native installation unavailable
mmdhl.install.unavailable=Installation native indisponible

# en: The loaded module does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.
mmdhl.install.error.loaded_module_mismatch=Le module chargé ne correspond pas à l'installation approuvée ou au chemin physique attendu. Fermez Garry's Mod, réinstallez le paquet complet et redémarrez.

# en: The loaded runtime does not match the approved installation or expected physical path. Close Garry's Mod, reinstall the complete package and restart.
mmdhl.install.error.loaded_runtime_mismatch=Le runtime chargé ne correspond pas à l'installation approuvée ou au chemin physique attendu. Fermez Garry's Mod, réinstallez le paquet complet et redémarrez.

# en: Worker self-test failed. Reinstall native binaries and dependencies.
mmdhl.install.error.worker_failed=L'autotest du processus worker a échoué. Réinstallez les binaires natifs et leurs dépendances.

# en: Worker and runtime identities do not match the approved native release. Reinstall and restart.
mmdhl.install.error.worker_mismatch=Les identités du processus worker et du runtime ne correspondent pas à la version native approuvée. Réinstallez et redémarrez.

# en: Detailed collision is unavailable; simple hulls remain available.
mmdhl.install.error.coacd_failed=La collision détaillée est indisponible ; les enveloppes simples restent disponibles.

# en: Installation was checked. Fully restart Garry's Mod to load repaired native binaries.
mmdhl.install.error.restart_to_load=L'installation a été vérifiée. Redémarrez complètement Garry's Mod pour charger les binaires natifs réparés.

# en: Files for {feature} now pass validation. Fully restart Garry's Mod to enable the repaired component.
mmdhl.install.error.restart_to_enable=Les fichiers de {feature} passent désormais la validation. Redémarrez complètement Garry's Mod pour activer le composant réparé.

# en: Native module could not load: {reason}. Check the Microsoft Visual C++ x64 Redistributable and reinstall the native package.
mmdhl.install.error.loader_failed=Le module natif n'a pas pu être chargé : {reason}. Vérifiez le Microsoft Visual C++ x64 Redistributable et réinstallez le paquet natif.

# en: This native release lacks installation verification. Install {recommended} and restart.
mmdhl.install.error.no_verification=Cette version native ne permet pas de vérifier l'installation. Installez {recommended} et redémarrez.

# en: A required game library did not become available after map startup. Restart the game or check Workshop for a compatibility update.
mmdhl.install.error.game_not_ready=Une bibliothèque requise du jeu n'est pas devenue disponible après le démarrage de la carte. Redémarrez le jeu ou recherchez une mise à jour de compatibilité sur le Workshop.

# en: This Garry's Mod build has not been tested with this native release ({libraries} changed). Model Hotloader runs anyway; if something misbehaves, check Workshop and GitHub for an update.
mmdhl.install.warning.game_untested=Cette version de Garry's Mod n'a pas été testée avec cette version native ({libraries} ont changé). Model Hotloader fonctionne quand même ; en cas de problème, recherchez une mise à jour sur le Workshop et GitHub.

# ===== File access for other addons (file_access.lua) =====

# en: File access for other addons
mmdhl.file_access.feature=Accès aux fichiers pour les autres addons

# en: File access for other addons needs a newer Model Hotloader binary module (2.3.0 or later). Everything else keeps working.
mmdhl.file_access.needs_update=L'accès aux fichiers pour les autres addons nécessite un module binaire Model Hotloader plus récent (2.3.0 ou ultérieur). Tout le reste continue de fonctionner.

# en: Addons can ask to read your files only in single player and on servers you host. On other servers, scripts come from the server, so Model Hotloader refuses.
mmdhl.file_access.unavailable_remote=Les addons ne peuvent demander à lire vos fichiers qu'en solo et sur les serveurs que vous hébergez. Sur les autres serveurs, les scripts viennent du serveur : Model Hotloader refuse.

# en: File access for other addons needs Model Hotloader's server part, which did not load. Open the installation window for details.
mmdhl.file_access.unavailable_server_realm=L'accès aux fichiers pour les autres addons nécessite la partie serveur de Model Hotloader, qui ne s'est pas chargée. Ouvrez la fenêtre d'installation pour plus de détails.

# en: File access for other addons is turned off (Utilities → User → Character Models → File access for other addons…).
mmdhl.file_access.unavailable_disabled=L'accès aux fichiers pour les autres addons est désactivé (Utilitaires → Utilisateur → Personnages → Accès aux fichiers pour les autres addons…).

# en: The Model Hotloader worker (mmdhl_worker.exe) is missing. Reinstall the binary module.
mmdhl.file_access.unavailable_worker=Le worker de Model Hotloader (mmdhl_worker.exe) est introuvable. Réinstallez le module binaire.

# en: File access for other addons shows its windows through Model Hotloader's worker (mmdhl_worker.exe), which the installation check does not allow right now: {reason}
mmdhl.file_access.worker_unavailable=L'accès aux fichiers pour les autres addons affiche ses fenêtres par le worker de Model Hotloader (mmdhl_worker.exe), que la vérification de l'installation n'autorise pas pour l'instant : {reason}

# en: {addon} asks to read a file. A Windows dialog opened behind the full-screen game: press Alt+Tab to answer it.
mmdhl.file_access.waiting_fullscreen={addon} demande à lire un fichier. Une fenêtre Windows s'est ouverte derrière le jeu en plein écran : appuyez sur Alt+Tab pour y répondre.

# en: {addon} asks to read a file. Answer the Windows dialog; if you cannot see it, check the taskbar or press Alt+Tab.
mmdhl.file_access.waiting_windowed={addon} demande à lire un fichier. Répondez dans la fenêtre Windows ; si vous ne la voyez pas, regardez la barre des tâches ou appuyez sur Alt+Tab.

# en: Confirm turning on file access in the Windows dialog. If you cannot see it, press Alt+Tab.
mmdhl.file_access.waiting_confirm=Confirmez l'activation de l'accès aux fichiers dans la fenêtre Windows. Si vous ne la voyez pas, appuyez sur Alt+Tab.

# en: Model Hotloader could not save your file access choice. It applies until the map changes.
mmdhl.file_access.not_saved=Model Hotloader n'a pas pu enregistrer votre choix d'accès aux fichiers. Il s'applique jusqu'au changement de carte.

# en: The player did not allow it.
mmdhl.file_access.error.denied=Le joueur ne l'a pas autorisé.

# en: The player refused this addon three times. It can ask again after the map changes.
mmdhl.file_access.error.auto_denied=Le joueur a refusé cet addon trois fois. Il pourra redemander après le changement de carte.

# en: Too many file requests were refused on this map. Addons can ask again after the map changes.
mmdhl.file_access.error.auto_denied_session=Trop de demandes de fichiers ont été refusées sur cette carte. Les addons pourront redemander après le changement de carte.

# en: Too many file requests are waiting. Try again in a moment.
mmdhl.file_access.error.busy=Trop de demandes de fichiers sont en attente. Réessayez dans un instant.

# en: The file or folder does not exist.
mmdhl.file_access.error.not_found=Ce fichier ou dossier n'existe pas.

# en: Files on other computers cannot be requested by path.
mmdhl.file_access.error.network=Les fichiers d'autres ordinateurs ne peuvent pas être demandés par chemin.

# en: Files on network drives can only be chosen in the file picker.
mmdhl.file_access.error.remote_drive=Les fichiers des lecteurs réseau ne peuvent être choisis que dans le sélecteur de fichiers.

# en: This is not a valid path. Use a full path that starts with a drive letter, without ".." parts or device names.
mmdhl.file_access.error.invalid_path=Ce chemin n'est pas valide. Utilisez un chemin complet commençant par une lettre de lecteur, sans parties « .. » ni noms de périphériques.

# en: Model Hotloader never lets addons read this location.
mmdhl.file_access.error.denied_location=Model Hotloader ne laisse jamais les addons lire cet emplacement.

# en: Links and junctions are not followed, and nothing outside what the player allowed can be read.
mmdhl.file_access.error.link=Les liens et jonctions ne sont pas suivis, et rien en dehors de ce que le joueur a autorisé ne peut être lu.

# en: Hidden and system files are read only when the addon asks for them.
mmdhl.file_access.error.hidden=Les fichiers cachés et système ne sont lus que si l'addon les demande.

# en: The file is larger than the read limit. Read it in parts in binary mode.
mmdhl.file_access.error.too_large=Le fichier dépasse la limite de lecture. Lisez-le par morceaux en mode binaire.

# en: Files can be read up to 256 MiB from their start.
mmdhl.file_access.error.offset=Les fichiers peuvent être lus jusqu'à 256 Mio depuis leur début.

# en: This is a folder, not a file.
mmdhl.file_access.error.not_a_file=Ceci est un dossier, pas un fichier.

# en: This is a file, not a folder.
mmdhl.file_access.error.not_a_folder=Ceci est un fichier, pas un dossier.

# en: This file is no longer available to the addon; it has to ask again.
mmdhl.file_access.error.released=Ce fichier n'est plus accessible à l'addon ; il doit redemander.

# en: Windows did not allow the file to be read.
mmdhl.file_access.error.unreadable=Windows n'a pas permis de lire le fichier.

# en: The Windows dialog could not be shown.
mmdhl.file_access.error.dialog_failed=La fenêtre Windows n'a pas pu s'afficher.

# en: The addon holds too many files; it has to release some first.
mmdhl.file_access.error.too_many_items=L'addon détient trop de fichiers ; il doit d'abord en libérer.

# en: Another addon's rule refused this request.
mmdhl.file_access.error.denied_by_hook=Une règle d'un autre addon a refusé cette demande.

# en: The addon's request is invalid: {error}
mmdhl.file_access.error.invalid_options=La demande de l'addon n'est pas valide : {error}

# en: File access failed: {error}
mmdhl.file_access.error.other=Échec de l'accès au fichier : {error}

# en: File access for other addons…
mmdhl.file_access.manage.button=Accès aux fichiers pour les autres addons…

# en: File access for other addons
mmdhl.file_access.manage.title=Accès aux fichiers pour les autres addons

# en: Other addons can ask to read files on your computer. Model Hotloader asks you in a Windows dialog first, and an addon reads only what you choose or allow. Whatever an addon reads, it can send to a server or a website.
mmdhl.file_access.manage.help=D'autres addons peuvent demander à lire des fichiers sur votre ordinateur. Model Hotloader vous le demande d'abord dans une fenêtre Windows, et un addon ne lit que ce que vous choisissez ou autorisez. Tout ce qu'un addon lit, il peut l'envoyer à un serveur ou à un site web.

# en: Let addons ask to read files
mmdhl.file_access.manage.enabled=Permettre aux addons de demander à lire des fichiers

# en: Turning this off takes effect at once. Turning it on asks for confirmation in a Windows dialog.
mmdhl.file_access.manage.enabled_tip=La désactivation prend effet immédiatement. L'activation demande une confirmation dans une fenêtre Windows.

# en: Remembered folders are kept by the name an addon's script reports. Another addon could use the same name, so revoke folders you no longer need.
mmdhl.file_access.manage.note=Les dossiers mémorisés sont associés au nom qu'indique le script d'un addon. Un autre addon pourrait utiliser le même nom : révoquez les dossiers dont vous n'avez plus besoin.

# en: Addon
mmdhl.file_access.manage.column_addon=Addon

# en: Folder
mmdhl.file_access.manage.column_folder=Dossier

# en: Last used
mmdhl.file_access.manage.column_used=Dernière utilisation

# en: No folders are remembered. A folder appears here when you choose "Always allow this addon here" in a request.
mmdhl.file_access.manage.empty=Aucun dossier mémorisé. Un dossier apparaît ici lorsque vous choisissez « Toujours autoriser cet addon ici » dans une demande.

# en: Revoke
mmdhl.file_access.manage.revoke=Révoquer

# en: Revoke all
mmdhl.file_access.manage.revoke_all=Tout révoquer

# en: Forget every remembered folder? Addons will have to ask again.
mmdhl.file_access.manage.revoke_all_confirm=Oublier tous les dossiers mémorisés ? Les addons devront redemander.

