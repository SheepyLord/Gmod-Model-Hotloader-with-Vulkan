# en: Show this model's names in my language
mmdhl.names.import_translate=Afficher les noms de ce modèle dans ma langue

# en: The model's name and the names of its parts and expressions are sent to Google Translate. Translations appear when they arrive. Your choice is kept for the next import; switch translation off completely in Physics & Performance.
mmdhl.names.import_note=Le nom du modèle et ceux de ses parties et expressions sont envoyés à Google Traduction. Les traductions s'affichent dès qu'elles arrivent. Votre choix est conservé pour la prochaine importation ; pour désactiver complètement la traduction, passez par Physique et performances.

# en: Model name translation
mmdhl.names.setting_title=Traduction des noms des modèles

# en: Translate names from models into my language
mmdhl.names.setting_label=Traduire dans ma langue les noms venant des modèles

# en: Model, part and expression names are sent to Google Translate and saved on this computer once translated. Off: names show as written in the model files and nothing is sent.
mmdhl.names.setting_tooltip=Les noms des modèles, de leurs parties et de leurs expressions sont envoyés à Google Traduction, et les traductions sont enregistrées sur cet ordinateur. Désactivé : les noms s'affichent tels qu'écrits dans les fichiers et rien n'est envoyé.

# en: Translations appear when they arrive and never delay imports or spawning. Names of models imported with translation unticked are never sent.
mmdhl.names.setting_help=Les traductions s'affichent dès qu'elles arrivent et ne retardent jamais une importation ni une apparition. Les noms des modèles importés avec la traduction décochée ne sont jamais envoyés.

# en: Google Translate is not answering right now. Names show as written in the model files; translation is retried later.
mmdhl.names.status_unavailable=Google Traduction ne répond pas pour le moment. Les noms s'affichent tels qu'écrits dans les fichiers ; la traduction sera retentée plus tard.

# en: Model Hotloader can show the names in your models (model, parts, expressions) in your language by sending them to Google Translate. Nothing is sent until you choose.
mmdhl.names.notice=Model Hotloader peut afficher dans votre langue les noms contenus dans vos modèles (modèle, parties, expressions) en les envoyant à Google Traduction. Rien n'est envoyé avant votre choix.

