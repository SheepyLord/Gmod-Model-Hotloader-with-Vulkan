# ===== Importing: what to try after a failure (library.lua) =====

# en: Choose Import as character below: VRM avatars become posable ragdolls with their spring-bone physics.
mmdhl.library.hint.vrm_avatar=Choisissez « Importer comme personnage » ci-dessous : les avatars VRM deviennent des corps articulés avec la physique de leurs os à ressort.

# en: Import it under Static Props instead. Characters must be PMX, PMD or VRM files.
mmdhl.library.hint.static_file=Importez-le plutôt dans « Objets statiques ». Les personnages doivent être des fichiers PMX, PMD ou VRM.

# en: The VRM humanoid is incomplete. Export it again from VRoid Studio, UniVRM or the Blender VRM add-on with every required humanoid bone assigned.
mmdhl.library.hint.vrm_humanoid=L'humanoïde VRM est incomplet. Exportez-le à nouveau depuis VRoid Studio, UniVRM ou l'add-on VRM de Blender en assignant chaque os humanoïde requis.

# en: The VRM file refers to data stored beside it. Export it again as one self-contained .vrm file.
mmdhl.library.hint.vrm_external_buffer=Le fichier VRM fait référence à des données stockées à côté de lui. Exportez-le à nouveau en un seul fichier .vrm autonome.

# en: The VRM file is damaged or incomplete. Export it again from the original program and retry.
mmdhl.library.hint.vrm_damaged=Le fichier VRM est endommagé ou incomplet. Exportez-le à nouveau depuis le programme d'origine, puis réessayez.

# en: The file could not be read. Check that it still exists, is not open in another program, and that its folder is accessible.
mmdhl.library.hint.cannot_open=Le fichier n'a pas pu être lu. Vérifiez qu'il existe toujours, qu'il n'est pas ouvert dans un autre programme et que son dossier est accessible.

# en: The file could not be parsed. Re-export it from its original program (GLB or FBX work best) and import again.
mmdhl.library.hint.parser=Le fichier n'a pas pu être analysé. Exportez-le à nouveau depuis son programme d'origine (GLB ou FBX fonctionnent le mieux), puis importez-le de nouveau.

# en: This is not a readable .blend file. Save it again in Blender, or export it as GLB or FBX.
mmdhl.library.hint.not_blend=Ce fichier .blend est illisible. Enregistrez-le à nouveau dans Blender ou exportez-le en GLB ou FBX.

# en: The file contains no mesh triangles; it may hold only an armature, cameras, lights, curves or text. In Blender, convert them with Object > Convert > Mesh.
mmdhl.library.hint.no_triangles=Le fichier ne contient aucun triangle de maillage ; il ne contient peut-être qu'une armature, des caméras, des lumières, des courbes ou du texte. Dans Blender, convertissez-les avec Objet > Convertir > Maillage (Object > Convert > Mesh).

# en: The objects chosen at import were renamed or removed in Blender. Import the file again to choose objects.
mmdhl.library.hint.blend_objects_changed=Les objets choisis lors de l'importation ont été renommés ou supprimés dans Blender. Importez à nouveau le fichier pour choisir les objets.

# en: The compressed .blend file is damaged or incomplete. Save it again in Blender (File > Save) and retry.
mmdhl.library.hint.blend_compressed=Le fichier .blend compressé est endommagé ou incomplet. Enregistrez-le à nouveau dans Blender (Fichier > Enregistrer / File > Save), puis réessayez.

# en: The file is incomplete, possibly still being written or copied. Save it again and retry.
mmdhl.library.hint.truncated=Le fichier est incomplet, peut-être encore en cours d'écriture ou de copie. Enregistrez-le à nouveau, puis réessayez.

# en: This .blend file uses data the importer cannot read. Open it in Blender and export the model as GLB or FBX.
mmdhl.library.hint.blend_unsupported=Ce fichier .blend utilise des données que l'importateur ne sait pas lire. Ouvrez-le dans Blender et exportez le modèle en GLB ou FBX.

# en: The model has too many materials (limit 128). Merge materials in the original program before importing.
mmdhl.library.hint.material_limit=Le modèle a trop de matériaux (limite : 128). Fusionnez des matériaux dans le programme d'origine avant l'importation.

# en: The file or its textures exceed the 256 MB limit. Reduce texture sizes or split the model.
mmdhl.library.hint.byte_limit=Le fichier ou ses textures dépassent la limite de 256 MB. Réduisez la taille des textures ou divisez le modèle.

# en: The geometry is too large for one prop. Split the model or decimate it.
mmdhl.library.hint.geometry_budget=La géométrie est trop volumineuse pour un seul objet. Divisez le modèle ou décimez-le.

# en: The PMX file is damaged or uses an unsupported version. PMX 2.0 and 2.1 are supported.
mmdhl.library.hint.pmx=Le fichier PMX est endommagé ou utilise une version non prise en charge. Les versions PMX 2.0 et 2.1 sont prises en charge.

# en: The model is extremely small. Raise Import scale in Import options, then retry.
mmdhl.library.hint.too_small=Le modèle est extrêmement petit. Augmentez le réglage « Échelle d'importation » dans « Options d'importation », puis réessayez.

# en: The model is extremely large. Lower Import scale in Import options, then retry.
mmdhl.library.hint.too_large=Le modèle est extrêmement grand. Diminuez le réglage « Échelle d'importation » dans « Options d'importation », puis réessayez.

# en: The model sits very far from its origin. Move it to the origin in its original program.
mmdhl.library.hint.recenter=Le modèle est très éloigné de son point d'origine. Ramenez-le à ce point dans son programme d'origine.

# en: The importer stopped unexpectedly. The file may be damaged or use unsupported features.
mmdhl.library.hint.importer_exited=L'importateur s'est arrêté de manière inattendue. Le fichier est peut-être endommagé ou utilise des fonctionnalités non prises en charge.

# en: The import took longer than five minutes. Use the fast collision option or a smaller model.
mmdhl.library.hint.timeout=L'importation a duré plus de cinq minutes. Utilisez l'option de collision rapide ou un modèle plus petit.

# en: This file type is not supported here. Static props accept OBJ, FBX, GLB, GLTF, PMX and BLEND; PMD characters belong in Character Models.
mmdhl.library.hint.unsupported_type=Ce type de fichier n'est pas pris en charge ici. Les objets statiques acceptent OBJ, FBX, GLB, GLTF, PMX et BLEND ; les personnages PMD vont dans « Personnages ».

# en: The skeleton could not be read. The model may be damaged; try re-saving it in PMX Editor.
mmdhl.library.hint.skeleton=Le squelette n'a pas pu être lu. Le modèle est peut-être endommagé ; essayez de l'enregistrer à nouveau dans PMX Editor.

# en: Check the file in its original program, export it again and retry. Copy the details below when reporting the problem.
mmdhl.library.hint.default=Vérifiez le fichier dans son programme d'origine, exportez-le à nouveau, puis réessayez. Copiez les détails ci-dessous pour signaler le problème.

# en: The spring-bone settings (swinging hair and clothes) are out of range or incomplete. Check them in the program that exported the VRM, then export it again.
mmdhl.library.hint.vrm_spring=Les réglages des os à ressort (cheveux et vêtements qui se balancent) sont hors limites ou incomplets. Vérifiez-les dans le programme qui a exporté le VRM, puis exportez-le à nouveau.

# en: The importer program (mmdhl_worker.exe) is missing. Install the native files of Model Hotloader again; the installation window lists what is missing.
mmdhl.library.hint.worker_missing=Le programme d'importation (mmdhl_worker.exe) est introuvable. Réinstallez les fichiers natifs de Model Hotloader ; la fenêtre d'installation indique ce qui manque.

# en: Windows did not start the importer (mmdhl_worker.exe). Antivirus software may be blocking it: allow it, or install the native files again, then retry.
mmdhl.library.hint.worker_start=Windows n'a pas démarré l'importateur (mmdhl_worker.exe). Un antivirus le bloque peut-être : autorisez-le ou réinstallez les fichiers natifs, puis réessayez.

# en: The file is incomplete: it was probably cut off while downloading, copying or extracting. Download or extract the model again and import the new copy.
mmdhl.library.hint.pmx_truncated=Le fichier est incomplet : il a sans doute été coupé pendant un téléchargement, une copie ou une extraction. Téléchargez ou extrayez à nouveau le modèle, puis importez la nouvelle copie.

# en: Part of the file is damaged (see Where). Open the model in PMX Editor and save it again; if PMX Editor cannot open it either, download the model again.
mmdhl.library.hint.pmx_damaged=Une partie du fichier est endommagée (voir « Emplacement »). Ouvrez le modèle dans PMX Editor et enregistrez-le à nouveau ; si PMX Editor ne peut pas l'ouvrir non plus, téléchargez à nouveau le modèle.

# en: Open the model in PMX Editor and save it as PMX 2.0 or 2.1, then import it again.
mmdhl.library.hint.pmx_version=Ouvrez le modèle dans PMX Editor et enregistrez-le au format PMX 2.0 ou 2.1, puis importez-le à nouveau.

# en: The materials do not match the model's triangles. In PMX Editor, check the material named under Where (or delete it), save and import again.
mmdhl.library.hint.pmx_materials=Les matériaux ne correspondent pas aux triangles du modèle. Dans PMX Editor, vérifiez le matériau indiqué sous « Emplacement » (ou supprimez-le), enregistrez, puis importez à nouveau.

# en: A value in the model is not a valid number. In PMX Editor, correct the value named under Where (or delete that element), save and import again.
mmdhl.library.hint.pmx_number=Une valeur du modèle n'est pas un nombre valide. Dans PMX Editor, corrigez la valeur indiquée sous « Emplacement » (ou supprimez cet élément), enregistrez, puis importez à nouveau.

# en: An element of the model points to one that does not exist. In PMX Editor, fix or delete the element named under Where, save and import again.
mmdhl.library.hint.pmx_reference=Un élément du modèle renvoie à un élément qui n'existe pas. Dans PMX Editor, corrigez ou supprimez l'élément indiqué sous « Emplacement », enregistrez, puis importez à nouveau.

# en: Extract the archive first (right-click › Extract All, or 7-Zip for RAR and 7z files), then import the .pmx, .pmd or .vrm file inside it.
mmdhl.library.hint.format_archive=Extrayez d'abord l'archive (clic droit › Extraire tout, ou 7-Zip pour les fichiers RAR et 7z), puis importez le fichier .pmx, .pmd ou .vrm qu'elle contient.

# en: Choose the character's model file (.pmx or .pmd) instead. Motion and pose files cannot be imported.
mmdhl.library.hint.format_motion=Choisissez plutôt le fichier du modèle du personnage (.pmx ou .pmd). Les fichiers de mouvement et de pose ne peuvent pas être importés.

# en: Choose the model file (.pmx, .pmd or .vrm) instead. Its textures are loaded with it.
mmdhl.library.hint.format_image=Choisissez plutôt le fichier du modèle (.pmx, .pmd ou .vrm). Ses textures sont chargées avec lui.

# en: Rename the file so that it ends in {extension}, then import it again.
mmdhl.library.hint.format_renamed=Renommez le fichier pour qu'il se termine par {extension}, puis importez-le à nouveau.

# en: Make sure you chose the model file itself (.pmx, .pmd, .vrm, .fbx, .glb or .dae), not a readme, an image or an archive.
mmdhl.library.hint.format_unknown=Vérifiez que vous avez choisi le fichier du modèle lui-même (.pmx, .pmd, .vrm, .fbx, .glb ou .dae), et non un fichier lisez-moi, une image ou une archive.

# en: The file was moved, renamed or deleted after it was chosen. Choose it again where it is now.
mmdhl.library.hint.io_missing=Le fichier a été déplacé, renommé ou supprimé après avoir été choisi. Choisissez-le à nouveau à son emplacement actuel.

# en: Close programs that may have the file open (PMX Editor, an archive tool, cloud sync), then retry.
mmdhl.library.hint.io_locked=Fermez les programmes qui pourraient avoir ouvert le fichier (PMX Editor, un outil d'archives, une synchronisation cloud), puis réessayez.

# en: Windows denied access. Move the model to a normal folder such as Documents, or allow Garry's Mod in your antivirus software, then retry.
mmdhl.library.hint.io_denied=Windows a refusé l'accès. Déplacez le modèle dans un dossier ordinaire, comme Documents, ou autorisez Garry's Mod dans votre antivirus, puis réessayez.

# en: The drive reported an error or was disconnected. Copy the model to your own drive and import that copy.
mmdhl.library.hint.io_device=Le lecteur a signalé une erreur ou a été déconnecté. Copiez le modèle sur votre propre disque et importez cette copie.

# en: The file is empty. Wait until its download or sync has finished, or copy it again from the original.
mmdhl.library.hint.io_empty=Le fichier est vide. Attendez la fin de son téléchargement ou de sa synchronisation, ou copiez-le à nouveau depuis l'original.

# en: The cache could not be written. Check free disk space, and that garrysmod/data/mmd_hotloader is not read-only or blocked by antivirus software.
mmdhl.library.hint.io_write=Le cache n'a pas pu être écrit. Vérifiez l'espace disque libre et que garrysmod/data/mmd_hotloader n'est ni en lecture seule ni bloqué par un antivirus.

# en: Free some space on the drive that holds Garry's Mod, then retry.
mmdhl.library.hint.io_disk_full=Libérez de l'espace sur le disque qui contient Garry's Mod, puis réessayez.

# en: Close other programs and retry. Very large models or textures need more memory; smaller textures help.
mmdhl.library.hint.memory=Fermez d'autres programmes et réessayez. Les très gros modèles ou textures demandent plus de mémoire ; des textures plus petites aident.

# en: The importer crashed on this file. It may be damaged or use something the importer cannot read: save it again in its original program and retry. Please copy the details below when reporting the problem.
mmdhl.library.hint.worker_crash=L'importateur a planté sur ce fichier. Il est peut-être endommagé ou utilise quelque chose que l'importateur ne sait pas lire : enregistrez-le à nouveau dans son programme d'origine, puis réessayez. Copiez les détails ci-dessous pour signaler le problème.

# en: The file picker closed unexpectedly. Programs that add to Windows file dialogs (archive tools, cloud storage) can cause this. Try again, or choose the file from another folder.
mmdhl.library.hint.picker_crash=Le sélecteur de fichiers s'est fermé de manière inattendue. Les programmes qui ajoutent des fonctions aux boîtes de dialogue de fichiers de Windows (outils d'archives, stockage cloud) peuvent en être la cause. Réessayez, ou choisissez le fichier depuis un autre dossier.

# en: A texture file in the importer's cache is damaged or cannot be used. Delete the file shown under Where, then import the model again. If it happens again, save the model's textures again as PNG files in an image editor.
mmdhl.library.hint.texture_derivative=Un fichier de texture du cache de l'importateur est endommagé ou inutilisable. Supprimez le fichier indiqué sous « Emplacement », puis importez de nouveau le modèle. Si le problème se reproduit, enregistrez à nouveau les textures du modèle au format PNG dans un éditeur d'images.

