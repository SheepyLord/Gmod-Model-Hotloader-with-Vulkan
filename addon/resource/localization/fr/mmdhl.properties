# ===== Physics & Performance tab of the library window (physics_settings.lua) =====

# en: Physics & Performance
mmdhl.physics.title=Physique et performances

# en: Settings apply to all imported characters and are saved automatically. These controls affect hair, clothing and accessories.
mmdhl.physics.intro=Les réglages s'appliquent à tous les personnages importés et sont enregistrés automatiquement. Ces commandes concernent les cheveux, les vêtements et les accessoires.

# en: Physics: Off
mmdhl.physics.status.off=Physique : désactivée

# en: Physics: Lightweight jiggle
mmdhl.physics.status.jiggle=Physique : Oscillation légère

# en: Physics: Full simulation ({count})
mmdhl.physics.status.full=Physique : Simulation complète ({count})

# en: CPU threads: {count}
mmdhl.physics.status.threads=Threads CPU : {count}

# en: CPU threads: automatic
mmdhl.physics.status.threads_automatic=Threads CPU : automatique

# en: Restart GMod to load the updated physics module.
mmdhl.physics.error.restart_required=Redémarrez GMod pour charger le module physique mis à jour.

# en: Physics settings could not be applied.
mmdhl.physics.error.apply_failed=Les réglages physiques n'ont pas pu être appliqués.

# en: Worker count could not be applied.
mmdhl.physics.error.workers_failed=Le nombre de threads CPU n'a pas pu être appliqué.

# en: Physics processor
mmdhl.physics.backend.label=Processeur physique

# en: Multicore CPU Processor is recommended. Vulkan GPU Processor solves on the graphics card and needs the DXVK renderer to keep up; with few CPU threads it can still fall behind at high accuracy. MMD Compatibility favors original motion. OpenCL is experimental and may be slower.
mmdhl.physics.backend.tooltip=« Processeur CPU multicœur » est recommandé. « Processeur GPU Vulkan » calcule sur la carte graphique et a besoin du rendu DXVK pour suivre ; avec peu de threads CPU, il peut encore prendre du retard en haute précision. « Processeur de compatibilité MMD » privilégie le mouvement d'origine. OpenCL est expérimental et peut être plus lent.

# en: Hair and clothing collide with
mmdhl.physics.collision.label=Collision des cheveux et vêtements avec

# en: Living players and NPCs are excluded. Hair and clothing react to objects without pushing them.
mmdhl.physics.collision.tooltip=Les joueurs et PNJ vivants sont exclus. Les cheveux et vêtements réagissent aux objets sans les pousser.

# en: Spawn frozen (new placements only)
mmdhl.physics.spawn_frozen.label=Apparition gelée (nouveaux placements uniquement)

# en: Existing limbs keep their current frozen state.
mmdhl.physics.spawn_frozen.tooltip=Les membres existants conservent leur état gelé actuel.

# en: Physics accuracy — Off
mmdhl.physics.accuracy.off=Précision physique — désactivée

# en: Physics accuracy — Jiggle
mmdhl.physics.accuracy.jiggle=Précision physique — Oscillation

# en: Physics accuracy — {count} iterations
mmdhl.physics.accuracy.iterations=Précision physique — {count} itérations

# en: −1: Off · 0: Jiggle · Levels 1–7: 1, 2, 5, 10, 20, 50, 100 iterations. Default: level 4 (10 iterations).
mmdhl.physics.accuracy.tooltip=−1 : désactivée · 0 : Oscillation · Niveaux 1–7 : 1, 2, 5, 10, 20, 50, 100 itérations. Par défaut : niveau 4 (10 itérations).

# en: −1: Off · 0: Jiggle · 1–7: Full physics (1, 2, 5, 10, 20, 50, 100 iterations). Jiggle moves only each chain’s first bone; children follow without bending independently. VRM spring bones run fully at every level except Off.
mmdhl.physics.accuracy.help=−1 : désactivée · 0 : Oscillation · 1–7 : physique complète (1, 2, 5, 10, 20, 50, 100 itérations). L'oscillation ne déplace que le premier os de chaque chaîne ; les os enfants suivent sans se plier indépendamment. Les os à ressort VRM sont entièrement simulés à tous les niveaux, sauf quand la physique est désactivée.

# en: Gravity multiplier
mmdhl.physics.gravity.label=Multiplicateur de gravité

# en: Default 1. Scales the gravity of the character model's own physics; Source ragdoll gravity is unchanged.
mmdhl.physics.gravity.tooltip=Par défaut : 1. Met à l'échelle la gravité de la physique propre au personnage ; la gravité des corps Source n'est pas modifiée.

# en: Motion damping
mmdhl.physics.damping.label=Amortissement du mouvement

# en: Default 1. Higher values make motion settle faster. Zero removes damping.
mmdhl.physics.damping.tooltip=Par défaut : 1. Des valeurs plus élevées stabilisent le mouvement plus vite. Zéro supprime l'amortissement.

# en: VRM: hair and clothing keep their shape while moving
mmdhl.physics.vrm_damping.label=VRM : les cheveux et vêtements gardent leur forme en mouvement

# en: Default on. VRM spring bones damp motion against the character's hips instead of the world, so walking or a thrown ragdoll no longer drags hair and skirts behind; starting, stopping and turning still swing them. Off gives the plain VRM behaviour.
mmdhl.physics.vrm_damping.tooltip=Activé par défaut. Les os à ressort VRM amortissent le mouvement par rapport aux hanches du personnage plutôt qu'au monde : la marche ou un corps projeté n'entraînent plus les cheveux et les jupes vers l'arrière ; démarrer, s'arrêter et tourner les font toujours balancer. Désactivé, le comportement VRM standard s'applique.

# en: Adaptive physics
mmdhl.lod.title=Physique adaptative

# en: Adaptive physics quality
mmdhl.lod.enabled.label=Qualité physique adaptative

# en: Reduce iterations or suspend secondary physics for distant or unseen slow-moving characters.
mmdhl.lod.enabled.tooltip=Réduit les itérations ou suspend la physique secondaire des personnages lents éloignés ou hors de vue.

# en: Distance and visibility settings
mmdhl.lod.advanced=Réglages de distance et de visibilité

# en: Always full quality within (units)
mmdhl.lod.near.label=Toujours en qualité complète jusqu'à (unités)

# en: Visibility never reduces quality inside this range.
mmdhl.lod.near.tooltip=La visibilité ne réduit jamais la qualité dans ce rayon.

# en: Visible full quality within
mmdhl.lod.full.label=Qualité complète si visible jusqu'à

# en: Use the configured full solver iterations.
mmdhl.lod.full.tooltip=Utilise le nombre complet d'itérations configuré pour le solveur.

# en: Half quality within
mmdhl.lod.middle.label=Demi-qualité jusqu'à

# en: More distant active models use quarter quality.
mmdhl.lod.middle.tooltip=Les modèles actifs plus éloignés utilisent un quart de la qualité.

# en: Physics distance cutoff
mmdhl.lod.cutoff.label=Distance limite de la physique

# en: Slow, unheld models suspend beyond this distance.
mmdhl.lod.cutoff.tooltip=Les modèles lents et non tenus sont suspendus au-delà de cette distance.

# en: Invisible delay (seconds)
mmdhl.lod.hidden.label=Délai d'invisibilité (secondes)

# en: Suspend invisible slow-moving models after this delay.
mmdhl.lod.hidden.tooltip=Suspend les modèles lents invisibles après ce délai.

# en: Full quality speed (units/s)
mmdhl.lod.speed.label=Vitesse de qualité complète (unités/s)

# en: Any primary limb can request full quality.
mmdhl.lod.speed.tooltip=N'importe quel membre principal peut demander la qualité complète.

# en: Full quality rotation (deg/s)
mmdhl.lod.angular.label=Rotation de qualité complète (degrés/s)

# en: Fast rotation requests full quality.
mmdhl.lod.angular.tooltip=Une rotation rapide demande la qualité complète.

# en: Stretch protection (Experimental)
mmdhl.physics.stretch.title=Protection contre l'étirement (expérimental)

# en: Limit excessive stretching
mmdhl.physics.stretch.label=Limiter l'étirement excessif

# en: Default off. Limits excess separation without changing authored damping, masses or springs. World and prop contacts take priority.
mmdhl.physics.stretch.tooltip=Désactivé par défaut. Limite l'écartement excessif sans modifier l'amortissement, les masses ni les ressorts d'origine. Les contacts avec le monde et les objets sont prioritaires.

# en: Allowed stretch
mmdhl.physics.stretch_tolerance.label=Étirement autorisé

# en: Default 1. Lower values hold sleeve and hair attachments more tightly; higher values allow more separation before correction.
mmdhl.physics.stretch_tolerance.tooltip=Par défaut : 1. Des valeurs plus basses maintiennent plus fermement les attaches des manches et des cheveux ; des valeurs plus hautes autorisent plus d'écartement avant correction.

# en: Correction slides along world and prop surfaces. A compressed chain may temporarily exceed its stretch allowance to avoid being pushed through the ground.
mmdhl.physics.stretch.help=La correction glisse le long des surfaces du monde et des objets. Une chaîne comprimée peut temporairement dépasser sa marge d'étirement pour éviter d'être poussée à travers le sol.

# en: Performance
mmdhl.performance.title=Performances

# en: CPU threads (0 = automatic)
mmdhl.performance.workers.label=Threads CPU (0 = automatique)

# en: Automatic uses logical CPU threads minus two (all threads on CPUs with four or fewer). One lane is the calling thread. Changing this briefly waits for current jobs to finish.
mmdhl.performance.workers.tooltip=« Automatique » utilise le nombre de threads CPU logiques moins deux (tous les threads sur les CPU de quatre threads ou moins). L'une des voies est le thread appelant. La modification de ce réglage attend brièvement que les tâches en cours se terminent.

# en: Pause settled hair and clothing
mmdhl.performance.sleep.label=Mettre en pause les cheveux et vêtements au repos

# en: Default on. Movement automatically resumes simulation.
mmdhl.performance.sleep.tooltip=Activé par défaut. Tout mouvement relance automatiquement la simulation.

# en: Advanced performance settings
mmdhl.performance.advanced=Réglages de performances avancés

# en: Physics wait time (ms)
mmdhl.performance.wait.label=Temps d'attente de la physique (ms)

# en: Default 0 keeps rendering responsive. Waiting may present a newer completed secondary tick, but increases frame time.
mmdhl.performance.wait.tooltip=La valeur par défaut 0 garde le rendu réactif. Attendre peut afficher un tick secondaire terminé plus récent, mais augmente le temps d'image.

# en: Reuse prepared model geometry
mmdhl.performance.vertex_cache.label=Réutiliser la géométrie préparée des modèles

# en: Default on. Reuses geometry across rendering passes.
mmdhl.performance.vertex_cache.tooltip=Activé par défaut. Réutilise la géométrie d'une passe de rendu à l'autre.

# en: Compact vertex upload
mmdhl.performance.compact_vertices.label=Envoi compact des sommets

# en: Default on. Sends animated model vertices in half the size. Turn off if model shading looks wrong.
mmdhl.performance.compact_vertices.tooltip=Activé par défaut. Envoie les sommets animés des modèles dans un format deux fois plus petit. Désactivez-le si l'ombrage des modèles paraît incorrect.

# en: GPU skinning
mmdhl.performance.gpu_skinning.label=Skinning GPU

# en: Default on. The graphics card bends the models, as it does for Source models; the CPU only sends bone positions. Turn off if a model looks torn or misplaced.
mmdhl.performance.gpu_skinning.tooltip=Activé par défaut. La carte graphique déforme les modèles, comme pour les modèles Source ; le CPU n'envoie que les positions des os. Désactivez-le si un modèle paraît déchiré ou mal placé.

# en: Smooth tick-rate skeletons
mmdhl.performance.smooth_poses.label=Lisser les squelettes au rythme des ticks

# en: Default on. Characters posed over the network, such as NPCs driven by an animation player, only change at the server tick rate. This shows them one update behind, interpolated, so body and hair move every frame.
mmdhl.performance.smooth_poses.tooltip=Activé par défaut. Les personnages animés via le réseau, comme les PNJ pilotés par un lecteur d'animation, ne changent qu'au rythme des ticks du serveur. Ce réglage les affiche avec une mise à jour de retard, interpolés, pour que le corps et les cheveux bougent à chaque image.

# en: Pose update rate
mmdhl.performance.update_lod.label=Fréquence de mise à jour des poses

# en: Every frame for every model
mmdhl.performance.update_lod.every_frame=À chaque image pour chaque modèle

# en: Unseen models 10 times a second (default)
mmdhl.performance.update_lod.unseen=Modèles non visibles 10 fois par seconde (par défaut)

# en: Also small on-screen models 20-30 times a second
mmdhl.performance.update_lod.small=Aussi les petits modèles à l'écran 20 à 30 fois par seconde

# en: Default 1. Anything you can see, including its shadow, updates every frame; models drawn nowhere update 10 times a second. Setting 2 also slows small or distant models on screen, which can look stepped when they move.
mmdhl.performance.update_lod.tooltip=Par défaut : 1. Tout ce que vous voyez, y compris son ombre, est mis à jour à chaque image ; les modèles affichés nulle part sont mis à jour 10 fois par seconde. Le réglage 2 ralentit aussi les modèles petits ou éloignés à l'écran, ce qui peut paraître saccadé quand ils bougent.

# en: Correct lighting on overlapping surfaces
mmdhl.performance.flashlight_fix.label=Corriger l'éclairage des surfaces superposées

# en: Default on. Coincident surfaces receive one flashlight contribution; faces separated by animation remain visible.
mmdhl.performance.flashlight_fix.tooltip=Activé par défaut. Les surfaces confondues ne reçoivent qu'une seule contribution de la lampe torche ; les faces séparées par l'animation restent visibles.

# en: Resting movement threshold
mmdhl.performance.sleep_linear.label=Seuil de mouvement au repos

# en: Default 0.5. Bodies below both speed thresholds can go to sleep.
mmdhl.performance.sleep_linear.tooltip=Par défaut : 0,5. Les corps physiques sous les deux seuils de vitesse peuvent passer en veille.

# en: Resting rotation threshold
mmdhl.performance.sleep_angular.label=Seuil de rotation au repos

# en: Default 0.35.
mmdhl.performance.sleep_angular.tooltip=Par défaut : 0,35.

# en: Time at rest before sleep (seconds)
mmdhl.performance.sleep_seconds.label=Temps au repos avant la veille (secondes)

# en: Default 1.5.
mmdhl.performance.sleep_seconds.tooltip=Par défaut : 1,5.

# en: Movement needed to resume
mmdhl.performance.wake_drift.label=Mouvement nécessaire pour reprendre

# en: Default 0.02. Raising this permits more movement before a resting chain wakes.
mmdhl.performance.wake_drift.tooltip=Par défaut : 0,02. Une valeur plus élevée autorise plus de mouvement avant qu'une chaîne au repos ne se réveille.

# en: Diagnostics & recovery
mmdhl.debug.section=Diagnostic et récupération

# en: Show physics and performance overlay
mmdhl.debug.overlay=Afficher l'incrustation de physique et de performances

# en: Print a performance summary every five seconds
mmdhl.debug.print=Écrire un résumé des performances dans la console toutes les cinq secondes

# en: Write diagnostic report
mmdhl.debug.write_report=Enregistrer un rapport de diagnostic

# en: Reset physics for all models
mmdhl.physics.reset_all=Réinitialiser la physique de tous les modèles

# en: Clean up local ragdolls
mmdhl.physics.cleanup_ragdolls=Nettoyer les corps locaux

# en: Local ragdolls pause secondary physics while all Source bodies sleep, and resume when a body wakes. Cleanup affects only this client’s character model ragdolls.
mmdhl.physics.cleanup_help=Les corps locaux suspendent la physique secondaire tant que tous leurs corps physiques Source sont en veille, et la reprennent quand l'un d'eux se réveille. Le nettoyage ne concerne que les corps de personnages de ce client.

# en: Toggle physics on / off
mmdhl.physics.toggle=Activer / désactiver la physique

# en: Toggle physics shortcut (unassigned; Escape clears)
mmdhl.physics.toggle_shortcut=Raccourci pour activer / désactiver la physique (non assigné ; Esc l'efface)

# en: Reset all physics shortcut (unassigned; F8 is reserved for recording)
mmdhl.physics.reset_shortcut=Raccourci pour réinitialiser toute la physique (non assigné ; F8 est réservé à l'enregistrement)

# en: Restore Recommended Settings
mmdhl.physics.restore_defaults=Rétablir les réglages recommandés

# en: Recommended: Multicore CPU Processor, collisions with map and objects, adaptive quality and automatic CPU thread count.
mmdhl.physics.restore_help=Recommandé : Processeur CPU multicœur, collisions avec la carte et les objets, qualité adaptative et nombre automatique de threads CPU.

