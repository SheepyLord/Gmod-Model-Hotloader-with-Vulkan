mmdhl.ui.toolmenu.settings_help=Ces réglages s'appliquent à tous les personnages importés, y compris ceux déjà présents sur la carte.

# en: Spawn frozen (new placements only)
mmdhl.ui.toolmenu.spawn_frozen=Apparition gelée (nouveaux placements uniquement)

