mmdhl.ui.prop.dimensions={width} × {depth} × {height} unités (L × P × H)

# en: Freeze new props in place
mmdhl.ui.prop.freeze=Geler les nouveaux objets sur place

# en: Glossy highlights (all static props)
mmdhl.ui.prop.glossy=Reflets brillants (tous les objets statiques)

# en: Specular highlights approximated from each material’s roughness and metalness (Source has no PBR). Turn off if props look shiny or washed out; placed props update at once.
mmdhl.ui.tooltip.prop_glossy=Reflets spéculaires estimés à partir de la rugosité et de la métallicité de chaque matériau (Source n'a pas de PBR). Désactivez-les si les objets paraissent trop brillants ou délavés ; les objets placés se mettent à jour immédiatement.

# en: Collides with
mmdhl.ui.prop.collides_with=Collision avec

# en: Gravity
mmdhl.ui.prop.gravity=Gravité

# en: What newly placed props collide with. World only (default) lets players and other props pass through. To change a placed prop, hold C and right-click it.
mmdhl.ui.tooltip.prop_collide=Ce avec quoi les objets nouvellement placés entrent en collision. « Monde uniquement » (par défaut) laisse passer les joueurs et les autres objets. Pour modifier un objet placé, maintenez C et faites un clic droit dessus.

# en: A prop that collides with nothing has no gravity, or it would fall out of the map.
mmdhl.ui.tooltip.gravity_none=Un objet qui n'entre en collision avec rien n'a pas de gravité, sinon il tomberait hors de la carte.

# en: Whether newly placed props fall.
mmdhl.ui.tooltip.gravity=Indique si les objets nouvellement placés tombent.

# en: Surface material
mmdhl.ui.prop.surface=Matériau de surface

# en: What newly placed props are made of: their impact sounds, bullet marks, friction and bounce. The Static Prop tool uses the same choice.
mmdhl.ui.tooltip.prop_surface=La matière des objets nouvellement placés : sons d’impact, impacts de balles, frottement et rebond. L’outil « Objet statique » utilise le même choix.

# en: Spawn Prop
mmdhl.ui.spawn.prop=Faire apparaître l'objet

# en: Place at the surface you are aiming at. Use the Physics Gun to move it.
mmdhl.ui.tooltip.prop_spawn=Placer l'objet sur la surface que vous visez. Utilisez le pistolet physique pour le déplacer.

# en: Place with tool gun
mmdhl.ui.prop.tool=Placer avec le pistolet à outils

# en: Equip the Static Prop tool with this prop: left click places, right click attaches it to a character or prop, reload copies a placed prop.
mmdhl.ui.tooltip.prop_tool=Équiper l'outil Objet statique avec cet objet : le clic gauche le place, le clic droit l'attache à un personnage ou à un objet, le rechargement copie un objet placé.

# en: Edit parts…
mmdhl.ui.prop.edit_parts=Modifier les parties…

# en: Choose which materials or region of this model to keep, and save the result as a preset.
mmdhl.ui.tooltip.prop_parts=Choisir les matériaux ou la zone de ce modèle à conserver, puis enregistrer le résultat comme préréglage.

# en: Apply size to aimed prop
mmdhl.ui.prop.resize=Appliquer la taille à l'objet visé

# en: Resizing the prop you are aiming at...
mmdhl.ui.status.resizing=Redimensionnement de l'objet visé…

# en: Aim at a placed static prop, then apply this size. Keeps its position, motion and welds.
mmdhl.ui.tooltip.prop_resize=Visez un objet statique placé, puis appliquez cette taille. Sa position, son mouvement et ses soudures sont conservés.

# en: Import options (next import and Reimport)
mmdhl.ui.prop.import_options=Options d'importation (prochaine importation et réimportation)

# en: Up axis: automatic (Y up; FBX uses its own)
mmdhl.ui.prop.axis_auto=Axe vertical : automatique (Y vers le haut ; FBX indique le sien)

# en: Up axis: Y up
mmdhl.ui.prop.axis_y_up=Axe vertical : Y vers le haut

# en: Up axis: Z up
mmdhl.ui.prop.axis_z_up=Axe vertical : Z vers le haut

# en: Turn: none
mmdhl.ui.prop.turn_none=Rotation : aucune

# en: Turn: 90° left
mmdhl.ui.prop.turn_left=Rotation : 90° à gauche

# en: Turn: 180°
mmdhl.ui.prop.turn_around=Rotation : 180°

# en: Turn: 90° right
mmdhl.ui.prop.turn_right=Rotation : 90° à droite

# en: Collision: fast single hull (instant)
mmdhl.ui.prop.collision_hull=Collision : enveloppe unique rapide (calcul instantané)

# en: Collision: detailed, up to 16 hulls (slower)
mmdhl.ui.prop.collision_detailed=Collision : détaillée, jusqu'à 16 enveloppes (calcul plus lent)

# en: A single hull encloses the prop and fills holes. Detailed collision follows concave shapes such as arches and tables; it can take much longer.
mmdhl.ui.tooltip.import_collision=Une enveloppe unique entoure l'objet et comble les trous. La collision détaillée suit les formes concaves comme les arches et les tables ; elle peut prendre beaucoup plus de temps.

# en: Import scale
mmdhl.ui.prop.import_scale=Échelle d'importation

# en: Multiplies the file units. FBX, glTF and BLEND convert to Source units automatically; PMX matches imported characters; small OBJ files are treated as metres.
mmdhl.ui.tooltip.import_scale=Multiplie les unités du fichier. FBX, glTF et BLEND sont convertis automatiquement en unités Source ; PMX correspond aux personnages importés ; les petits fichiers OBJ sont considérés comme étant en mètres.

# en: Reimport selected with these options
mmdhl.ui.prop.reimport=Réimporter la sélection avec ces options

# en: This prop has no local source file to reimport. Import the file again.
mmdhl.ui.status.no_source=Cet objet n'a pas de fichier source local à réimporter. Importez à nouveau le fichier.

# en: Reimporting {name} with the current import options...
mmdhl.ui.status.reimporting=Réimportation de {name} avec les options d'importation actuelles…

# en: Share prop with server (admin)
mmdhl.ui.prop.share=Partager l'objet avec le serveur (admin)

# en: Sharing prop...
mmdhl.ui.status.sharing_prop=Partage de l'objet…

