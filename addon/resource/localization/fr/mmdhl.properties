mmdhl.terms.export_warning=Publier un paquet sur le Workshop redistribue chacun des modèles qu'il contient. Beaucoup de licences de modèles interdisent la redistribution, l'utilisation dans des jeux ou dans des contenus sexuels ou violents. N'exportez que des modèles dont les auteurs le permettent, et citez-les comme leurs conditions l'exigent.

# en: I have checked that each model's terms allow sharing it this way, and I take full responsibility for publishing them.
mmdhl.terms.export_accept=J'ai vérifié que les conditions de chaque modèle autorisent ce partage, et j'assume l'entière responsabilité de leur publication.

# en: Terms of use: {flagged} of {total} selected models mention restrictions and {missing} have none recorded. Check each model's terms before publishing.
