# en: Many models are released only for making videos with MikuMikuDance. Their terms often forbid using them in games or other software, sharing or re-uploading them, or showing them in sexual or violent content. Read the texts that came with the model below, and the page you downloaded it from, before you import it.
mmdhl.terms.import_warning=Beaucoup de modèles sont publiés uniquement pour réaliser des vidéos avec MikuMikuDance. Leurs conditions interdisent souvent de les utiliser dans des jeux ou d'autres logiciels, de les partager ou de les republier, ou de les montrer dans des contenus sexuels ou violents. Avant d'importer le modèle, lisez les textes fournis avec lui, ci-dessous, ainsi que la page d'où vous l'avez téléchargé.

# en: Model Hotloader cannot check or enforce a model's terms, and importing a model gives you no right to use it. You alone are responsible for making sure that everything you do with it follows its terms, its author's wishes and the law. The authors of Model Hotloader grant no rights to any model and accept no liability for how you use one.
mmdhl.terms.disclaimer=Model Hotloader ne peut ni vérifier ni faire respecter les conditions d'un modèle, et importer un modèle ne vous donne aucun droit de l'utiliser. Vous êtes seul responsable de vous assurer que tout ce que vous en faites respecte ses conditions, la volonté de son auteur et la loi. Les auteurs de Model Hotloader n'accordent aucun droit sur aucun modèle et déclinent toute responsabilité quant à l'usage que vous en faites.

# en: I have read the model's terms and take full responsibility for how I use it.
