mmdhl.ui.toolmenu.debug_report=Écrire un rapport de diagnostic dans la console

# en: Bind a key with: {command}. Worker CPU times are aggregate work, not frame wall time.
mmdhl.ui.toolmenu.debug_bind_help=Associer une touche avec : {command}. Les temps CPU des processus worker correspondent au travail cumulé, pas à la durée réelle d'une image.

# en: Static Props
mmdhl.ui.toolmenu.static_props=Objets statiques

# en: Import OBJ, FBX, GLB, GLTF, PMX and BLEND files as physics props in Q → External Models → Static Props.
mmdhl.ui.toolmenu.static_props_help=Importez des fichiers OBJ, FBX, GLB, GLTF, PMX et BLEND comme objets physiques dans Q → Modèles externes → Objets statiques.

