# Model Hotloader: fr translation.
# Each phrase follows the English it translates (# en:). An empty value keeps the English.
# Keep every {placeholder} unchanged; see docs/TRANSLATING.md.
#
# Glossary (English → French)
# Style — vouvoiement ; casse de phrase ; « » avec espaces insécables ; espace insécable avant : ; ? ! et % ; « … » en un seul caractère ; boutons à l'infinitif
# External Models — Modèles externes (onglet du menu des apparitions, titre de la bibliothèque)
# Character Models (tab) — Personnages (onglet ; page Utilitaires : Personnages)
# Static Props (tab) — Objets statiques (onglet ; page Utilitaires)
# In this map (tab) — Sur la carte
# Physics & Performance (tab) — Physique et performances
# Import Character Models — Importer des personnages
# Import Static Props — Importer des objets statiques
# Spawn Ragdoll — Faire apparaître un corps
# Spawn Friendly NPC / Hostile NPC — Faire apparaître un PNJ allié / hostile
# Use as Player Model — Utiliser comme modèle du joueur
# Spawn Prop — Faire apparaître l'objet
# Place with tool gun — Placer avec le pistolet à outils
# Apply size to aimed prop — Appliquer la taille à l'objet visé
# Edit parts… — Modifier les parties… (fenêtre « Modifier les parties · … »)
# Edit bodygroups… — Groupes de corps… (bouton de 150 px ; ouvre la fenêtre « Groupes de corps »)
# Import options / Import scale — Options d'importation / Échelle d'importation
# Import as character — Importer comme personnage
# Reimport — Réimporter
# Unfiled — Sans dossier
# Favorite / Unfavorite — Ajouter aux favoris / Retirer des favoris
# World only — Monde uniquement (mode de collision)
# Static Prop tool — outil Objet statique
# Multicore CPU Processor — Processeur CPU multicœur
# MMD Compatibility Processor — Processeur de compatibilité MMD
# Lightweight jiggle / Jiggle — Oscillation légère / Oscillation
# Full simulation — Simulation complète
# Detailed collision / fast single hull — Collision détaillée / enveloppe unique rapide
# character (model) — personnage (modèle de personnage)
# static prop — objet statique
# prop — objet (terme du jeu)
# ragdoll — corps (terme du jeu) ; posable ragdoll — corps articulé
# NPC — PNJ (terme du jeu)
# player model — modèle du joueur (terme du jeu)
# first-person arms / hands — bras / mains à la première personne
# bodygroup — groupe de corps (terme du jeu)
# preset — préréglage (terme du jeu)
# collision (shape) — collision (forme de collision)
# hull (convex) — enveloppe (convexe) ; collision hull — enveloppe de collision
# spring bones (VRM) — os à ressort
# collider — collisionneur
# physics body — corps physique
# joint — articulation
# bone / skeleton / humanoid — os / squelette / humanoïde
# rig — rig
# carrier — modèle porteur
# secondary physics — physique secondaire (cheveux, vêtements)
# expression / morph — expression
# flex (overflow) — expressions en surplus (curseurs qui ne tiennent pas dans le Manipulateur de visage)
# material / physics material — matériau / matériau physique
# mesh / vertex / triangle — maillage / sommet / triangle
# folder / subfolder — dossier / sous-dossier
# library — bibliothèque
# import (verb / noun) — importer / importation (« import » seulement dans « Annuler l'import »)
# share / publish — partager / publier
# approve / server-approved — approuver / approuvé par le serveur
# administrator (admin) — administrateur (admin)
# worker — processus worker (processus d'importation en arrière-plan)
# native package / module / release / runtime — paquet natif / module natif / version native / runtime natif
# licence / redistribution — licence / redistribution
# freeze / unfreeze — geler / dégeler (termes du jeu)
# units — unités (unités Source)
# solver iterations — itérations du solveur
# thread (CPU) — thread CPU
# overlay — incrustation
# Physics Gun — Pistolet physique (jeu)
# Tool Gun — pistolet à outils (jeu)
# Face Poser / Finger Poser / Eye Poser — Manipulateur de visage / Modification des doigts / Positionneur d'yeux (jeu)
# spawn / spawn menu / context menu — faire apparaître / menu des apparitions / menu contextuel (jeu)
# Utilities / Undo / Cleanup — Utilitaires / Annuler / Nettoyer (jeu)
# Tools / Construction / Weapons / Options — Outils / Construction / Armes / Paramètres (jeu)
# constraint / Weld / NoCollide — interaction / Souder / Pas de collision (jeu)
# Citizen / Combine — Citoyen / Cartel (jeu, Half-Life 2)
# gamemode / entity / duplication / map — mode de jeu / entité / duplication / carte (jeu)
# Gravity — Gravité (jeu)

