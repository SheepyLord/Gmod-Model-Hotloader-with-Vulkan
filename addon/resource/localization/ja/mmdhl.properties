mmdhl.install.error.restart_to_load=インストールを確認しました。修復したネイティブバイナリを読み込むには、Garry's Mod を完全に再起動してください。

# en: Files for {feature} now pass validation. Fully restart Garry's Mod to enable the repaired component.
mmdhl.install.error.restart_to_enable={feature} のファイルが検証に合格しました。修復したコンポーネントを有効にするには、Garry's Mod を完全に再起動してください。

# en: Native module could not load: {reason}. Check the Microsoft Visual C++ x64 Redistributable and reinstall the native package.
mmdhl.install.error.loader_failed=ネイティブモジュールを読み込めませんでした：{reason}。Microsoft Visual C++ x64 再頒布可能パッケージを確認し、ネイティブパッケージを再インストールしてください。

# en: This native release lacks installation verification. Install {recommended} and restart.
mmdhl.install.error.no_verification=このネイティブリリースには、インストールの検証機能がありません。{recommended} をインストールして再起動してください。

# en: A required game library did not become available after map startup. Restart the game or check Workshop for a compatibility update.
mmdhl.install.error.game_not_ready=マップの起動後も、必要なゲームライブラリが利用可能になりませんでした。ゲームを再起動するか、ワークショップで互換性アップデートを確認してください。

# en: This Garry's Mod build has not been tested with this native release ({libraries} changed). Model Hotloader runs anyway; if something misbehaves, check Workshop and GitHub for an update.
mmdhl.install.warning.game_untested=この Garry's Mod のビルドは、このネイティブリリースでは未検証です（{libraries} が変更されています）。Model Hotloader はそのまま動作します。問題があれば、ワークショップと GitHub で更新を確認してください。

# ===== File access for other addons (file_access.lua) =====

# en: File access for other addons
