# en: The VRM file refers to data stored beside it. Export it again as one self-contained .vrm file.
mmdhl.library.hint.vrm_external_buffer=この VRM ファイルは、横に置かれた別ファイルのデータを参照しています。単体で完結した .vrm ファイルとして再度エクスポートしてください。

# en: The VRM file is damaged or incomplete. Export it again from the original program and retry.
mmdhl.library.hint.vrm_damaged=VRM ファイルが破損しているか不完全です。元のプログラムから再度エクスポートして、もう一度お試しください。

# en: The file could not be read. Check that it still exists, is not open in another program, and that its folder is accessible.
mmdhl.library.hint.cannot_open=ファイルを読み込めませんでした。ファイルがまだ存在するか、他のプログラムで開かれていないか、フォルダーにアクセスできるかを確認してください。

# en: The file could not be parsed. Re-export it from its original program (GLB or FBX work best) and import again.
mmdhl.library.hint.parser=ファイルを解析できませんでした。元のプログラムから再エクスポートし（GLB か FBX が最適です）、もう一度インポートしてください。

# en: This is not a readable .blend file. Save it again in Blender, or export it as GLB or FBX.
mmdhl.library.hint.not_blend=読み込み可能な .blend ファイルではありません。Blender で保存し直すか、GLB または FBX としてエクスポートしてください。

# en: The file contains no mesh triangles; it may hold only an armature, cameras, lights, curves or text. In Blender, convert them with Object > Convert > Mesh.
mmdhl.library.hint.no_triangles=ファイルにメッシュの三角形がありません。アーマチュア、カメラ、ライト、カーブ、テキストだけが含まれている可能性があります。Blender の「オブジェクト > 変換 > メッシュ」で変換してください。

# en: The objects chosen at import were renamed or removed in Blender. Import the file again to choose objects.
mmdhl.library.hint.blend_objects_changed=インポート時に選んだオブジェクトが、Blender で名前を変更されたか削除されています。ファイルをもう一度インポートして、オブジェクトを選び直してください。

# en: The compressed .blend file is damaged or incomplete. Save it again in Blender (File > Save) and retry.
mmdhl.library.hint.blend_compressed=圧縮された .blend ファイルが破損しているか不完全です。Blender で保存し直して（ファイル > 保存）、もう一度お試しください。

# en: The file is incomplete, possibly still being written or copied. Save it again and retry.
mmdhl.library.hint.truncated=ファイルが不完全です。書き込みやコピーの途中かもしれません。保存し直して、もう一度お試しください。

# en: This .blend file uses data the importer cannot read. Open it in Blender and export the model as GLB or FBX.
mmdhl.library.hint.blend_unsupported=この .blend ファイルには、インポーターが読み込めないデータが使われています。Blender で開き、モデルを GLB または FBX としてエクスポートしてください。

# en: The model has too many materials (limit 128). Merge materials in the original program before importing.
mmdhl.library.hint.material_limit=モデルのマテリアルが多すぎます（上限128個）。インポートする前に、元のプログラムでマテリアルを統合してください。

# en: The file or its textures exceed the 256 MB limit. Reduce texture sizes or split the model.
mmdhl.library.hint.byte_limit=ファイルまたはテクスチャが上限の256 MB を超えています。テクスチャのサイズを小さくするか、モデルを分割してください。

# en: The geometry is too large for one prop. Split the model or decimate it.
mmdhl.library.hint.geometry_budget=1つのプロップとしてはジオメトリが大きすぎます。モデルを分割するか、ポリゴン数を削減してください。

# en: The PMX file is damaged or uses an unsupported version. PMX 2.0 and 2.1 are supported.
mmdhl.library.hint.pmx=PMX ファイルが破損しているか、非対応のバージョンです。対応しているのは PMX 2.0 と 2.1 です。

# en: The model is extremely small. Raise Import scale in Import options, then retry.
mmdhl.library.hint.too_small=モデルが極端に小さいです。「インポートオプション」の「インポート倍率」を上げて、もう一度お試しください。

# en: The model is extremely large. Lower Import scale in Import options, then retry.
mmdhl.library.hint.too_large=モデルが極端に大きいです。「インポートオプション」の「インポート倍率」を下げて、もう一度お試しください。

# en: The model sits very far from its origin. Move it to the origin in its original program.
mmdhl.library.hint.recenter=モデルが原点から非常に離れた位置にあります。元のプログラムで原点に移動してください。

# en: The importer stopped unexpectedly. The file may be damaged or use unsupported features.
mmdhl.library.hint.importer_exited=インポーターが予期せず停止しました。ファイルが破損しているか、非対応の機能が使われている可能性があります。

# en: The import took longer than five minutes. Use the fast collision option or a smaller model.
mmdhl.library.hint.timeout=インポートに5分以上かかりました。高速な当たり判定のオプションを使うか、より小さいモデルを使ってください。

# en: This file type is not supported here. Static props accept OBJ, FBX, GLB, GLTF, PMX and BLEND; PMD characters belong in Character Models.
mmdhl.library.hint.unsupported_type=このファイル形式はここでは使用できません。静的プロップが対応しているのは OBJ・FBX・GLB・GLTF・PMX・BLEND です。PMD のキャラクターは「キャラクターモデル」でインポートしてください。

# en: The skeleton could not be read. The model may be damaged; try re-saving it in PMX Editor.
mmdhl.library.hint.skeleton=スケルトンを読み込めませんでした。モデルが破損している可能性があります。PMX Editor で保存し直してみてください。

# en: Check the file in its original program, export it again and retry. Copy the details below when reporting the problem.
mmdhl.library.hint.default=元のプログラムでファイルを確認し、再度エクスポートしてもう一度お試しください。問題を報告するときは、下の詳細をコピーしてください。

# en: The spring-bone settings (swinging hair and clothes) are out of range or incomplete. Check them in the program that exported the VRM, then export it again.
mmdhl.library.hint.vrm_spring=スプリングボーン（揺れる髪や服）の設定が範囲外か不完全です。VRM を書き出したプログラムで設定を確認し、もう一度エクスポートしてください。

# en: The importer program (mmdhl_worker.exe) is missing. Install the native files of Model Hotloader again; the installation window lists what is missing.
mmdhl.library.hint.worker_missing=インポートプログラム（mmdhl_worker.exe）が見つかりません。Model Hotloader のネイティブファイルを入れ直してください。不足しているものはインストール画面に表示されます。

# en: On another player's server, Model Hotloader opens only models you choose in its file window, so the server's scripts cannot look through your files. Choose the model again with the import button; it can then be reloaded there too.
mmdhl.library.hint.remote_picked=他のプレイヤーのサーバーでは、サーバーのスクリプトがあなたのファイルを調べられないよう、Model Hotloader はファイルウィンドウで選んだモデルだけを開きます。インポートボタンからモデルを選び直してください。その後はそのサーバーでも再読み込みできます。

# en: Windows did not start the importer (mmdhl_worker.exe). Antivirus software may be blocking it: allow it, or install the native files again, then retry.
mmdhl.library.hint.worker_start=Windows がインポーター（mmdhl_worker.exe）を起動しませんでした。ウイルス対策ソフトがブロックしている可能性があります。許可するかネイティブファイルを入れ直してから、もう一度お試しください。

# en: The file is incomplete: it was probably cut off while downloading, copying or extracting. Download or extract the model again and import the new copy.
mmdhl.library.hint.pmx_truncated=ファイルが不完全です。ダウンロード・コピー・展開の途中で途切れた可能性があります。モデルをもう一度ダウンロードまたは展開して、新しいファイルをインポートしてください。

# en: Part of the file is damaged (see Where). Open the model in PMX Editor and save it again; if PMX Editor cannot open it either, download the model again.
mmdhl.library.hint.pmx_damaged=ファイルの一部が破損しています（「場所」を参照）。PMX Editor でモデルを開いて保存し直してください。PMX Editor でも開けない場合は、モデルをもう一度ダウンロードしてください。

# en: Open the model in PMX Editor and save it as PMX 2.0 or 2.1, then import it again.
mmdhl.library.hint.pmx_version=PMX Editor でモデルを開き、PMX 2.0 または 2.1 として保存してから、もう一度インポートしてください。

# en: The materials do not match the model's triangles. In PMX Editor, check the material named under Where (or delete it), save and import again.
mmdhl.library.hint.pmx_materials=材質がモデルの三角形と一致しません。PMX Editor で「場所」に示された材質を確認（または削除）し、保存してからもう一度インポートしてください。

# en: A value in the model is not a valid number. In PMX Editor, correct the value named under Where (or delete that element), save and import again.
mmdhl.library.hint.pmx_number=モデル内の値が有効な数値ではありません。PMX Editor で「場所」に示された値を修正（またはその要素を削除）し、保存してからもう一度インポートしてください。

# en: An element of the model points to one that does not exist. In PMX Editor, fix or delete the element named under Where, save and import again.
mmdhl.library.hint.pmx_reference=モデルの要素が存在しない要素を参照しています。PMX Editor で「場所」に示された要素を修正または削除し、保存してからもう一度インポートしてください。

# en: Extract the archive first (right-click › Extract All, or 7-Zip for RAR and 7z files), then import the .pmx, .pmd or .vrm file inside it.
mmdhl.library.hint.format_archive=先にアーカイブを展開し（右クリック › すべて展開、RAR や 7z は 7-Zip）、中にある .pmx・.pmd・.vrm ファイルをインポートしてください。

# en: Choose the character's model file (.pmx or .pmd) instead. Motion and pose files cannot be imported.
mmdhl.library.hint.format_motion=代わりにキャラクターのモデルファイル（.pmx または .pmd）を選んでください。モーションやポーズのファイルはインポートできません。

# en: Choose the model file (.pmx, .pmd or .vrm) instead. Its textures are loaded with it.
mmdhl.library.hint.format_image=代わりにモデルファイル（.pmx・.pmd・.vrm）を選んでください。テクスチャは一緒に読み込まれます。

# en: Rename the file so that it ends in {extension}, then import it again.
mmdhl.library.hint.format_renamed=ファイル名の末尾を {extension} に変更してから、もう一度インポートしてください。

# en: Make sure you chose the model file itself (.pmx, .pmd, .vrm, .fbx, .glb or .dae), not a readme, an image or an archive.
mmdhl.library.hint.format_unknown=readme や画像、アーカイブではなく、モデルファイルそのもの（.pmx・.pmd・.vrm・.fbx・.glb・.dae）を選んだか確認してください。

# en: The file was moved, renamed or deleted after it was chosen. Choose it again where it is now.
mmdhl.library.hint.io_missing=ファイルは選択後に移動・名前変更・削除されました。現在の場所からもう一度選んでください。

# en: Close programs that may have the file open (PMX Editor, an archive tool, cloud sync), then retry.
mmdhl.library.hint.io_locked=ファイルを開いている可能性のあるプログラム（PMX Editor、圧縮ツール、クラウド同期など）を閉じてから、もう一度お試しください。

# en: Windows denied access. Move the model to a normal folder such as Documents, or allow Garry's Mod in your antivirus software, then retry.
mmdhl.library.hint.io_denied=Windows がアクセスを拒否しました。モデルをドキュメントなどの通常のフォルダーに移すか、ウイルス対策ソフトで Garry's Mod を許可してから、もう一度お試しください。

# en: The drive reported an error or was disconnected. Copy the model to your own drive and import that copy.
mmdhl.library.hint.io_device=ドライブがエラーを報告したか、切断されました。モデルを自分のドライブにコピーし、そのコピーをインポートしてください。

# en: The file is empty. Wait until its download or sync has finished, or copy it again from the original.
mmdhl.library.hint.io_empty=ファイルが空です。ダウンロードや同期が終わるまで待つか、元のファイルからもう一度コピーしてください。

# en: The cache could not be written. Check free disk space, and that garrysmod/data/mmd_hotloader is not read-only or blocked by antivirus software.
mmdhl.library.hint.io_write=キャッシュに書き込めませんでした。ディスクの空き容量と、garrysmod/data/mmd_hotloader が読み取り専用になっていないか、ウイルス対策ソフトにブロックされていないかを確認してください。

# en: Free some space on the drive that holds Garry's Mod, then retry.
mmdhl.library.hint.io_disk_full=Garry's Mod があるドライブの空き容量を増やしてから、もう一度お試しください。

# en: Close other programs and retry. Very large models or textures need more memory; smaller textures help.
mmdhl.library.hint.memory=他のプログラムを閉じて、もう一度お試しください。非常に大きなモデルやテクスチャには多くのメモリが必要です。テクスチャを小さくすると改善します。

# en: The importer crashed on this file. It may be damaged or use something the importer cannot read: save it again in its original program and retry. Please copy the details below when reporting the problem.
mmdhl.library.hint.worker_crash=このファイルでインポーターがクラッシュしました。ファイルが破損しているか、インポーターが読めない内容を含んでいる可能性があります。元のプログラムで保存し直してから、もう一度お試しください。問題を報告するときは、下の詳細をコピーしてください。

# en: The file picker closed unexpectedly. Programs that add to Windows file dialogs (archive tools, cloud storage) can cause this. Try again, or choose the file from another folder.
mmdhl.library.hint.picker_crash=ファイルの選択画面が予期せず閉じました。Windows のファイルダイアログに機能を追加するプログラム（圧縮ツール、クラウドストレージなど）が原因になることがあります。もう一度試すか、別のフォルダーからファイルを選んでください。

# en: A texture file in the importer's cache is damaged or cannot be used. Delete the file shown under Where, then import the model again. If it happens again, save the model's textures again as PNG files in an image editor.
mmdhl.library.hint.texture_derivative=インポーターのキャッシュにあるテクスチャファイルが破損しているか、使用できません。「場所」に表示されたファイルを削除してから、もう一度モデルをインポートしてください。再び起きる場合は、画像編集ソフトでモデルのテクスチャを PNG として保存し直してください。

