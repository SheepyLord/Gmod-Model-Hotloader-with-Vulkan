mmdhl.library.warnings.hint_warnings=インポートは完了しており、モデルは使用できます。警告は見た目や動きに影響する場合があります。

# en: The import finished normally. These notes are for information only.
mmdhl.library.warnings.hint_notes=インポートは正常に完了しました。これらの注記は情報提供のみを目的としています。

