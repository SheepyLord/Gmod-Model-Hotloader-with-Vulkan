mmdhl.library.stage.pick=ファイルの選択

# en: The file ends too early; it is incomplete.
mmdhl.library.cause.truncated=ファイルが途中で終わっています。不完全なファイルです。

# en: Part of the model file is damaged and cannot be read.
mmdhl.library.cause.pmx_damaged=モデルファイルの一部が破損していて読み込めません。

# en: A name in the model file is not valid text.
mmdhl.library.cause.pmx_text=モデルファイル内の名前が有効なテキストではありません。

# en: This PMX version is not supported (PMX 2.0 and 2.1 are).
mmdhl.library.cause.pmx_version=この PMX バージョンには対応していません（対応は PMX 2.0 と 2.1）。

# en: The model's materials do not match its triangles.
mmdhl.library.cause.pmx_materials=モデルの材質が三角形と一致しません。

# en: A value in the model is not a valid number.
mmdhl.library.cause.pmx_number=モデル内の値が有効な数値ではありません。

# en: An element of the model points to one that does not exist.
mmdhl.library.cause.pmx_reference=モデルの要素が存在しない要素を参照しています。

# en: This is an archive, not a model file.
mmdhl.library.cause.format_archive=これはアーカイブで、モデルファイルではありません。

# en: This is an MMD motion, pose or project file, not a model.
mmdhl.library.cause.format_motion=これは MMD のモーション・ポーズ・プロジェクトのファイルで、モデルではありません。

# en: This is an image, not a model file.
mmdhl.library.cause.format_image=これは画像で、モデルファイルではありません。

# en: The file's name does not match its content.
mmdhl.library.cause.format_renamed=ファイル名と中身が一致しません。

# en: This file is not a model this importer can read.
mmdhl.library.cause.format_unknown=このインポーターが読めるモデルファイルではありません。

# en: The VRM file contains invalid or incomplete data.
mmdhl.library.cause.vrm_damaged=VRM ファイルに無効または不完全なデータがあります。

# en: The VRM humanoid map has no {bone} bone.
mmdhl.library.cause.vrm_humanoid=VRM のヒューマノイド設定に {bone} ボーンがありません。

# en: The VRM file refers to data stored in other files.
mmdhl.library.cause.vrm_external=VRM ファイルが別のファイルにあるデータを参照しています。

# en: The spring-bone settings are invalid.
mmdhl.library.cause.spring=スプリングボーンの設定が無効です。

# en: The file cannot be found.
mmdhl.library.cause.io_missing=ファイルが見つかりません。

# en: Another program is using the file.
mmdhl.library.cause.io_locked=他のプログラムがファイルを使用しています。

# en: Windows denied access to the file.
mmdhl.library.cause.io_denied=Windows がファイルへのアクセスを拒否しました。

# en: The drive could not read the file.
mmdhl.library.cause.io_device=ドライブからファイルを読み取れませんでした。

# en: The file could not be read.
mmdhl.library.cause.io_read=ファイルを読み込めませんでした。

# en: The file is empty.
mmdhl.library.cause.io_empty=ファイルが空です。

# en: The cache folder could not be written.
mmdhl.library.cause.io_write=キャッシュフォルダーに書き込めませんでした。

# en: The disk is full.
mmdhl.library.cause.io_disk_full=ディスクがいっぱいです。

# en: The importer ran out of memory.
mmdhl.library.cause.memory=インポーターのメモリが不足しました。

# en: The importer stopped unexpectedly (error {code}).
mmdhl.library.cause.worker_crash=インポーターが予期せず停止しました（エラー {code}）。

# en: A texture could not be converted for the game.
mmdhl.library.cause.texture=テクスチャをゲーム用に変換できませんでした。

# en: On another player's server, Model Hotloader opens only models chosen in its file window.
