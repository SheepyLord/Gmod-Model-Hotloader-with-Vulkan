mmdhl.install.error.loaded_runtime_mismatch=読み込まれたランタイムが、承認済みのインストールまたは想定される物理パスと一致しません。Garry's Mod を終了し、完全なパッケージを再インストールして再起動してください。

# en: Worker self-test failed. Reinstall native binaries and dependencies.
mmdhl.install.error.worker_failed=ワーカーのセルフテストに失敗しました。ネイティブバイナリと依存関係を再インストールしてください。

# en: Worker and runtime identities do not match the approved native release. Reinstall and restart.
mmdhl.install.error.worker_mismatch=ワーカーとランタイムの識別情報が、承認済みのネイティブリリースと一致しません。再インストールして再起動してください。

