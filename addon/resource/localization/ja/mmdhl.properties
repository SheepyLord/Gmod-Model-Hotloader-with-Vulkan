# en: File access for other addons needs a newer Model Hotloader binary module (2.3.0 or later). Everything else keeps working.
mmdhl.file_access.needs_update=他のアドオンへのファイルアクセスには、新しい Model Hotloader バイナリモジュール（2.3.0 以降）が必要です。その他の機能はそのまま使えます。

# en: Addons can ask to read your files only in single player and on servers you host. On other servers, scripts come from the server, so Model Hotloader refuses.
mmdhl.file_access.unavailable_remote=アドオンがファイルの読み取りを求められるのは、シングルプレイと自分がホストするサーバーだけです。他のサーバーではスクリプトがサーバーから送られてくるため、Model Hotloader は拒否します。

# en: File access for other addons needs Model Hotloader's server part, which did not load. Open the installation window for details.
mmdhl.file_access.unavailable_server_realm=他のアドオンへのファイルアクセスには Model Hotloader のサーバー側の部分が必要ですが、読み込まれていません。詳しくはインストールウィンドウを開いてください。

# en: File access for other addons is turned off (Utilities → User → Character Models → File access for other addons…).
mmdhl.file_access.unavailable_disabled=他のアドオンへのファイルアクセスはオフになっています（ユーティリティ → ユーザー → キャラクターモデル → 他のアドオンへのファイルアクセス…）。

# en: The Model Hotloader worker (mmdhl_worker.exe) is missing. Reinstall the binary module.
mmdhl.file_access.unavailable_worker=Model Hotloader のワーカー（mmdhl_worker.exe）が見つかりません。バイナリモジュールを再インストールしてください。

