# en: Accept and import
mmdhl.terms.import_confirm=同意してインポート

# en: The installed native module cannot read readme files; update Model Hotloader to see them here.
mmdhl.terms.needs_native=インストールされているネイティブモジュールは Readme を読み込めません。ここに表示するには Model Hotloader を更新してください。

# en: no terms recorded (imported with an older version); check them yourself
mmdhl.terms.export_no_record=規約の記録なし（旧バージョンでインポート）。ご自身で確認してください

# en: no restrictions found in its texts; check its terms yourself
mmdhl.terms.export_no_topics=テキストに制限は見つかりませんでした。規約はご自身で確認してください

# en: VRM licence forbids redistribution
mmdhl.terms.export_vrm_prohibited=VRM ライセンスで再配布禁止

# en: Terms of use of the exported models
mmdhl.terms.export_title=エクスポートするモデルの利用規約

# en: Only publish models you are allowed to share
mmdhl.terms.export_heading=共有が認められているモデルだけを公開してください

# en: Publishing a package on the Workshop redistributes every model in it. Many model licences forbid redistribution, use in games, or use in sexual or violent content. Export only models whose authors allow this, and credit them as their terms require.
mmdhl.terms.export_warning=ワークショップでパッケージを公開すると、中のモデルをすべて再配布することになります。多くのモデルのライセンスは、再配布、ゲームでの使用、性的表現や暴力表現での使用を禁止しています。作者が認めているモデルだけをエクスポートし、規約どおりにクレジットを記載してください。

# en: I have checked that each model's terms allow sharing it this way, and I take full responsibility for publishing them.
mmdhl.terms.export_accept=各モデルの規約がこの方法での共有を認めていることを確認しました。公開についてすべての責任を負います。

# en: Terms of use: {flagged} of {total} selected models mention restrictions and {missing} have none recorded. Check each model's terms before publishing.
mmdhl.terms.export_summary=利用規約：選択したモデル {total} 件のうち {flagged} 件は制限に触れており、{missing} 件は規約の記録がありません。公開する前に各モデルの規約を確認してください。

# en: Terms of use: {name}
mmdhl.terms.view_title=利用規約：{name}

# en: These texts came with the Workshop package "{title}".
mmdhl.terms.from_package=これらのテキストはワークショップパッケージ「{title}」に含まれていたものです。

# en: These texts were found with {file} when it was imported.
mmdhl.terms.from_file=これらのテキストは {file} のインポート時に見つかったものです。

# en: You are responsible for following this model's terms
mmdhl.terms.view_heading=このモデルの規約を守る責任はあなたにあります

# en: No texts were recorded for this model. Check its terms on the page you downloaded it from.
mmdhl.terms.view_none=このモデルのテキストは記録されていません。ダウンロード元のページで規約を確認してください。

# en: Terms of use mention: {topics}
mmdhl.terms.button_topics=利用規約の記載：{topics}

# en: Terms of use
mmdhl.terms.button=利用規約

# en: No terms of use found; check the model's download page
mmdhl.terms.button_none=利用規約が見つかりません。ダウンロード元を確認してください

# en: Show the readme, licence and comments this model came with
mmdhl.terms.button_tip=このモデルに付属していた Readme・ライセンス・コメントを表示します

# en: Ask me to accept a model's terms of use before importing it
mmdhl.terms.setting_import=インポート前にモデルの利用規約への同意を求める

# en: Ask me to confirm sharing rights before exporting a package
mmdhl.terms.setting_export=パッケージのエクスポート前に共有の権利を確認する

# en: Many models may only be used for videos; their terms often forbid games, sharing, sexual or violent content. You are responsible for following each model's terms.
mmdhl.terms.setting_help=多くのモデルは動画での使用しか認められておらず、規約でゲーム、共有、性的表現や暴力表現を禁止していることがよくあります。各モデルの規約を守る責任はあなたにあります。

# ===== Translated model names (names.lua) =====

# en: {translation} ({original})
mmdhl.names.both={translation}（{original}）

# en: Original name: {name}
mmdhl.names.original=元の名前：{name}

# en: Show this model's names in my language
mmdhl.names.import_translate=このモデルの名前を自分の言語で表示する

# en: The model's name and the names of its parts and expressions are sent to Google Translate. Translations appear when they arrive. Your choice is kept for the next import; switch translation off completely in Physics & Performance.
mmdhl.names.import_note=モデル名と、パーツ・表情の名前が Google 翻訳に送信されます。翻訳は届きしだい表示されます。この選択は次のインポートにも使われます。翻訳を完全にオフにするには「物理・パフォーマンス」で設定してください。

# en: Model name translation
mmdhl.names.setting_title=モデル名の翻訳

# en: Translate names from models into my language
mmdhl.names.setting_label=モデルに含まれる名前を自分の言語に翻訳する

# en: Model, part and expression names are sent to Google Translate and saved on this computer once translated. Off: names show as written in the model files and nothing is sent.
mmdhl.names.setting_tooltip=モデル・パーツ・表情の名前が Google 翻訳に送信され、翻訳結果はこのコンピューターに保存されます。オフにすると、名前はモデルファイルのまま表示され、何も送信されません。

# en: Translations appear when they arrive and never delay imports or spawning. Names of models imported with translation unticked are never sent.
mmdhl.names.setting_help=翻訳は届きしだい表示され、インポートやスポーンを遅らせることはありません。翻訳のチェックを外してインポートしたモデルの名前は送信されません。

# en: Google Translate is not answering right now. Names show as written in the model files; translation is retried later.
mmdhl.names.status_unavailable=現在 Google 翻訳から応答がありません。名前はモデルファイルのまま表示され、翻訳は後で再試行されます。

# en: Model Hotloader can show the names in your models (model, parts, expressions) in your language by sending them to Google Translate. Nothing is sent until you choose.
mmdhl.names.notice=Model Hotloader は、モデルに含まれる名前（モデル・パーツ・表情）を Google 翻訳に送信して、あなたの言語で表示できます。選ぶまで何も送信されません。

# en: Translate names
mmdhl.names.notice_accept=名前を翻訳する

# en: Keep original names
mmdhl.names.notice_decline=元の名前のままにする
