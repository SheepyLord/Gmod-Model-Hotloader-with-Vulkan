# Model Hotloader: ja translation.
# Each phrase follows the English it translates (# en:). An empty value keeps the English.
# Keep every {placeholder} unchanged; see docs/TRANSLATING.md.
#
# Glossary (English → 日本語)
# External Models — 外部モデル（スポーンメニューのタブ名、ライブラリウィンドウのタイトル）
# Character Models (tab) — キャラクターモデル
# Static Props (tab) — 静的プロップ
# In this map (tab) — このマップ内
# Physics & Performance (tab) — 物理・パフォーマンス
# Import Character Models — キャラクターをインポート（220 px のボタン）
# Import Static Props — 静的プロップをインポート
# Spawn Ragdoll — ラグドールをスポーン
# Spawn Friendly NPC / Spawn Hostile NPC — 友好 NPC をスポーン / 敵対 NPC をスポーン
# Use as Player Model — プレイヤーモデルに使用
# Spawn Prop — プロップをスポーン
# Place with tool gun — ツールガンで配置
# Apply size to aimed prop — サイズを照準先に適用
# Edit parts… — パーツ編集…
# Edit bodygroups… — ボディグループ編集…
# Import as character — キャラとしてインポート（170 px のボタン。質問ダイアログのボタンは「キャラクターとしてインポート」）
# Import options / Import scale — インポートオプション / インポート倍率
# World only (collision mode) — ワールドのみ
# Collides with — 衝突対象
# Static Prop tool — 静的プロップツール
# character (model) — キャラクター（モデル）。数えるときは「体」
# static prop — 静的プロップ
# prop — プロップ（ゲームの用語）
# ragdoll — ラグドール（ゲームの用語）
# NPC — NPC
# player model — プレイヤーモデル（ゲームの用語）
# bodygroup — ボディグループ（ゲームの用語）
# preset — プリセット（ゲームの用語）
# as authored — 作者設定どおり（モデル作者が設定した状態）
# collision (shape) — 当たり判定（の形状）（ゲームの「当たり判定なし」に合わせる）
# hull — 凸包（convex hull）
# physics body — 剛体（MMD の用語）
# joint — ジョイント（MMD の用語）
# bone / skeleton / rig — ボーン / スケルトン / リグ
# spring bones — スプリングボーン（VRM）
# secondary physics / hair and clothing physics — 髪・服の物理演算 / 髪や服の物理演算
# jiggle / Lightweight jiggle — 簡易揺れ / 軽量な簡易揺れ
# Full simulation — フルシミュレーション
# physics — 物理演算（短いラベルでは「物理」）
# physics processor — 物理演算プロセッサ
# iterations — 反復（「反復10回」）
# expression / morph — 表情（MMD のモーフ。ゲームの「顔のポーズ」も「表情」）
# flex — フレックス（ゲームの用語）
# overflow (expressions) — 枠外（顔のポーズの枠に収まらない表情）
# material — マテリアル（ゲームの用語。MMD の「材質」）
# vertices / triangles — 頂点 / 三角形
# folder — フォルダー
# Unfiled — 未分類
# library — ライブラリ
# import / reimport — インポート / 再インポート
# source file / source path — 元ファイル / 元ファイルのパス
# share / publish — 共有 / 公開
# approve / approved — 承認 / 承認済み
# favorite / unfavorite — お気に入りに追加 / お気に入り解除
# delete — 削除（ディスクから消える操作）
# remove — 除去（リストやマップから外すだけで、ファイルは消えない）
# attach / detach — 取り付け / 取り外し
# aim / aimed — 照準を合わせる / 照準先
# freeze / unfreeze — 固定 / 固定解除（ゲームのフィジックガンのヒントに合わせる）
# units — ユニット（Source の距離単位）
# worker — ワーカー（バックグラウンドのインポート処理）
# native package / native module / native release — ネイティブパッケージ / ネイティブモジュール / ネイティブリリース
# administrator (admin) — 管理者（ゲームの用語）
# warnings / notes — 警告 / 注記
# Physics Gun — フィジックガン（ゲームの武器名）
# Tool Gun — ツールガン（ゲームの用語）
# Face Poser / Finger Poser / Eye Poser — 顔のポーズ / 指のポーズ / 目のポーズ（ゲームのツール名）
# spawn menu / context menu — スポーンメニュー / コンテキストメニュー（ゲームの用語）
# Utilities / Undo / Cleanup — ユーティリティ / 元に戻す / クリーンアップ（ゲームの用語）
# Weld / NoCollide / constraint — 溶接 / 当たり判定なし / コンストレイント（ゲームの用語）
# duplication — 複製（ゲームのコピー機ツールの用語）
# Workshop / Weapons / Tools / Construction — ワークショップ / 武器 / ツール / 建設（ゲームの用語）
# spawn / gravity / entity / gamemode — スポーン / 重力 / エンティティ / ゲームモード（ゲームの用語）
# Citizen / Combine — 市民 / コンバイン（ゲームの NPC 名）
# map / server / console / default — マップ / サーバー / コンソール / デフォルト（ゲームの用語）
# Style — 文章はです／ます調、ボタンとラベルは簡潔な体言・動詞句。名前は「」で囲む。英字と和文の間は半角スペース、数字と助数詞の間は詰める

