# ===== Physics & Performance tab of the library window (physics_settings.lua) =====

# en: Physics & Performance
mmdhl.physics.title=物理・パフォーマンス

# en: Settings apply to all imported characters and are saved automatically. These controls affect hair, clothing and accessories.
mmdhl.physics.intro=設定はインポートしたすべてのキャラクターに適用され、自動的に保存されます。これらの項目は髪、服、アクセサリーに影響します。

# en: Physics: Off
mmdhl.physics.status.off=物理演算：オフ

# en: Physics: Lightweight jiggle
mmdhl.physics.status.jiggle=物理演算：軽量な簡易揺れ

# en: Physics: Full simulation ({count})
mmdhl.physics.status.full=物理演算：フルシミュレーション（{count}）

# en: CPU threads: {count}
mmdhl.physics.status.threads=CPU スレッド：{count}

# en: CPU threads: automatic
mmdhl.physics.status.threads_automatic=CPU スレッド：自動

# en: Restart GMod to load the updated physics module.
mmdhl.physics.error.restart_required=更新された物理演算モジュールを読み込むには、GMod を再起動してください。

# en: Physics settings could not be applied.
mmdhl.physics.error.apply_failed=物理演算の設定を適用できませんでした。

# en: Worker count could not be applied.
mmdhl.physics.error.workers_failed=ワーカー数を適用できませんでした。

# en: Physics processor
mmdhl.physics.backend.label=物理演算プロセッサ

# en: Multicore CPU Processor is recommended. Vulkan GPU Processor solves on the graphics card and needs the DXVK renderer to keep up; with few CPU threads it can still fall behind at high accuracy. MMD Compatibility favors original motion. OpenCL is experimental and may be slower.
mmdhl.physics.backend.tooltip=「マルチコア CPU プロセッサ」を推奨します。「Vulkan GPU プロセッサ」はグラフィックカードで計算し、処理が追いつくには DXVK レンダラーが必要です。CPU のスレッドが少ないと、高い精度では遅れることがあります。「MMD 互換プロセッサ」は元の動きの再現を優先します。OpenCL は実験的な機能で、遅くなる場合があります。

# en: Hair and clothing collide with
mmdhl.physics.collision.label=髪や服の衝突対象

# en: World
mmdhl.physics.collide.world=ワールド

# en: The map: walls, floors, stairs and other fixed geometry.
mmdhl.physics.collide.world_tooltip=マップ：壁、床、階段などの固定された地形。

# en: Character
mmdhl.physics.collide.character=キャラクター

# en: The character's own body, so hair and clothing stay outside it.
mmdhl.physics.collide.character_tooltip=キャラクター自身の体。髪や服が体の中に入り込みません。

# en: Objects
mmdhl.physics.collide.objects=オブジェクト

# en: Props, ragdolls, vehicles and other characters. Hair and clothing react to them without pushing them.
mmdhl.physics.collide.objects_tooltip=プロップ、ラグドール、乗り物、ほかのキャラクター。髪や服はこれらに反応しますが、押し動かしはしません。

# en: Living players
mmdhl.physics.collide.players=生きているプレイヤー

# en: Players who are alive, as simple collision boxes. A player model never collides with its own player.
mmdhl.physics.collide.players_tooltip=生きているプレイヤー（簡易な当たり判定の箱として）。プレイヤーモデルが自分のプレイヤーと衝突することはありません。

# en: Living NPCs
mmdhl.physics.collide.npcs=生きている NPC

# en: NPCs and NextBots that are alive, as simple collision boxes. Dead ones become ragdolls, which count as objects.
mmdhl.physics.collide.npcs_tooltip=生きている NPC と NextBot（簡易な当たり判定の箱として）。倒されるとラグドールになり、オブジェクトとして扱われます。

# en: Spawn frozen (new placements only)
mmdhl.physics.spawn_frozen.label=固定してスポーン（新規配置のみ）

# en: Existing limbs keep their current frozen state.
mmdhl.physics.spawn_frozen.tooltip=既存の手足は、現在の固定状態のままです。

# en: Physics accuracy — Off
mmdhl.physics.accuracy.off=物理演算の精度 — オフ

# en: Physics accuracy — Jiggle
mmdhl.physics.accuracy.jiggle=物理演算の精度 — 簡易揺れ

# en: Physics accuracy — {count} iterations
mmdhl.physics.accuracy.iterations=物理演算の精度 — 反復{count}回

# en: −1: Off · 0: Jiggle · Levels 1–7: 1, 2, 5, 10, 20, 50, 100 iterations. Default: level 4 (10 iterations).
mmdhl.physics.accuracy.tooltip=−1：オフ · 0：簡易揺れ · レベル1～7：反復1、2、5、10、20、50、100回。デフォルト：レベル4（反復10回）。

# en: −1: Off · 0: Jiggle · 1–7: Full physics (1, 2, 5, 10, 20, 50, 100 iterations). Jiggle moves only each chain’s first bone; children follow without bending independently. VRM spring bones run fully at every level except Off.
mmdhl.physics.accuracy.help=−1：オフ · 0：簡易揺れ · 1～7：フル物理演算（反復1、2、5、10、20、50、100回）。簡易揺れでは各チェーンの最初のボーンだけが動き、子ボーンは個別に曲がらずに追従します。VRM のスプリングボーンは、オフ以外のすべてのレベルで完全に動作します。

# en: Gravity multiplier
mmdhl.physics.gravity.label=重力の倍率

# en: Default 1. Scales the gravity of the character model's own physics; Source ragdoll gravity is unchanged.
mmdhl.physics.gravity.tooltip=デフォルトは1。キャラクターモデル自身の物理演算の重力を拡大縮小します。Source のラグドールの重力は変わりません。

# en: Motion damping
mmdhl.physics.damping.label=動きの減衰

# en: Default 1. Higher values make motion settle faster. Zero removes damping.
mmdhl.physics.damping.tooltip=デフォルトは1。値を大きくすると、動きが早く落ち着きます。0にすると減衰がなくなります。

# en: VRM: hair and clothing keep their shape while moving
mmdhl.physics.vrm_damping.label=VRM：移動中も髪や服の形を保つ

# en: Default on. VRM spring bones damp motion against the character's hips instead of the world, so walking or a thrown ragdoll no longer drags hair and skirts behind; starting, stopping and turning still swing them. Off gives the plain VRM behaviour.
mmdhl.physics.vrm_damping.tooltip=デフォルトはオン。VRM のスプリングボーンが、ワールドではなくキャラクターの腰を基準に動きを減衰させるため、歩いたりラグドールを投げたりしても髪やスカートが後ろに引きずられなくなります。動き出し、停止、方向転換では引き続き揺れます。オフにすると、通常の VRM の挙動になります。

# en: Adaptive physics
mmdhl.lod.title=適応型物理演算

# en: Adaptive physics quality
mmdhl.lod.enabled.label=適応型の物理演算品質

# en: Reduce iterations or suspend secondary physics for distant or unseen slow-moving characters.
mmdhl.lod.enabled.tooltip=遠くにいる、または見えていない低速のキャラクターは、反復回数を減らすか、髪・服の物理演算を一時停止します。

# en: Distance and visibility settings
mmdhl.lod.advanced=距離と可視性の設定

# en: Always full quality within (units)
mmdhl.lod.near.label=常にフル品質にする距離（ユニット）

# en: Visibility never reduces quality inside this range.
mmdhl.lod.near.tooltip=この範囲内では、見えているかどうかで品質を下げることはありません。

# en: Visible full quality within
mmdhl.lod.full.label=見えていればフル品質にする距離

# en: Use the configured full solver iterations.
mmdhl.lod.full.tooltip=設定したフル品質の反復回数を使用します。

# en: Half quality within
mmdhl.lod.middle.label=半分の品質にする距離

# en: More distant active models use quarter quality.
mmdhl.lod.middle.tooltip=それより遠くで動いているモデルは、4分の1の品質になります。

# en: Physics distance cutoff
mmdhl.lod.cutoff.label=物理演算を打ち切る距離

# en: Slow, unheld models suspend beyond this distance.
mmdhl.lod.cutoff.tooltip=フィジックガンで掴まれていない低速のモデルは、この距離より遠くで一時停止します。

# en: Invisible delay (seconds)
mmdhl.lod.hidden.label=見えなくなってからの待ち時間（秒）

# en: Suspend invisible slow-moving models after this delay.
mmdhl.lod.hidden.tooltip=見えていない低速のモデルは、この時間が経過すると一時停止します。

# en: Full quality speed (units/s)
mmdhl.lod.speed.label=フル品質にする速度（ユニット/秒）

# en: Any primary limb can request full quality.
mmdhl.lod.speed.tooltip=主要な部位のどれか1つでもこの速度を超えると、フル品質になります。

# en: Full quality rotation (deg/s)
mmdhl.lod.angular.label=フル品質にする回転速度（度/秒）

# en: Fast rotation requests full quality.
mmdhl.lod.angular.tooltip=速く回転しているとフル品質になります。

# en: Stretch protection (Experimental)
mmdhl.physics.stretch.title=伸び防止（実験的）

# en: Limit excessive stretching
mmdhl.physics.stretch.label=過度な伸びを制限

# en: Default off. Limits excess separation without changing authored damping, masses or springs. World and prop contacts take priority.
mmdhl.physics.stretch.tooltip=デフォルトはオフ。作者が設定した減衰、質量、バネを変えずに、過度な離れを制限します。ワールドやプロップとの接触が優先されます。

# en: Allowed stretch
mmdhl.physics.stretch_tolerance.label=許容する伸び

# en: Default 1. Lower values hold sleeve and hair attachments more tightly; higher values allow more separation before correction.
mmdhl.physics.stretch_tolerance.tooltip=デフォルトは1。値を小さくすると袖や髪の接続部をより強く保持し、大きくすると補正が入るまでにより大きな離れを許容します。

# en: Correction slides along world and prop surfaces. A compressed chain may temporarily exceed its stretch allowance to avoid being pushed through the ground.
mmdhl.physics.stretch.help=補正はワールドやプロップの表面に沿って行われます。圧縮されたチェーンは、地面に押し込まれるのを防ぐため、一時的に伸びの許容量を超えることがあります。

# en: Performance
mmdhl.performance.title=パフォーマンス

# en: CPU threads (0 = automatic)
mmdhl.performance.workers.label=CPU スレッド数（0 = 自動）

# en: Automatic uses logical CPU threads minus two (all threads on CPUs with four or fewer). One lane is the calling thread. Changing this briefly waits for current jobs to finish.
mmdhl.performance.workers.tooltip=「自動」では、論理 CPU スレッド数から2を引いた数を使います（4スレッド以下の CPU ではすべてのスレッドを使用）。レーンの1つは呼び出し元のスレッドです。変更すると、実行中のジョブが終わるまで少し待ちます。

# en: Pause settled hair and clothing
mmdhl.performance.sleep.label=落ち着いた髪や服を一時停止

# en: Default on. Movement automatically resumes simulation.
mmdhl.performance.sleep.tooltip=デフォルトはオン。動きがあると、自動的にシミュレーションを再開します。

# en: Advanced performance settings
mmdhl.performance.advanced=パフォーマンスの詳細設定

# en: Physics wait time (ms)
mmdhl.performance.wait.label=物理演算の待ち時間（ms）

# en: Default 0 keeps rendering responsive. Waiting may present a newer completed secondary tick, but increases frame time.
mmdhl.performance.wait.tooltip=デフォルトの0では、描画の応答性を保ちます。待つと、より新しく完了した物理演算のステップを表示できる場合がありますが、フレーム時間が増えます。

# en: Reuse prepared model geometry
mmdhl.performance.vertex_cache.label=準備済みのモデルジオメトリを再利用

# en: Default on. Reuses geometry across rendering passes.
mmdhl.performance.vertex_cache.tooltip=デフォルトはオン。描画パス間でジオメトリを再利用します。

# en: Compact vertex upload
mmdhl.performance.compact_vertices.label=頂点のコンパクト転送

# en: Default on. Sends animated model vertices in half the size. Turn off if model shading looks wrong.
mmdhl.performance.compact_vertices.tooltip=デフォルトはオン。アニメーションするモデルの頂点を半分のサイズで送ります。モデルの陰影がおかしい場合はオフにしてください。

# en: GPU skinning
mmdhl.performance.gpu_skinning.label=GPU スキニング

# en: Default on. The graphics card bends the models, as it does for Source models; the CPU only sends bone positions. Turn off if a model looks torn or misplaced.
mmdhl.performance.gpu_skinning.tooltip=デフォルトはオン。Source のモデルと同様に、グラフィックカードがモデルを変形させ、CPU はボーンの位置だけを送ります。モデルが裂けたりずれたりして見える場合はオフにしてください。

# en: Smooth tick-rate skeletons
mmdhl.performance.smooth_poses.label=ティックレートのスケルトンを補間

# en: Default on. Characters posed over the network, such as NPCs driven by an animation player, only change at the server tick rate. This shows them one update behind, interpolated, so body and hair move every frame.
mmdhl.performance.smooth_poses.tooltip=デフォルトはオン。アニメーションプレイヤーで動かす NPC など、ネットワーク経由でポーズが付くキャラクターは、サーバーのティックレートでしか変化しません。この設定では1更新分遅らせて補間表示するため、体や髪が毎フレーム動きます。

# en: Pose update rate
mmdhl.performance.update_lod.label=ポーズの更新頻度

# en: Every frame for every model
mmdhl.performance.update_lod.every_frame=すべてのモデルを毎フレーム

# en: Unseen models 10 times a second (default)
mmdhl.performance.update_lod.unseen=見えないモデルは毎秒10回（デフォルト）

# en: Also small on-screen models 20-30 times a second
mmdhl.performance.update_lod.small=画面上の小さなモデルも毎秒20～30回

# en: Default 1. Anything you can see, including its shadow, updates every frame; models drawn nowhere update 10 times a second. Setting 2 also slows small or distant models on screen, which can look stepped when they move.
mmdhl.performance.update_lod.tooltip=デフォルトは1。影も含めて見えているものはすべて毎フレーム更新され、どこにも描画されないモデルは毎秒10回更新されます。設定2では画面上の小さなモデルや遠くのモデルも更新を減らすため、動くとカクついて見えることがあります。

# en: Correct lighting on overlapping surfaces
mmdhl.performance.flashlight_fix.label=重なった面のライティングを補正

# en: Default on. Coincident surfaces receive one flashlight contribution; faces separated by animation remain visible.
mmdhl.performance.flashlight_fix.tooltip=デフォルトはオン。重なっている面はフラッシュライトの照明を1回分だけ受けます。アニメーションで離れた面は引き続き表示されます。

# en: Resting movement threshold
mmdhl.performance.sleep_linear.label=静止判定の移動しきい値

# en: Default 0.5. Bodies below both speed thresholds can go to sleep.
mmdhl.performance.sleep_linear.tooltip=デフォルトは0.5。両方の速度しきい値を下回った剛体はスリープできます。

# en: Resting rotation threshold
mmdhl.performance.sleep_angular.label=静止判定の回転しきい値

# en: Default 0.35.
mmdhl.performance.sleep_angular.tooltip=デフォルトは0.35。

# en: Time at rest before sleep (seconds)
mmdhl.performance.sleep_seconds.label=スリープまでの静止時間（秒）

# en: Default 1.5.
mmdhl.performance.sleep_seconds.tooltip=デフォルトは1.5。

# en: Movement needed to resume
mmdhl.performance.wake_drift.label=再開に必要な移動量

# en: Default 0.02. Raising this permits more movement before a resting chain wakes.
mmdhl.performance.wake_drift.tooltip=デフォルトは0.02。値を上げると、静止したチェーンが起きるまでにより大きな移動を許容します。

# en: Diagnostics & recovery
mmdhl.debug.section=診断と復旧

# en: Show physics and performance overlay
mmdhl.debug.overlay=物理演算とパフォーマンスのオーバーレイを表示

# en: Print a performance summary every five seconds
mmdhl.debug.print=5秒ごとにパフォーマンスの概要を出力

# en: Write diagnostic report
mmdhl.debug.write_report=診断レポートを書き出す

# en: Reset physics for all models
mmdhl.physics.reset_all=すべてのモデルの物理演算をリセット

# en: Clean up local ragdolls
mmdhl.physics.cleanup_ragdolls=ローカルラグドールをクリーンアップ

# en: Local ragdolls pause secondary physics while all Source bodies sleep, and resume when a body wakes. Cleanup affects only this client’s character model ragdolls.
mmdhl.physics.cleanup_help=ローカルラグドールは、Source の剛体がすべてスリープしている間は髪・服の物理演算を一時停止し、剛体が起きると再開します。クリーンアップの対象は、このクライアントのキャラクターモデルのラグドールだけです。

# en: Toggle physics on / off
mmdhl.physics.toggle=物理演算のオン / オフを切り替え

# en: Toggle physics shortcut (unassigned; Escape clears)
mmdhl.physics.toggle_shortcut=物理演算の切り替えショートカット（未割り当て。Escape でクリア）

# en: Reset all physics shortcut (unassigned; F8 is reserved for recording)
mmdhl.physics.reset_shortcut=全物理演算リセットのショートカット（未割り当て。F8 は録画用に予約済み）

# en: Restore Recommended Settings
mmdhl.physics.restore_defaults=推奨設定に戻す

# en: Recommended: Multicore CPU Processor, collisions with the character and objects, adaptive quality and automatic CPU thread count.
mmdhl.physics.restore_help=推奨：マルチコア CPU プロセッサ、キャラクターとオブジェクトとの衝突、適応型の品質、CPU スレッド数の自動設定。

# ===== Physics processor choices (secondary_backend.lua) =====

# en: Multicore CPU Processor
mmdhl.secondary.backend.multicore=マルチコア CPU プロセッサ

# en: MMD Compatibility Processor
mmdhl.secondary.backend.compatibility=MMD 互換プロセッサ

# en: Legacy Multicore CPU Processor
mmdhl.secondary.backend.legacy_multicore=旧マルチコア CPU プロセッサ

# en: OpenCL GPU Processor (Experimental)
mmdhl.secondary.backend.gpu=OpenCL GPU プロセッサ（実験的）

# en: Vulkan GPU Processor (Experimental)
mmdhl.secondary.backend.vulkan=Vulkan GPU プロセッサ（実験的）

# en: Unknown secondary backend.
mmdhl.secondary.error.unknown_backend=不明な物理演算バックエンドです。

# ===== Server notices (secondary_collision.lua) =====

# en: Secondary world contacts were disabled: {reason}. Details saved in mmd_hotloader/diagnostics.
mmdhl.secondary.error.contacts_disabled=髪・服の物理演算のワールド接触を無効にしました：{reason}。詳細は mmd_hotloader/diagnostics に保存されています。

