mmdhl.tool.prop.attach_help=キャラクター、NPC、ラグドール、プロップを右クリックすると、選択したプロップをそのボーンの1つに取り付けます。取り付け済みのプロップを右クリックすると、調整や取り外しができます。リロードで照準先のプロップをコピーします。

