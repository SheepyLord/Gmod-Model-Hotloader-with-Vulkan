# Builds the native modules and the patched DXVK renderer on Windows, runs the
# offline validation and uploads two GarrysMod folders (scripts/package-dropin.py):
# -vulkan with the native files and DXVK (bin/win64/d3d9.dll), and -opengl-remix
# with the native files only, for PCs where DXVK does not work or RTX Remix runs.
# The Linux job builds the native files for the x86-64 branch (the default branch is
# 32-bit on Linux, which Model Hotloader does not support) and the Linux renderer, and
# uploads two GarrysMod folders the same way: -linux64-vulkan with the native files and
# a replacement for the game's ToGL (bin/linux64/libtogl_client.so) that runs its
# Direct3D 9 on DXVK, and -linux64-opengl with the native files only (the game's own
# OpenGL renderer).
# The Lua addon is distributed through Workshop; the run's summary shows the
# native_policy.lua records for these binaries. It runs only when started from the
# Actions tab with "Run workflow" (any branch).
name: Build drop-in package

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 build and package
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check translations
        run: python scripts/check-i18n.py

      # The addon's Lua against simulated games; no native build needed.
      - name: Run offline Lua tests
        run: |
          python -m pip install lupa==2.8
          if ($LASTEXITCODE) { throw 'Installing lupa failed' }
          python scripts/check-lua-tests.py

      # Pinned sources, the CoACD wheel and the shader compiler. bootstrap.py
      # reuses them only when their recorded revisions still match the lock file.
      # The exclusion does not reach inside the cached vendor folder, so vendor/dxvk can
      # return patched; build-dxvk.ps1 resets it to the pinned tag when its patches changed.
      - name: Restore pinned dependencies
        uses: actions/cache@v5
        with:
          path: |
            vendor
            !vendor/dxvk
          key: vendor-${{ hashFiles('dependencies.lock.json', 'scripts/bootstrap.py', 'scripts/patch-bullet-threading.py', 'scripts/shaders.py') }}

      # The runner has no imported production models, so the dense-rig gate check
      # runs on the generated fixture only (the default cache is on drive H:).
      - name: Build and run native validation
        env:
          MMDHL_ASSET_CACHE: ${{ runner.temp }}/mmd_hotloader
        run: ./scripts/build.ps1

      - name: Run CTest suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Test installer
        run: python tests/test_native_installer.py

      # DXVK 3.1.1 (d3d9 only) with patches/dxvk, built with MSVC, Meson and Ninja;
      # its shaders use the glslang built above. The renderer's size and SHA-256
      # join the release record, so native_policy.lua knows the bundled d3d9.dll.
      - name: Build the DXVK renderer
        run: |
          python -m pip install meson==1.12.1 ninja
          if ($LASTEXITCODE) { throw 'Installing Meson failed' }
          ./scripts/build-dxvk.ps1
          python scripts/native_manifest.py --renderer build-dxvk/src/d3d9/d3d9.dll
          if ($LASTEXITCODE) { throw 'Recording the renderer failed' }

      - name: Stage GarrysMod folders
        id: package
        run: |
          $release = (Get-Content -LiteralPath build/bin/Release/native-release.json -Raw | ConvertFrom-Json).release
          $name = "Model-Hotloader-$release-$($env:GITHUB_SHA.Substring(0, 8))-win64"
          python scripts/package-dropin.py --name $name --renderer build-dxvk/src/d3d9/d3d9.dll
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          "name=$name" >> $env:GITHUB_OUTPUT

      # Each downloaded artifact is a zip: the GarrysMod folder (license notices in
      # GarrysMod/bin/win64/LICENSES) and INSTALL.txt.
      # Default package: native files and the DXVK renderer (its notices in bin/win64/DXVK-LICENSES).
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}-vulkan
          path: dist/${{ steps.package.outputs.name }}-vulkan/
          if-no-files-found: error

      # Native files only: for PCs where DXVK fails, or with RTX Remix or another d3d9.dll.
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}-opengl-remix
          path: dist/${{ steps.package.outputs.name }}-opengl-remix/
          if-no-files-found: error

  linux:
    name: Linux x86-64 build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      # Pinned sources, both CoACD wheels, the static ICU build (vendor/icu-linux64) and
      # DXVK's source (vendor/dxvk-native). bootstrap.py and build-icu.py reuse them only
      # while their pins still match; build-dxvk-linux.sh fetches the pinned DXVK again when
      # the cached one is another version, and resets it when its patches changed.
      - name: Restore pinned dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-linux64-${{ hashFiles('dependencies.lock.json', 'scripts/bootstrap.py', 'scripts/patch-bullet-threading.py', 'scripts/shaders.py', 'scripts/build-icu.py') }}

      # In the manylinux_2_28 container (AlmaLinux 8: glibc 2.28, GCC 14), so the files load
      # in every Steam Linux Runtime: bootstrap, ICU, the build, CTest, the renderer (DXVK
      # 3.1.1's d3d9 with patches/dxvk and patches/dxvk-linux, and renderer/togl, recorded in
      # the release record) and both packages (scripts/build-linux.sh). The container's files
      # belong to root; they are handed back to the runner's user for the cache and the upload.
      - name: Build, test and stage the GarrysMod folders
        id: package
        run: |
          release=$(sed -n 's/^set(MMDHL_RELEASE "\([^"]*\)".*/\1/p' CMakeLists.txt)
          name="Model-Hotloader-$release-${GITHUB_SHA::8}-linux64"
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_STEP_SUMMARY=/src/linux-summary.md \
            quay.io/pypa/manylinux_2_28_x86_64:2026.10.09-1 scripts/build-linux.sh linux64 "$name"
          sudo chown -R "$(id -u):$(id -g)" .
          cat linux-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Each artifact zip holds the GarrysMod folder (license notices in
      # GarrysMod/garrysmod/lua/bin/LICENSES) and INSTALL.txt. Zip downloads drop the
      # executable bit; the modules restore it on the import worker.
      # Vulkan package: native files and the renderer (bin/linux64, its notices in
      # bin/linux64/DXVK-LICENSES).
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}-vulkan
          path: dist/${{ steps.package.outputs.name }}-vulkan/
          if-no-files-found: error

      # Native files only: the game keeps its own OpenGL renderer.
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.name }}-opengl
          path: dist/${{ steps.package.outputs.name }}-opengl/
          if-no-files-found: error
